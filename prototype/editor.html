<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>醉隱 · 關卡編輯器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap">
<style>
  :root { --ink: #f3e9d2; --dim: rgba(243, 233, 210, .55); --line: rgba(243, 233, 210, .14); --bg: #0e0b1c; --panel: #151127; --accent: #e0a87a; --bad: #f0857a; --warn: #e8c46a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "KaiTi", serif; }
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 1px solid var(--line); padding: 3px 10px; cursor: pointer; }
  button:hover { border-color: var(--dim); }
  button.on { border-color: var(--accent); color: var(--accent); }
  input, select, textarea { background: #0c0918; border: 1px solid var(--line); padding: 3px 6px; width: 100%; }
  textarea { resize: vertical; min-height: 54px; }
  label { display: block; color: var(--dim); font-size: 13px; margin: 8px 0 2px; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { font-weight: normal; font-size: 20px; margin-right: 10px; letter-spacing: 2px; }
  header .gap { flex: 1; }
  #status { color: var(--dim); font-size: 13px; }
  main { display: grid; grid-template-columns: 220px 1fr 290px; min-height: 0; }
  aside { overflow: auto; padding: 10px 12px; border-right: 1px solid var(--line); }
  aside.right { border-right: 0; border-left: 1px solid var(--line); }
  h3 { font-weight: normal; font-size: 15px; color: var(--accent); margin: 14px 0 6px; letter-spacing: 1px; }
  h3:first-child { margin-top: 2px; }
  .list { display: flex; flex-direction: column; gap: 4px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border: 1px solid transparent; cursor: pointer; }
  .item:hover { border-color: var(--line); }
  .item.sel { border-color: var(--accent); }
  .item canvas { width: 64px; height: 36px; flex: none; image-rendering: pixelated; border: 1px solid var(--line); }
  .item span { font-size: 13px; line-height: 1.3; }
  .item small { display: block; color: var(--dim); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .row > * { flex: 1; min-width: 0; }
  .row.tight > * { flex: none; }
  #center { display: flex; flex-direction: column; min-width: 0; padding: 10px 14px; gap: 8px; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #grid { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; cursor: crosshair; touch-action: none; }
  #palette { display: flex; flex-wrap: wrap; gap: 4px; }
  #palette button { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 4px; font-size: 14px; }
  #palette canvas { width: 22px; height: 22px; }
  #hint { color: var(--dim); font-size: 13px; min-height: 20px; }
  .exits { display: grid; grid-template-columns: 34px 1fr; gap: 4px 6px; align-items: center; }
  .exits span { color: var(--dim); font-size: 13px; }
  #checks div { font-size: 13px; padding: 2px 0; }
  #checks .bad { color: var(--bad); }
  #checks .warn { color: var(--warn); }
  #checks .ok { color: #9fd3a8; }
  .dialogue-node { border:1px solid var(--line); padding:10px; margin:10px 0; border-radius:6px; }
  .dialogue-node.start { border-color:var(--accent); }
  .dialogue-node b { color:var(--accent); font-weight:normal; }
  .dialogue-choice { border-left:2px solid #8fffe2; padding-left:8px; margin:8px 0; }
  #npcPreview { padding:10px; background:#0c0918; border:1px solid var(--accent); margin-top:8px; white-space:pre-wrap; }
  .abil { display: flex; gap: 14px; }
  .abil label { display: flex; gap: 6px; align-items: center; color: var(--ink); margin: 2px 0; font-size: 15px; }
  .abil input { width: auto; }
  #sheet { position: fixed; inset: 0; background: rgba(8, 6, 18, .82); display: flex; align-items: center; justify-content: center; padding: 20px; }
  #sheet[hidden] { display: none; }
  #sheet > div { width: min(760px, 100%); background: var(--panel); border: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  #sheet textarea { height: 50vh; font: 12px/1.4 Consolas, monospace; }
  #sheet p { margin: 0; color: var(--dim); font-size: 13px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; overflow: auto; } aside { border: 0; border-bottom: 1px solid var(--line); } #stage { min-height: 50vh; } }
</style>
</head>
<body>
<header>
  <b>醉隱 · 關卡編輯器</b>
  <button id="bNew">新旅程</button>
  <button id="bSample">載入內建關卡</button>
  <button id="bImport">匯入 JSON</button>
  <button id="bExport">匯出 JSON</button>
  <button id="bTest">試玩目前房間</button>
  <span class="gap"></span>
  <button id="bUndo" title="Ctrl+Z">復原</button>
  <button id="bRedo" title="Ctrl+Y">重做</button>
  <span id="status"></span>
</header>
<main>
  <aside>
    <h3>天數</h3>
    <div class="list" id="maps"></div>
    <div class="row"><button id="mAdd">＋ 一天</button><button id="mDel">刪除</button></div>
    <div class="row"><button id="mUp">往前</button><button id="mDown">往後</button></div>
    <h3>房間</h3>
    <div class="list" id="rooms"></div>
    <div class="row"><button id="rAdd">＋ 房間</button><button id="rDup">複製</button><button id="rDel">刪除</button></div>
    <div class="row"><button id="rUp">往前</button><button id="rDown">往後</button></div>
  </aside>
  <section id="center">
    <div id="palette"></div>
    <div id="stage"><canvas id="grid" width="960" height="540"></canvas></div>
    <div id="hint"></div>
  </section>
  <aside class="right">
    <h3>房間</h3>
    <div class="row"><div><label>名稱</label><input id="fName"></div><div><label>ID</label><input id="fId"></div></div>
    <label>場景</label><select id="fTheme"></select>
    <label>出口（走出畫面那一邊會到哪裡）</label>
    <div class="exits" id="fExits"></div>
    <label>傳送門（在工具列選「傳送門」放到格子上）</label>
    <select id="fPortalCell" aria-label="選擇傳送門"></select>
    <select id="fPortalTarget" aria-label="傳送門目的地"></select>
    <p id="portalTarget" style="color:var(--dim);font-size:13px;margin:6px 0"></p>
    <label>吉姆第一次進房會說（一行一句）</label><textarea id="fLines"></textarea>
    <h3>NPC 對話</h3>
    <select id="fNpcCell" aria-label="選擇 NPC"></select>
    <div id="npcVisual"></div>
    <div id="npcPreview" hidden></div>
    <details><summary>進階：對話 JSON</summary>
    <label>對話邏輯 JSON（name / start / nodes）</label>
    <textarea id="fNpcDialogue" spellcheck="false" style="min-height:180px;font:12px Consolas,monospace"></textarea>
    <div class="row"><button id="bNpcApply">套用對話</button><button id="bNpcImport">匯入對話檔</button></div>
    </details>
    <div class="row"><button id="bNpcImportVisual">匯入對話檔</button><button id="bNpcPreview">試播對話</button></div>
    <p id="npcStatus" style="font-size:13px;color:var(--dim)">選 NPC 工具並點擊角色來編輯。</p>
    <h3>這一天</h3>
    <div class="row"><div><label>名稱</label><input id="dName"></div><div><label>ID</label><input id="dId"></div></div>
    <label>能力池</label><div class="abil" id="dAbil"></div>
    <label>開場一句</label><input id="dIntro">
    <label>結束一句</label><input id="dOutro">
    <h3>檢查</h3>
    <div id="checks"></div>
    <p style="color:var(--dim);font-size:13px;margin-top:14px">試玩：匯出 JSON 後，在遊戲裡按 Esc → 載入關卡 JSON，或直接把檔案拖進遊戲畫面。</p>
  </aside>
</main>
<div id="sheet" hidden>
  <div>
    <b id="sheetTitle"></b>
    <p id="sheetHint"></p>
    <textarea id="sheetText" spellcheck="false"></textarea>
    <div class="row tight"><button id="sheetMain"></button><button id="sheetAlt"></button><button id="sheetClose">關閉</button></div>
  </div>
</div>
<input id="file" type="file" accept=".json,application/json" hidden>
<input id="npcFile" type="file" accept=".json,application/json" hidden>
<dialog id="testScene" style="width:94vw;max-width:1400px;height:90vh;background:#111;color:white;border:1px solid #555;padding:12px">
  <button id="bCloseTest">結束試玩 · 返回編輯</button>
  <iframe id="testFrame" title="目前房間試玩" style="display:block;width:100%;height:calc(100% - 42px);border:0;margin-top:8px"></iframe>
</dialog>

      ex.appendChild(sel);
    }
    $('dName').value = m.name || ''; $('dId').value = m.id; $('dIntro').value = m.intro || ''; $('dOutro').value = m.outro || '';
    const ab = $('dAbil'); ab.innerHTML = '';
    for (const [id, label] of ABIL) {
      const l = document.createElement('label'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = m.abilities.includes(id);
      cb.onchange = () => { snapshot(); m.abilities = ABIL.map(a => a[0]).filter(a => a === id ? cb.checked : m.abilities.includes(a)); changed(); };
      l.append(cb, label); ab.appendChild(l);
    }
    render(); runChecks();
  }
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

  // field bindings
  $('fName').oninput = e => { room().name = e.target.value; changed(false); refreshListsSoon(); };
  $('fId').onchange = e => {
    const r = room(), old = r.id, id = e.target.value.trim();
    if (!id || map().rooms.some(x => x !== r && x.id === id)) { e.target.value = old; flash('這個 ID 已經有了'); return; }
    snapshot(); r.id = id;
    for (const x of map().rooms) if (x.portalTarget === old) x.portalTarget = id;
    for (const x of map().rooms) for (const key in x.portalTargets || {}) if (x.portalTargets[key] === old) x.portalTargets[key] = id;
    for (const x of map().rooms) for (const s in x.exits || {}) if (x.exits[s] === old) x.exits[s] = id;
    changed();
  };
  $('fTheme').innerHTML = THEMES.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  $('fTheme').onchange = e => { snapshot(); room().theme = e.target.value; changed(); };
  $('fPortalTarget').onchange = e => {
    snapshot();
    const r = room(), key = $('fPortalCell').value;
    r.portalTargets ||= {};
    if (e.target.value === 'auto') delete r.portalTargets[key];
    else r.portalTargets[key] = e.target.value === 'end' ? null : map().rooms[Number(e.target.value.slice(5))].id;
    changed(false);
  };
  $('fPortalCell').onchange = () => render();
  $('fLines').oninput = e => { room().lines = e.target.value.split('\n').map(s => s.trim()).filter(Boolean); changed(false); };
  $('dName').oninput = e => { map().name = e.target.value; changed(false); refreshListsSoon(); };
  $('dId').onchange = e => { const id = e.target.value.trim(); if (!id || data.maps.some(m => m !== map() && m.id === id)) { e.target.value = map().id; flash('這個 ID 已經有了'); return; } snapshot(); map().id = id; changed(); };
  $('dIntro').oninput = e => { map().intro = e.target.value; changed(false); };
  $('dOutro').oninput = e => { map().outro = e.target.value; changed(false); };
  let listTimer = 0;
  function refreshListsSoon() { clearTimeout(listTimer); listTimer = setTimeout(() => { const a = document.activeElement, id = a && a.id; refresh(); if (id) { $(id).focus(); } }, 500); }

  // map & room management
  $('mAdd').onclick = () => { snapshot(); let n = data.maps.length + 1; while (data.maps.some(m => m.id === `day-${n}`)) n++; data.maps.push(blankMap(n)); mi = data.maps.length - 1; ri = 0; changed(); };
  $('mDel').onclick = () => { if (data.maps.length < 2) return flash('至少要留一天'); snapshot(); data.maps.splice(mi, 1); mi = Math.max(0, mi - 1); ri = 0; changed(); };
  $('mUp').onclick = () => { if (!mi) return; snapshot(); [data.maps[mi - 1], data.maps[mi]] = [data.maps[mi], data.maps[mi - 1]]; mi--; changed(); };
  $('mDown').onclick = () => { if (mi >= data.maps.length - 1) return; snapshot(); [data.maps[mi + 1], data.maps[mi]] = [data.maps[mi], data.maps[mi + 1]]; mi++; changed(); };
  function freeRoomId() { const n = mi + 1; let k = map().rooms.length + 1; while (map().rooms.some(r => r.id === `${n}-${k}`)) k++; return `${n}-${k}`; }
  $('rAdd').onclick = () => {
    snapshot(); const prev = room(), r = blankRoom(freeRoomId(), '新房間'); r.theme = prev.theme;
    map().rooms.splice(ri + 1, 0, r);
    if (prev.exits && prev.exits.right === null) prev.exits.right = r.id;   // chain it after the current room
    ri++; changed();
  };
  $('rDup').onclick = () => { snapshot(); const r = clone(room()); r.id = freeRoomId(); r.name += '（複製）'; map().rooms.splice(ri + 1, 0, r); ri++; changed(); };
  $('rDel').onclick = () => {
    if (map().rooms.length < 2) return flash('一天至少要有一間房');
    snapshot(); const gone = room().id; map().rooms.splice(ri, 1);
    for (const x of map().rooms) if (x.portalTarget === gone) x.portalTarget = null;
    for (const x of map().rooms) for (const key in x.portalTargets || {}) if (x.portalTargets[key] === gone) x.portalTargets[key] = null;
    for (const x of map().rooms) for (const s in x.exits || {}) if (x.exits[s] === gone) delete x.exits[s];
    ri = Math.max(0, ri - 1); changed();
  };
  $('rUp').onclick = () => { const rs = map().rooms; if (!ri) return; snapshot(); [rs[ri - 1], rs[ri]] = [rs[ri], rs[ri - 1]]; ri--; changed(); };
  $('rDown').onclick = () => { const rs = map().rooms; if (ri >= rs.length - 1) return; snapshot(); [rs[ri + 1], rs[ri]] = [rs[ri], rs[ri + 1]]; ri++; changed(); };

  // ---------- painting ----------
  const pal = $('palette');
  TILES.forEach((t, i) => {
    const b = document.createElement('button'); b.title = `${t.tip}（${i < 9 ? i + 1 : i === 9 ? 0 : ''}）`.replace('（）', '');
    const c = document.createElement('canvas'); c.width = c.height = 44; const x = c.getContext('2d');
    if (t.ch === '.') { x.strokeStyle = '#f3e9d2'; x.lineWidth = 3; x.beginPath(); x.moveTo(10, 10); x.lineTo(34, 34); x.moveTo(34, 10); x.lineTo(10, 34); x.stroke(); }
    else if (t.ch === 'P') { x.fillStyle = '#f3e9d2'; x.beginPath(); x.arc(22, 14, 8, 0, Math.PI * 2); x.fill(); x.fillRect(15, 22, 14, 18); }
    else if (t.ch === 'R') { x.translate(0, 8); drawTile(x, 'R', 0, 0, 30, 'office'); }
    else drawTile(x, t.ch, 0.2, 0.2, 30, 'office');
    b.append(c, t.name); b.dataset.ch = t.ch;
    b.onclick = () => setTool(t.ch);
    pal.appendChild(b);
  });
  function setTool(ch) { tool = ch; pal.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.ch === ch)); const t = TILES.find(x => x.ch === ch); $('hint').textContent = `${t.name}：${t.tip}。左鍵畫、右鍵擦、Shift 拖曳畫矩形。`; }

  let painting = null, hover = null;
  function cellAt(e) { const r = grid.getBoundingClientRect(); return [Math.max(0, Math.min(COLS - 1, Math.floor((e.clientX - r.left) / r.width * COLS))), Math.max(0, Math.min(ROWS - 1, Math.floor((e.clientY - r.top) / r.height * ROWS)))]; }
  function rectFrom() { if (painting && painting.rect) { const a = painting.start, b = hover; return [[Math.min(a[0], b[0]), Math.min(a[1], b[1])], [Math.max(a[0], b[0]), Math.max(a[1], b[1])]]; } return [hover, hover]; }
  function setCell(x, y, ch) {
    const r = room();
    if (ch !== 'N' && r.npcs) delete r.npcs[`${x},${y}`];
    if (ch === 'N') { r.npcs ||= {}; r.npcs[`${x},${y}`] ||= { name: 'NPC', start: 'hello', nodes: { hello: { text: '你好！', next: null } } }; }
    if (ch !== 'O' && r.portalTargets) delete r.portalTargets[`${x},${y}`];
    if (ch === 'P') r.tiles = r.tiles.map(row => row.replace(/P/g, '.'));
    r.tiles[y] = r.tiles[y].slice(0, x) + ch + r.tiles[y].slice(x + 1);
  }
  grid.addEventListener('contextmenu', e => e.preventDefault());
  grid.addEventListener('pointerdown', e => {
    const [x, y] = cellAt(e);
    if (e.button === 0 && tool === 'N' && room().tiles[y][x] === 'N' && !e.shiftKey) {
      $('fNpcCell').value = `${x},${y}`; render(); return;
    }
    if (e.button === 0 && tool === 'O' && room().tiles[y][x] === 'O' && !e.shiftKey) {
      $('fPortalCell').value = `${x},${y}`; render(); return;
    }
    grid.setPointerCapture(e.pointerId);
    snapshot();
    const ch = e.button === 2 ? '.' : tool;
    painting = { ch, rect: e.shiftKey && ch !== 'P', start: [x, y] };
    hover = [x, y];
    if (!painting.rect) { setCell(x, y, ch); changed(false); }
  });
  grid.addEventListener('pointermove', e => {
    const c = cellAt(e); hover = c;
    $('hint').textContent = `x ${c[0]} · y ${c[1]}` + (painting && painting.rect ? '　放開滑鼠填滿矩形' : '');
    if (painting && !painting.rect && painting.ch !== 'P') { setCell(c[0], c[1], painting.ch); changed(false); return; }
    render();
  });
  grid.addEventListener('pointerleave', () => { if (!painting) { hover = null; render(); } });
  addEventListener('pointerup', () => {
    if (!painting) return;
    if (painting.rect && hover) { const [a, b] = rectFrom(); for (let y = a[1]; y <= b[1]; y++) for (let x = a[0]; x <= b[0]; x++) setCell(x, y, painting.ch); }
    painting = null; changed(false);
  });

  // ---------- undo / keys ----------
  function doUndo() { if (!undo.length) return; redo.push(JSON.stringify(data)); data = JSON.parse(undo.pop()); changed(); }
  function doRedo() { if (!redo.length) return; undo.push(JSON.stringify(data)); data = JSON.parse(redo.pop()); changed(); }
  $('bUndo').onclick = doUndo; $('bRedo').onclick = doRedo;
  addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); doRedo(); return; }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    const n = '1234567890'.indexOf(e.key); if (n >= 0 && TILES[n]) setTool(TILES[n].ch);
  });

  // ---------- import / export ----------
  let flashTimer = 0;
  function flash(msg) { $('status').textContent = msg; clearTimeout(flashTimer); flashTimer = setTimeout(runChecks, 2200); }
  function normalize(d) {
    for (const m of d.maps) { m.abilities = m.abilities || []; m.intro = m.intro || ''; m.outro = m.outro || ''; for (const r of m.rooms) { r.exits = r.exits || {}; delete r.notes; r.lines = r.lines || []; r.theme = r.theme || 'street'; } }
    return d;
  }
  function accept(text, from) {
    let d;
    try { d = JSON.parse(text); } catch (e) { flash(`${from}不是有效的 JSON`); return false; }
    if (!d || d.format !== 'drunken-rooms' || d.version !== 2 || !Array.isArray(d.maps) || !d.maps.length) { flash(`${from}不是 drunken-rooms v2`); return false; }
    for (const m of d.maps) for (const r of m.rooms || []) if (!Array.isArray(r.tiles) || r.tiles.length !== ROWS || r.tiles.some(row => typeof row !== 'string' || row.length !== COLS)) { flash(`${from}的 ${r.id} 不是 ${COLS}×${ROWS}`); return false; }
    snapshot(); data = normalize(d); mi = ri = 0; changed(); flash(`已載入${from}`); return true;
  }
  function exportText() {
    // keep each tile row on its own line so the file stays readable
    const out = clone(data);
    for (const m of out.maps) for (const r of m.rooms) { if (!r.lines.length) delete r.lines; delete r.notes; }
    return JSON.stringify(out, null, 2);
  }
  let testSnapshot = null;
  $('bTest').onclick = () => {
    const { errors } = check(data);
    if (errors.length) return flash(`無法試玩：${errors[0]}`);
    testSnapshot = { type: 'drunk-editor-test', campaign: exportText(), mapIndex: mi, roomId: room().id };
    $('testScene').showModal();
    $('testFrame').src = 'game.html?editorTest=1';
  };
  addEventListener('message', e => {
    if (e.source !== $('testFrame').contentWindow || e.data?.type !== 'drunk-test-ready' || !testSnapshot) return;
    e.source.postMessage(testSnapshot, '*');
    $('testFrame').focus();
  });
  $('bCloseTest').onclick = () => $('testScene').close();
  $('testScene').addEventListener('close', () => {
    testSnapshot = null;
    $('testFrame').src = 'about:blank';
    $('bTest').focus();
  });
  function openSheet(title, hint, text, main, alt) {
    $('sheetTitle').textContent = title; $('sheetHint').textContent = hint; $('sheetText').value = text; $('sheetText').readOnly = !!text;
    const [ml, mf] = main, [al, af] = alt || [];
    $('sheetMain').textContent = ml; $('sheetMain').onclick = mf;
    $('sheetAlt').hidden = !alt; if (alt) { $('sheetAlt').textContent = al; $('sheetAlt').onclick = af; }
    $('sheet').hidden = false;
  }
  $('sheetClose').onclick = () => { $('sheet').hidden = true; };
  $('bExport').onclick = () => {
    const { errors } = check(data), text = exportText();
    openSheet('匯出 JSON', errors.length ? `還有 ${errors.length} 個錯誤，遊戲會拒絕載入：${errors[0]}` : '下載檔案後，在遊戲按 Esc → 載入關卡 JSON，或把檔案拖進遊戲畫面。下載被擋的話，複製下面的文字存成 .json。', text,
      ['下載 drunken-rooms.json', () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = 'drunken-rooms.json'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { flash('這個環境擋下了下載，請改用複製'); } }],
      ['複製文字', () => { const t = $('sheetText'); t.select(); try { navigator.clipboard.writeText(text).then(() => flash('已複製'), () => { document.execCommand('copy'); flash('已複製'); }); } catch (e) { document.execCommand('copy'); flash('已複製'); } }]);
  };
  $('bImport').onclick = () => openSheet('匯入 JSON', '選一個 .json 檔，或把 JSON 文字貼到下面。', '',
    ['選擇檔案', () => $('file').click()],
    ['載入貼上的文字', () => { if (accept($('sheetText').value, '貼上的文字')) $('sheet').hidden = true; }]);
  $('file').onchange = () => { const f = $('file').files[0]; if (f) f.text().then(t => { if (accept(t, f.name)) $('sheet').hidden = true; }); $('file').value = ''; };
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) f.text().then(t => accept(t, f.name)); });
  $('bNew').onclick = () => { snapshot(); data = blankCampaign(); mi = ri = 0; changed(); flash('開了一段新旅程（復原可以回去）'); };
  $('bSample').onclick = () => { if (!SAMPLE) return flash('這份編輯器沒有附內建關卡'); snapshot(); data = normalize(clone(SAMPLE)); mi = ri = 0; changed(); flash('已載入遊戲內建的關卡'); };

  data = normalize(load() || (SAMPLE ? clone(SAMPLE) : blankCampaign()));
  setTool('#');
  refresh();
  window.editorDebug = { get data() { return data; }, check };
})();
</script>
</body>
</html>
