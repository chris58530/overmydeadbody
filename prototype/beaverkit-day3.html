    return Math.min(7, Math.floor(t / 0.055));
  }
  function sprite(anim, f) {
    if (anim === 'idle') return [img['idle' + f], 0];
    if (anim === 'drink') return [img['drink' + f], 0];
    return [img[anim], f * 512];
  }

  // Jim's pose from what he is doing right now. The jump strip is a whole hop (crouch, rise, apex, land) and the
  // fall strip is trip-and-pass-out, so frames are chosen by state and velocity rather than played by time.
  function bodyPose(g) {
    const b = g.body;
    if (g.drinkT > 0) return ['drink', Math.min(6, Math.floor((TUNING.drink - g.drinkT) / 0.11))];
    if (g.state === 'lift') return ['fall', 3];
    if (g.state === 'charge') return ['fall', 4];
    if (g.state === 'thrown') return ['fall', 0];
    if (g.state === 'recover' || (b.grounded && b.landT > 0)) return ['jump', 7];
    if (!b.grounded) return ['jump', b.vy < -260 ? 1 + (Math.floor(b.animTime / 0.09) % 2) : b.vy < 220 ? 3 : 5];
    if (Math.abs(b.vx) > 25) return ['run', Math.floor(b.animTime / 0.067) % 8];
    return ['idle', Math.floor(b.animTime / 0.14) % 3];
  }

  // squash > 1 stretches tall and thin, < 1 flattens; scaled about the feet
  function drawFrame(anim, f, x, y, face, size, color, alpha, squash = 1) {
    const [im, sx] = sprite(anim, f);
    ctx.save(); ctx.translate(x, y); ctx.scale((face < 0 ? -1 : 1) / squash, squash);
    if (!ok(im)) { ctx.globalAlpha = alpha; ctx.fillStyle = color || '#f3e9d2'; ctx.fillRect(-16, -64, 32, 64); ctx.restore(); return; }
    if (color) {
      tctx.globalCompositeOperation = 'source-over'; tctx.globalAlpha = 1; tctx.clearRect(0, 0, 512, 512);
      tctx.drawImage(im, sx, 0, 512, 512, 0, 0, 512, 512);
      tctx.globalCompositeOperation = 'source-atop'; tctx.globalAlpha = 0.8; tctx.fillStyle = color; tctx.fillRect(0, 0, 512, 512);
      ctx.globalAlpha = alpha; ctx.drawImage(tint, -size / 2, -size * 0.91, size, size);
    } else ctx.drawImage(im, sx, 0, 512, 512, -size / 2, -size * 0.91, size, size);
    ctx.restore();
  }

  // The slot card rides above Jim's head, like Twisted Fate's Pick a Card; a light vignette marks the slow motion.
  function drawSlot() {
    const g = game, sl = g.slot;
    if (!sl) return;
    const id = sl.pool[sl.index], ab = ABILITIES[id], b = g.body;
    const v = ctx.createRadialGradient(W / 2, H / 2, 240, W / 2, H / 2, 760);
    v.addColorStop(0, 'rgba(14,11,28,0)'); v.addColorStop(1, 'rgba(8,6,18,.45)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    const reveal = sl.mode === 'reveal', pop = reveal ? 1 + 0.25 * Math.max(0, 1 - sl.t / 0.2) : 1;
    const cw = 66, ch = 88;
    const x = Math.max(cw, Math.min(W - cw, b.x)), y = Math.max(ch / 2 + 14, b.y - 182);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(g.time * 3) * 0.04);
    ctx.scale(pop * (reveal ? 1 : 0.15 + 0.85 * sl.flip), pop);
    if (reveal) {
      // hand-drawn burst around the chosen card
      ctx.strokeStyle = ab.tint; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2 + 0.2, r0 = 56 + rnd(i, 1, 4) * 6, r1 = r0 + 12 + rnd(i, 2, 4) * 12;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0 * 0.8, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * r1 * 0.8, Math.sin(a) * r1); ctx.stroke();
      }
    }
    ctx.fillStyle = '#f1e6cf'; ctx.strokeStyle = reveal ? ab.tint : '#2a2244'; ctx.lineWidth = reveal ? 4 : 2.5;
    ctx.beginPath(); ctx.moveTo(-cw / 2 + 3, -ch / 2); ctx.lineTo(cw / 2, -ch / 2 + 2); ctx.lineTo(cw / 2 - 2, ch / 2); ctx.lineTo(-cw / 2, ch / 2 - 1); ctx.closePath(); ctx.fill(); ctx.stroke();
    const bob = reveal ? 0 : Math.sin(g.time * (sl.mode === 'spin' ? 22 : 9)) * 2;
    const bt = bottles[ab.bottle]; if (bt) ctx.drawImage(bt, -28, -40 + bob, 56, 56);
    ctx.textAlign = 'center'; ctx.font = `16px ${FONT}`; ctx.fillStyle = ab.ink; ctx.fillText(ab.name, 0, 34);
    ctx.restore();
    if (sl.mode === 'spin') text('K', x, y + ch / 2 + 22, 16, 'center', 0.5 + 0.3 * Math.sin(g.time * 8));
  }

  // The drunk card waits above Jim's head with a draining bar; it blinks in the last 1.5 s.
  function drawReady() {
    const g = game, r = g.ready;
    if (!r || g.slot) return;
    const ab = ABILITIES[r.id], b = g.body, cw = 66, ch = 88;
    const x = Math.max(cw, Math.min(W - cw, b.x)), y = Math.max(ch / 2 + 14, b.y - 182);
    const blink = r.t < 1.5 ? 0.35 + 0.65 * Math.abs(Math.sin(g.time * 10)) : 1;
    ctx.save(); ctx.globalAlpha = blink; ctx.translate(x, y); ctx.rotate(Math.sin(g.time * 3) * 0.04);
    ctx.fillStyle = '#f1e6cf'; ctx.strokeStyle = ab.tint; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-cw / 2 + 3, -ch / 2); ctx.lineTo(cw / 2, -ch / 2 + 2); ctx.lineTo(cw / 2 - 2, ch / 2); ctx.lineTo(-cw / 2, ch / 2 - 1); ctx.closePath(); ctx.fill(); ctx.stroke();
    const bt = bottles[ab.bottle]; if (bt) ctx.drawImage(bt, -28, -40, 56, 56);
    ctx.textAlign = 'center'; ctx.font = `16px ${FONT}`; ctx.fillStyle = ab.ink; ctx.fillText(ab.name, 0, 34);
    ctx.fillStyle = 'rgba(28,22,54,.5)'; ctx.fillRect(-cw / 2, ch / 2 + 6, cw, 6);
    ctx.fillStyle = ab.tint; ctx.fillRect(-cw / 2, ch / 2 + 6, cw * (r.t / TUNING.holdTime), 6);
    ctx.restore();
    text('K 發動', x, y - ch / 2 - 10, 15, 'center', 0.55 + 0.3 * Math.sin(g.time * 6));
  }

  // Day two leaves the office: sodium street lamps over a magenta night.
  function drawDynamicTiles() {
    const g = game;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const t = g.tiles[y][x], tx = x * T, ty = y * T;
      if (t === 'H') {
        // a sensor glows while something is in it
        ctx.save(); ctx.fillStyle = GREY.sensor; ctx.globalAlpha = g.sensedBy[g.room.groups?.[`${x},${y}`] || 0] ? 0.4 : 0.14; ctx.fillRect(tx, ty, T, T);
        ctx.globalAlpha = 0.7; ctx.strokeStyle = GREY.sensor; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.strokeRect(tx + 1, ty + 1, T - 2, T - 2); ctx.restore();
      } else if (t === 'G') {
        ctx.fillStyle = GREY.sensor; ctx.fillRect(tx + 1, ty + 1, T - 2, T - 2);
        ctx.fillStyle = 'rgba(10,50,48,.55)'; for (let i = 0; i < 3; i++) ctx.fillRect(tx + 1, ty + 6 + i * 12, T - 2, 4);
      } else if (t === 'Z') {
        // shutter housing: a steel box with a light that blinks red before the drop
        const s = g.shutters.find(s => s.x === x && s.y === y), beat = s && g.shutterBeat(s);
        ctx.fillStyle = GREY.shutterInk; ctx.fillRect(tx, ty, T, T);
        ctx.fillStyle = GREY.shutter; ctx.fillRect(tx + 3, ty + T - 8, T - 6, 8);
        ctx.fillStyle = beat?.warn ? (Math.floor(g.time * 12) % 2 ? '#ff4d4d' : '#5a1a1a') : beat?.down ? '#ff4d4d' : '#5fd17a';
        ctx.fillRect(tx + T / 2 - 5, ty + 8, 10, 10);
      } else if (t === 'V') {
        ctx.fillStyle = '#2b2d36'; ctx.fillRect(tx, ty, T, T);
        ctx.fillStyle = GREY.beam; ctx.fillRect(tx + T / 2 - 7, ty + T - 10, 14, 10);
      } else if (t === 'N') {
        ctx.fillStyle = '#b9a0d8'; ctx.fillRect(tx + T / 2 - 16, ty + T - 72, 32, 72);
        text(g.room.npcs?.[`${x},${y}`]?.name || 'NPC', tx + T / 2, ty - T, 16, 'center');
      } else if (t === 'O') {
        // the exit: a door outline two tiles tall standing on the tile's floor
        ctx.strokeStyle = GREY.exit; ctx.lineWidth = 3; ctx.globalAlpha = 0.7 + 0.3 * Math.sin(g.time * 4);
        ctx.strokeRect(tx + 6, ty - T + 6, T - 12, T * 2 - 6);
        ctx.globalAlpha = 1; ctx.font = `bold 11px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = GREY.exit;
        ctx.fillText('EXIT', tx + T / 2, ty - T - 4);
      } else if (t === 'C' && painted() && spriteOf('boxes')) {
        const c = g.crumbles.get(x + ',' + y), jx = c ? (Math.random() - 0.5) * 4 : 0;
        ctx.drawImage(spriteOf('boxes'), tx + jx - 2, ty - 4, T + 4, T + 4);
      } else if (t === 'C') {
        // crumbling boxes: a dashed crate, shaking once stood on
        const c = g.crumbles.get(x + ',' + y), jx = c ? (Math.random() - 0.5) * 4 : 0;
        ctx.fillStyle = 'rgba(217,137,59,.45)'; ctx.fillRect(tx + 2 + jx, ty + 2, T - 4, T - 4);
        ctx.setLineDash([5, 4]); ctx.strokeStyle = GREY.crate; ctx.lineWidth = 2; ctx.strokeRect(tx + 2 + jx, ty + 2, T - 4, T - 4); ctx.setLineDash([]);
      } else if ((t === '<' || t === '>') && !painted()) {
        const d = t === '>' ? 1 : -1, off = ((g.time * TUNING.belt * d) % 20 + 20) % 20;
        ctx.fillStyle = GREY.belt; ctx.fillRect(tx, ty, T, T);
        ctx.save(); ctx.beginPath(); ctx.rect(tx, ty, T, 12); ctx.clip();
        ctx.strokeStyle = '#c8ccd6'; ctx.lineWidth = 2;
        for (let k = -20; k < T + 20; k += 20) { const cx = tx + k + off; ctx.beginPath(); ctx.moveTo(cx - 4 * d, ty + 2); ctx.lineTo(cx + 3 * d, ty + 6); ctx.lineTo(cx - 4 * d, ty + 10); ctx.stroke(); }
        ctx.restore();
      }
    }
  }

  // Doors that are open show as a dashed outline; beams run down from their fixtures.
  function drawMachines() {
    const g = game;
    ctx.save(); ctx.strokeStyle = GREY.sensor; ctx.globalAlpha = 0.4; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    for (const d of g.doors) if (g.tiles[d.y][d.x] !== 'G') ctx.strokeRect(d.x * T + 2, d.y * T + 2, T - 4, T - 4);
    ctx.restore();
    for (const s of g.shutters) {
      const r = g.shutterRect(s);
      if (!r) continue;
      ctx.fillStyle = GREY.shutter; ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = GREY.shutterInk; for (let yy = r.y + 8; yy < r.y + r.h; yy += 10) ctx.fillRect(r.x, yy, r.w, 2);
      ctx.fillStyle = '#e8c34a'; ctx.fillRect(r.x, r.y + r.h - 5, r.w, 5);
    }
    for (const v of g.beams) {
      const top = (v.y + 1) * T, end = g.beamEnd(v), cx = v.x * T + T / 2;
      ctx.fillStyle = GREY.beam; ctx.globalAlpha = 0.25 + 0.1 * Math.sin(g.time * 20); ctx.fillRect(cx - 5, top, 10, end - top);
      ctx.globalAlpha = 1; ctx.fillRect(cx - 1.5, top, 3, end - top);
    }
    ctx.globalAlpha = 1;
  }

  // Entities as their hit boxes: a guard or chair is the box that kills, with an arrow for where it walks.
  function drawEntities() {
    const g = game, art = painted();
    for (const e of g.entities) {
      // painted rooms: the same things at the same collision sizes, drawn from the sprite sheet
      if (art && e.kind === 'patrol' && drawSprite(e.skin === 'chair' ? 'chair' : 'guard', e.x, e.y + 4, e.skin === 'chair' ? 58 : 120, e.dir, e.alive ? 1 : 0.6)) continue;
      if (art && e.kind === 'cart' && drawSprite('cart', e.x, e.y + e.h + 12, 104, e.dir)) continue;
      if (art && e.kind === 'corpse' && drawSprite('body', e.x, e.y + TUNING.corpseH + 6, 112, e.face, 0.92)) continue;
      if (art && e.kind === 'bottle' && (!e.got || g.looped) && drawSprite(e.got ? 'bottle-empty' : 'bottle', e.x, e.y + 20, e.got ? 18 : 26, 1, e.got ? 0.45 : 1)) {
        if (e.corpse) {
          ctx.save(); ctx.strokeStyle = GREY.corpse; ctx.globalAlpha = 0.35; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
          ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.corpse.x, e.corpse.y + TUNING.corpseH / 2); ctx.stroke(); ctx.restore();
        } else if (e === g.anchor && g.targetStage() === 1) {
          ctx.save(); ctx.strokeStyle = GREY.corpse; ctx.globalAlpha = 0.35 + 0.25 * Math.sin(g.mapTime * 6); ctx.lineWidth = 2;
          ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.arc(e.x, e.y, 24, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }
        continue;
      }
      if (e.kind === 'patrol') {
        ctx.save(); ctx.translate(e.x, e.y - e.h / 2);
        if (!e.alive) ctx.rotate(e.t * 9 * Math.sign(e.vx || 1));
        ctx.globalAlpha = e.alive ? 1 : 0.6;
        ctx.fillStyle = GREY.patrol; ctx.fillRect(-e.w / 2, -e.h / 2, e.w, e.h);
        ctx.strokeStyle = '#5a1a18'; ctx.lineWidth = 2; ctx.strokeRect(-e.w / 2, -e.h / 2, e.w, e.h);
        ctx.fillStyle = '#fff3ec'; ctx.beginPath();
        ctx.moveTo(e.dir * (e.w / 2 + 12), 0); ctx.lineTo(e.dir * (e.w / 2 + 2), -7); ctx.lineTo(e.dir * (e.w / 2 + 2), 7); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (e.kind === 'cap' && !e.got) {
        drawCap(e);
      } else if (e.kind === 'bottle' && (!e.got || g.looped)) {
        // under loop rules a drunk bottle shows as an outline until it comes back
        drawBottle(e.x, e.y, 1, e.got ? 0.25 : 1);
        // a bottle holding a body: a thread to the body and a ring round the outline, both in the body's colour
        if (e.corpse) {
          ctx.save(); ctx.strokeStyle = GREY.corpse; ctx.globalAlpha = 0.35; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
          ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.corpse.x, e.corpse.y + TUNING.corpseH / 2); ctx.stroke(); ctx.setLineDash([]);
          ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.arc(e.x, e.y, 22, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        } else if (e === g.anchor && g.targetStage() === 1) {
          // where J sends Jim now: the ring breathes until he uses it
          ctx.save(); ctx.strokeStyle = GREY.corpse; ctx.globalAlpha = 0.35 + 0.25 * Math.sin(g.mapTime * 6); ctx.lineWidth = 2;
          ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.arc(e.x, e.y, 22, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }
      } else if (e.kind === 'corpse') {
        // Jim lying flat, head toward where he faced: the top edge is the plank
        const h = TUNING.corpseH, x0 = e.x - e.w / 2;
        ctx.fillStyle = GREY.corpse; ctx.fillRect(x0, e.y, e.w, h);
        ctx.strokeStyle = GREY.corpseInk; ctx.lineWidth = 2; ctx.strokeRect(x0, e.y, e.w, h);
        ctx.fillStyle = GREY.corpseInk; ctx.beginPath(); ctx.arc(e.x + e.face * (e.w / 2 - 12), e.y + h / 2, 6, 0, Math.PI * 2); ctx.fill();
      } else if (e.kind === 'cart') {
        ctx.fillStyle = GREY.cart; ctx.fillRect(e.x - e.w / 2, e.y, e.w, e.h);
        ctx.fillStyle = GREY.cartInk; ctx.beginPath(); ctx.arc(e.x - e.w / 4, e.y + e.h + 5, 6, 0, Math.PI * 2); ctx.arc(e.x + e.w / 4, e.y + e.h + 5, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#eaf6fd'; ctx.beginPath();
        ctx.moveTo(e.x + e.dir * 14, e.y + e.h / 2); ctx.lineTo(e.x - e.dir * 4, e.y + 3); ctx.lineTo(e.x - e.dir * 4, e.y + e.h - 3); ctx.closePath(); ctx.fill();
      } else if (e.kind === 'faller' && e.phase !== 'gone') {
        if (e.phase !== 'fall') { ctx.strokeStyle = 'rgba(232,195,74,.5)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(e.x, 0); ctx.lineTo(e.x, e.y); ctx.stroke(); ctx.setLineDash([]); }
        const wob = e.phase === 'warn' ? Math.sin(e.t * 60) * 3 : 0;
        ctx.fillStyle = GREY.faller; ctx.fillRect(e.x - e.w / 2 + wob, e.y, e.w, e.h);
        ctx.fillStyle = '#3a2e08'; ctx.font = `bold ${Math.min(24, e.h)}px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('!', e.x + wob, e.y + e.h - 3);
      }
    }
    // the jump from the body to the bottle: a streak that fades
    if (g.warp) {
      const w = g.warp;
      ctx.save(); ctx.strokeStyle = GREY.corpse; ctx.globalAlpha = w.t / TUNING.warpTime; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(w.x0, w.y0); ctx.lineTo(w.x1, w.y1); ctx.stroke(); ctx.restore();
    }
  }

  // Name tags for the special objects, so anyone looking at the greybox knows what each block is:
  // one tag per connected run of a tile, and one per entity, just above it.
  const TILE_NAMES = { '^': '碎玻璃', '=': '單向平台', B: '木箱', C: '紙箱', '<': '輸送帶', '>': '輸送帶', S: '沙發', H: '感應區', G: '感應門', V: '雷射' };
  let tagKey = '', tileTags = [];
  function tileTagsNow(g) {
    // crumbled boxes do not bump tilesVersion, so the boxes that are gone are part of the key
    const key = g.room.id + ':' + g.tilesVersion + ':' + [...g.crumbles].filter(([, c]) => c.phase === 'gone').map(([k]) => k).join(';');
    if (key === tagKey) return tileTags;
    const seen = new Set(), tags = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const name = TILE_NAMES[g.tiles[y][x]];
      if (!name || seen.has(x + ',' + y)) continue;
      const stack = [[x, y]], cells = [];
      while (stack.length) {
        const [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS || seen.has(cx + ',' + cy) || TILE_NAMES[g.tiles[cy][cx]] !== name) continue;
        seen.add(cx + ',' + cy); cells.push([cx, cy]);
        stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
      }
      const top = Math.min(...cells.map(c => c[1])), row = cells.filter(c => c[1] === top).map(c => c[0]);
      tags.push([name, (Math.min(...row) + Math.max(...row) + 1) / 2 * T, top * T - 4]);
    }
    tagKey = key; tileTags = tags;
    return tags;
  }
  function drawTags() {
    if (painted()) return;
    const g = game, tags = tileTagsNow(g).slice();
    for (const e of g.entities) {
      if (e.kind === 'patrol' && e.alive) tags.push([e.skin === 'chair' ? '轉椅' : '警衛', e.x, e.y - e.h - 6]);
      else if (e.kind === 'faller' && e.phase !== 'gone') tags.push([e.skin === 'tube' ? '燈管' : '招牌', e.x, e.y + e.h + 14]);
      else if (e.kind === 'bottle' && (!e.got || g.looped)) tags.push(['酒', e.x, e.y - 22]);
      else if (e.kind === 'cap' && !e.got && g.looped) tags.push([flavorOf(e.key).name, e.x, e.y - 18]);
      else if (e.kind === 'cart') tags.push(['台車', e.x, e.y - 4]);
      else if (e.kind === 'corpse') tags.push(['屍體', e.x, e.y - 4]);
    }
    ctx.font = `12px ${FONT}`; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(20,22,28,.85)'; ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const [name, x, y] of tags) { ctx.strokeText(name, x, y); ctx.fillText(name, x, y); }
  }

  const SHOT = new URLSearchParams(location.search).get('shot') === '1';
  // the day comes from the map's id ("day-3"), so a build holding one day still numbers its rooms 3-1, 3-2...
  const roomNumber = g => `${g.map.id.match(/\d+$/)?.[0] ?? g.mapIndex + 1}-${g.map.rooms.indexOf(g.room) + 1}`;

  function drawBubbles() {
    const g = game;
    if (g.looped) return;   // loop rules are wordless for now: the story is added later
    const placed = [];
    for (const bub of g.bubbles) {
      if (bub.delay > 0) continue;
      const tx = bub.who === 'body' ? g.body.x : bub.who.x;
      let ty = bub.who === 'body' ? g.body.y - 128 : bub.who.y - bub.who.h - 34;
      ctx.save();
      ctx.globalAlpha = Math.min(1, bub.t / 0.25);
      ctx.font = `20px ${FONT}`;
      const w = ctx.measureText(bub.text).width + 28, x = Math.max(8, Math.min(W - w - 8, tx - w / 2));
      // bubbles from different speakers stack upward instead of covering each other
      const base = ty;
      while (placed.some(p => x < p.x + p.w && x + w > p.x && Math.abs(ty - p.ty) < 46)) ty -= 46;
      if (ty !== base && ty - 44 < 8) continue;   // a stacked bubble with no room above is dropped rather than piled at the top edge
      placed.push({ x, w, ty });
      const y = Math.max(8, ty - 44);
      ctx.fillStyle = '#f6efdd'; ctx.strokeStyle = '#1c1636'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x + 3, y); ctx.lineTo(x + w, y + 2); ctx.lineTo(x + w - 2, y + 38); ctx.lineTo(tx + 8, y + 37); ctx.lineTo(tx - 2, y + 50); ctx.lineTo(tx - 6, y + 38); ctx.lineTo(x, y + 37); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2a2244'; ctx.textAlign = 'left'; ctx.fillText(bub.text, x + 14, y + 26);
      ctx.restore();
    }
  }

  // Hallucinated tiles glow; tiles about to change blink before the stage swaps.
  function drawHallucination() {
    const g = game;
    if (!g.drunk) return;
    const pulse = 0.5 + 0.5 * Math.sin(g.time * 5);
    ctx.save();
    for (const key of g.hallu) {
      const [x, y] = key.split(',').map(Number), t = g.tiles[y][x], tx = x * T, ty = y * T;
      if (t === '.') { ctx.setLineDash([5, 6]); ctx.strokeStyle = 'rgba(190,150,255,.28)'; ctx.lineWidth = 2; ctx.strokeRect(tx + 3, ty + 3, T - 6, T - 6); ctx.setLineDash([]); continue; }
      ctx.fillStyle = `rgba(170,120,255,${0.16 + pulse * 0.1})`; ctx.fillRect(tx, ty, T, T);
      ctx.strokeStyle = `rgba(220,190,255,${0.5 + pulse * 0.3})`; ctx.lineWidth = 2; ctx.strokeRect(tx + 1, ty + 1, T - 2, T - 2);
    }
    if (g.stageWarn) {
      const on = Math.sin(g.time * 22) > 0;
      for (const [x, y, c] of g.stageWarn.cells) {
        const tx = x * T, ty = y * T;
        if (c === '.') { if (on) { ctx.fillStyle = 'rgba(20,10,40,.55)'; ctx.fillRect(tx, ty, T, T); } }
        else { ctx.setLineDash([6, 5]); ctx.strokeStyle = on ? 'rgba(255,220,120,.95)' : 'rgba(190,150,255,.7)'; ctx.lineWidth = 3; ctx.strokeRect(tx + 2, ty + 2, T - 4, T - 4); ctx.setLineDash([]);
          if (c === '^') { ctx.fillStyle = 'rgba(255,110,110,.35)'; ctx.fillRect(tx + 4, ty + 20, T - 8, T - 22); } }
      }
    }
    if (g.chill) for (const [x, y] of g.stageDeferred) {
      ctx.setLineDash([4, 5]); ctx.strokeStyle = '#f2c24f'; ctx.lineWidth = 2;
      ctx.strokeRect(x * T + 3, y * T + 3, T - 6, T - 6); ctx.setLineDash([]);
    }
    ctx.restore();
  }

  // Drunk stage tint: the more cells full, the more the world swims.
  function drawDrunkGrade() {
    const g = game;
    if (!g.drunk || (!g.stage && !g.stageWarn)) return;
    const s = g.stage, warn = g.stageWarn ? 0.5 + 0.5 * Math.sin(g.time * 14) : 0;
    const v = ctx.createRadialGradient(W / 2, H / 2, 260 - s * 40, W / 2, H / 2, 780);
    v.addColorStop(0, 'rgba(120,60,200,0)'); v.addColorStop(1, `rgba(120,60,200,${0.12 * s + 0.18 * warn})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    if (s >= 2) { ctx.fillStyle = `rgba(255,120,200,${0.03 * (s - 1) * (0.5 + 0.5 * Math.sin(g.time * 2))})`; ctx.fillRect(0, 0, W, H); }
  }

  // 1 丟 an arc, 2 衝 a flat arrow, 3 升天 an up arrow, 0 a dash: thin lines in the move's colour
  function moveIcon(grade, cx, cy, alpha) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy);
    ctx.lineWidth = 3; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = grade === 'body' ? GREY.corpse : grade ? ZUI[grade].tint : '#8a809f';
    ctx.beginPath();
    // day 3's first grade: the body lying flat, head and all
    if (grade === 'body') { ctx.moveTo(-11, 4); ctx.lineTo(5, 4); ctx.moveTo(14, 4); ctx.arc(10, 4, 4, 0, Math.PI * 2); }
    else if (grade === 1) { ctx.moveTo(-11, 8); ctx.quadraticCurveTo(-2, -16, 10, 6); ctx.moveTo(4, 5); ctx.lineTo(10, 6); ctx.lineTo(11, 0); }
    else if (grade === 2) { ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.moveTo(5, -6); ctx.lineTo(11, 0); ctx.lineTo(5, 6); }
    else if (grade === 3) { ctx.moveTo(0, 11); ctx.lineTo(0, -11); ctx.moveTo(-6, -5); ctx.lineTo(0, -11); ctx.lineTo(6, -5); }
    else { ctx.moveTo(-8, 0); ctx.lineTo(8, 0); }
    ctx.stroke(); ctx.restore();
  }

  // The puzzle panel, icons only. Top: three stage bars, lit up to Jim's grade (the ones the world is
  // changing blink). Below: the move J plays now, and the bottles in hand. While the world lags, a bar runs down.
  function drawChillGauge() {
    const g = game, x = 22, y = 60, n = g.targetStage(), warn = g.stageWarn;
    const moves = !n ? [0] : g.corpses ? [n === 1 ? 'body' : 1] : g.single ? [n] : Array.from({ length: n }, (_, i) => n - i);
    ctx.fillStyle = 'rgba(18,14,35,.72)'; ctx.fillRect(x, y, 170, warn ? 84 : 74);
    for (let i = 1; i <= g.cells; i++) {   // only the grades this day can reach: no hint of what comes later
      const changing = warn && i > Math.min(g.stage, warn.to) && i <= Math.max(g.stage, warn.to);
      ctx.globalAlpha = changing ? 0.5 + 0.5 * Math.sin(g.time * 14) : 1;
      ctx.fillStyle = i <= n ? STAGE_TINT[i] : '#352c49'; ctx.fillRect(x + 14 + (i - 1) * 50, y + 14, 42, 8);
    }
    ctx.globalAlpha = 1;
    if (g.hasShadow) moves.forEach((m, i) => moveIcon(m, x + 28 + i * 32, y + 48, n && !g.chillAirUsed ? 1 : 0.35));
    if (g.bottled) for (let i = 0; i < TUNING.carry; i++) drawBottle(x + 150 - i * 22, y + 48, 0.6, i < g.held ? 1 : 0.25);
    if (warn) { ctx.fillStyle = '#cbbde3'; ctx.fillRect(x, y + 80, 170 * warn.t / warn.duration, 4); }
  }

  function drawGauge() {
    if (game.chill) { drawChillGauge(); return; }
    const g = game, cw = 78, ch = 20, x0 = 22, y0 = H - 66, n = Math.floor(g.booze + 1e-9);
    for (let i = 0; i < 3; i++) {
      const x = x0 + i * (cw + 10), fill = Math.max(0, Math.min(1, g.booze - i)), z = ZUI[i + 1];
      ctx.save();
      if (i >= g.cells) {
        ctx.globalAlpha = 0.35; ctx.fillStyle = '#1a1430'; ctx.fillRect(x, y0, cw, ch);
        ctx.strokeStyle = '#5a5070'; ctx.lineWidth = 2; ctx.strokeRect(x, y0, cw, ch);
        ctx.restore(); text('？', x + cw / 2, y0 + ch + 22, 16, 'center', 0.3); continue;
      }
      ctx.fillStyle = 'rgba(16,12,36,.7)'; ctx.fillRect(x, y0, cw, ch);
      ctx.fillStyle = fill >= 1 ? z.tint : 'rgba(181,194,90,.55)'; ctx.fillRect(x, y0, cw * fill, ch);
      const next = i < n;
      ctx.strokeStyle = next ? '#f2c24f' : '#f3e9d2'; ctx.lineWidth = next ? 3 : 1.5; ctx.strokeRect(x, y0, cw, ch);
      if (g.stageWarn && i === Math.max(g.stageWarn.to, g.stage) - 1 && Math.sin(g.time * 22) > 0) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, y0, cw, ch); }
      ctx.restore();
      text(z.name, x + cw / 2, y0 + ch + 22, 17, 'center', fill >= 1 ? 0.95 : 0.4, next ? '#f2c24f' : '#f3e9d2');
    }
    if (n) text('J ' + Array.from({ length: n }, (_, i) => ZUI[n - i].name).join('→'), x0, y0 - 36, 17, 'left', 0.95, '#f2c24f');
    text('K 放屁', x0 + 3 * (cw + 10) + 6, y0 + 16, 17, 'left', g.booze >= TUNING.fartCost - 1e-9 ? 0.8 : 0.3, '#b5c25a');
    text(['清醒', '微醺', '大醉', '爛醉'][g.stage] + (g.stageWarn ? (g.stageWarn.to > g.stage ? '　醉意上湧…' : '　酒醒中…') : ''), x0, y0 - 12, 17, 'left', 0.85, g.stageWarn ? '#f2c24f' : '#cdb8ff');
  }

  // A bottle: a green capsule 36 px tall at scale 1, centred on (x, y).
  function drawBottle(x, y, s, alpha = 1) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = GREY.bottle; ctx.strokeStyle = '#1d4a22'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-8, -12, 16, 30, 6); ctx.fill(); ctx.stroke();
    ctx.fillRect(-3, -18, 6, 7);
    ctx.restore();
  }

  // Under loop rules a collectible is a cocktail, one flavour per day (Celeste's strawberries, made drinks).
  const FLAVORS = [{ name: '柯夢波丹', color: '#e86a9a' }, { name: '莫希托', color: '#7fd38a' }, { name: '藍色夏威夷', color: '#4fb3e8' }, { name: '瑪格麗特', color: '#f2d45c' }];
  const flavorOf = key => FLAVORS[Math.max(0, game.campaign.maps.findIndex(m => key?.startsWith(m.id + ':'))) % FLAVORS.length];
  function drawCap(e) {
    if (game.looped) {
      // a cocktail glass: the drink in the bowl, a stem, a foot
      const c = flavorOf(e.key ?? '').color;
      ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(e.x - 12, e.y - 10); ctx.lineTo(e.x + 12, e.y - 10); ctx.lineTo(e.x, e.y + 3); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#f3f1ea'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(e.x - 14, e.y - 12); ctx.lineTo(e.x, e.y + 4); ctx.lineTo(e.x + 14, e.y - 12);
      ctx.moveTo(e.x, e.y + 4); ctx.lineTo(e.x, e.y + 12); ctx.moveTo(e.x - 7, e.y + 13); ctx.lineTo(e.x + 7, e.y + 13); ctx.stroke();
      ctx.fillStyle = '#f2d45c'; ctx.beginPath(); ctx.arc(e.x + 9, e.y - 13, 3, 0, Math.PI * 2); ctx.fill();
      return;
    }
    ctx.fillStyle = GREY.cap; ctx.beginPath(); ctx.arc(e.x, e.y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6b5212'; ctx.lineWidth = 2; ctx.stroke();
  }

  function drawAim() {
    const g = game, b = g.body;
    let x = b.x, y = b.y, { vx, vy } = g.throwVel();
    ctx.fillStyle = '#f3e9d2';
    for (let i = 0; i < 26; i++) {
      for (let k = 0; k < 4; k++) { vy += TUNING.gravity / 120; x += vx / 120; y += vy / 120; }
      if (y > H || g.hitsSolid(g.box({ x }, y))) break;
      ctx.globalAlpha = 0.75 * (1 - i / 26);
      ctx.beginPath(); ctx.arc(x, y - 36, 3.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function text(str, x, y, size, align = 'left', alpha = 1, color = '#f3e9d2') {
    ctx.save(); ctx.globalAlpha = alpha; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
    ctx.fillStyle = 'rgba(16,12,36,.55)'; ctx.fillText(str, x + 2, y + 2);
    ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
  }

  function draw() {
    const g = game, b = g.body;
    const key = g.room.id + ':' + g.tilesVersion + ':' + g.mapIndex + ':' + !!painted() + !!spriteOf('hallu');
    if (!g.pan) panFrom = '';
    if (key !== roomKey) {
      if (g.pan && g.pan.from !== panFrom) { const c = prevLayer.getContext('2d'); c.clearRect(0, 0, W, H); c.drawImage(layer, 0, 0); panFrom = g.pan.from; }
      roomKey = key; buildLayer();
    }
    ctx.save();
    if (g.pan) {
      // the camera slides from the old room to the new one over a black void
      const t = 1 - g.transT / TUNING.pan, p = t * t * (3 - 2 * t), [ux, uy] = PAN_DIR[g.pan.side];
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.drawImage(prevLayer, -ux * p * W, -uy * p * H);
      ctx.translate(ux * (1 - p) * W, uy * (1 - p) * H);
    }
    if (g.shake) ctx.translate((Math.random() - 0.5) * g.shake * 18, (Math.random() - 0.5) * g.shake * 18);
    ctx.drawImage(layer, 0, 0);
    drawDynamicTiles();
    drawMachines();
    drawHallucination();
    drawEntities();
    if (g.berry) drawCap(g.berry);
    drawTags();
    if (g.stand) {
      const st = g.stand, charging = g.state === 'charge';
      if (charging) {
        ctx.strokeStyle = 'rgba(243,233,210,.55)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        for (let i = 0; i < 4; i++) {
          const yy = st.y - 30 - i * 34 + Math.sin(g.time * 30 + i) * 4, len = 40 + i * 8;
          ctx.beginPath(); ctx.moveTo(st.x - g.chargeDir * (40 + i * 6), yy); ctx.lineTo(st.x - g.chargeDir * (40 + i * 6 + len), yy); ctx.stroke();
        }
      }
      // the shadow is a translucent box the size of what it holds Jim up with
      const sh = st.h || 150;
      ctx.globalAlpha = 0.45 * st.alpha; ctx.fillStyle = g.drunk ? GREY.shadow : ABILITIES[st.ability].tint; ctx.fillRect(st.x - BODY_W / 2 - 6, st.y - sh, BODY_W + 12, sh);
      ctx.globalAlpha = 0.9 * st.alpha; ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2; ctx.strokeRect(st.x - BODY_W / 2 - 6, st.y - sh, BODY_W + 12, sh);
      ctx.globalAlpha = 1;
    }
    if (g.state === 'lift') drawAim();
    if (g.state !== 'dead') {
      const [anim, f] = bodyPose(g);
      const squash = b.landT > 0 ? 0.85 : b.grounded ? 1 : 1 + Math.max(-0.2, Math.min(0.25, -b.vy / 3000));
      // puzzle rules: Jim glows in his grade's colour, and the move J plays now floats over his head
      const grade = g.chill && g.drunk ? g.targetStage() : 0;
      if (grade) {
        const glow = ctx.createRadialGradient(b.x, b.y - 40, 8, b.x, b.y - 40, 78);
        glow.addColorStop(0, STAGE_TINT[grade] + '66'); glow.addColorStop(1, STAGE_TINT[grade] + '00');
        ctx.fillStyle = glow; ctx.fillRect(b.x - 80, b.y - 120, 160, 160);
      }
      drawFrame(anim, f, b.x, b.y, b.face, 118, null, 1, squash);
      if (grade && g.hasShadow) {
        ctx.save(); ctx.fillStyle = 'rgba(18,14,35,.7)'; ctx.strokeStyle = STAGE_TINT[grade]; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(b.x, b.y - 132, 17, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
        moveIcon(g.corpses ? (grade === 1 ? 'body' : 1) : grade, b.x, b.y - 132, g.chillAirUsed ? 0.35 : 1);
      }
    } else if (g.ghost) {
      const gh = g.ghost;
      drawFrame('fall', 0, gh.x + Math.sin(gh.t * 9) * 6, gh.y - gh.t * 120, gh.face, 118, '#cfe6f2', 0.5);
    }
    drawBubbles();
    for (const p of g.particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (SHOT) return;   // ?shot=1: the room alone, no HUD, for map sheets

    if (g.drinkT > 0 && !g.slot) {
      const v = ctx.createRadialGradient(W / 2, H / 2, 240, W / 2, H / 2, 760);
      v.addColorStop(0, 'rgba(14,11,28,0)'); v.addColorStop(1, 'rgba(14,11,28,.45)');
      ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    }
    drawDrunkGrade();
    drawSlot();
    drawReady();
    if (g.flash) { ctx.globalAlpha = (g.flash.t / 0.45) * 0.4; ctx.fillStyle = g.flash.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    if (g.looped && g.capsGot.size) { drawCap({ x: 112, y: 30 }); text(String(g.capsGot.size), 128, 36, 20, 'left', 0.7); }
    text(g.looped ? roomNumber(g) : `${g.map.name}　${g.chill ? `${g.map.rooms.indexOf(g.room) + 1} / ${g.map.rooms.length}` : g.room.id}`, 22, 36, 20, 'left', 0.7);
    if (g.drunk) {
      // hud: false hides the grade panel (the office prologue has no drink yet)
      if (g.map.hud !== false) drawGauge();
      const hint = g.chill ? null : (g.room.lines || []).filter(l => /[A-Z]/.test(l)).at(-1);
      if (hint) text(hint, W / 2, H - 22, 18, 'center', 0.55);
      const n = Math.floor(g.booze + 1e-9);
      if (!g.chill && g.state === 'lift') text('W 高拋　S 低飛', W / 2, H - 52, 20, 'center', 0.95, '#f2c24f');
      if (!g.chill && g.state === 'charge' && g.stand && g.stand.grounded) text('W 跳離', W / 2, H - 52, 20, 'center', 0.95, '#f2c24f');
      if (g.autoplay || autoChain) text(autoChain ? '一路帶路中　P 停下' : g.chill ? (g.hasShadow ? '醉影帶路中　P 接手' : '自動帶路中　P 接手') : '自動通關中　P 取消', W / 2, g.chill ? H - 22 : H - 82, 20, 'center', 0.95, '#f2c24f');
    } else if (TUNING.directMode) {
      const air = !b.grounded || ['lift', 'thrown', 'charge'].includes(g.state);
      g.map.abilities.forEach((id, i) => {
        const usable = id !== g.activeSkill && !(air && g.airDraws >= TUNING.airDraws);
        text(`${ABILITIES[id].key} ${ABILITIES[id].name}`, 22 + i * 130, H - 22, 18, 'left', usable ? 0.9 : 0.25, usable ? ABILITIES[id].tint : '#f3e9d2');
      });
      // 2: room lines that name a key stay on screen as the room's hint
      const hint = (g.room.lines || []).filter(l => /[A-Z]/.test(l)).at(-1);
      if (hint) text(hint, W / 2, H - 22, 18, 'center', 0.55);
      // 3/4: the moves that only exist mid-action are named while they are possible
      if (g.state === 'lift') text('W 高拋　S 低飛', W / 2, H - 52, 20, 'center', 0.95, '#f2c24f');
      if (g.state === 'charge' && g.stand && g.stand.grounded) text('W 跳離', W / 2, H - 52, 20, 'center', 0.95, '#f2c24f');
      if (g.autoplay) text('自動通關中　P 取消', W / 2, H - 82, 20, 'center', 0.95, '#f2c24f');
    }
    if (g.roomTitle > 0 && !g.looped) {
      const a = Math.min(1, g.roomTitle / 0.6);
      if (g.room === g.map.rooms[0]) text(g.map.name, W / 2, 52, 24, 'center', a * 0.8);
      text(g.room.name, W / 2, 96, 40, 'center', a);
    }
    if (g.phase === 'transition' && !g.pan) {
      const half = TUNING.transition / 2;
      ctx.fillStyle = `rgba(14,11,28,${1 - Math.abs(g.transT - half) / half})`; ctx.fillRect(0, 0, W, H);
    }
    if (g.phase === 'mapEnd' && g.looped) { ctx.fillStyle = `rgba(14,11,28,${Math.min(1, g.timer * 1.5)})`; ctx.fillRect(0, 0, W, H); }
    else if (g.phase === 'mapEnd') {
      ctx.fillStyle = `rgba(14,11,28,${Math.min(0.75, g.timer * 1.5)})`; ctx.fillRect(0, 0, W, H);
      const a = Math.min(1, g.timer * 1.5);
      const total = g.map.rooms.reduce((n, r) => n + r.tiles.join('').split('*').length - 1, 0);
      const got = [...g.capsGot].filter(k => k.startsWith(g.map.id + ':')).length;
      text(`${g.map.name}　完`, W / 2, H / 2 - 60, 64, 'center', a);
      if (g.map.outro) text(g.map.outro, W / 2, H / 2 - 4, 24, 'center', a * 0.85);
      text(g.chill ? `慢慢走，也走到了。　瓶蓋 ${got} / ${total}` : `倒下 ${g.mapDeaths} 次（無加班費）　·　${fmt(g.mapTime)}${total ? `　·　瓶蓋 ${got} / ${total}（可兌換：無）` : ''}`, W / 2, H / 2 + 40, 20, 'center', a * 0.7);
      const more = g.mapIndex + 1 < g.campaign.maps.length;
      if (g.timer > 0.6) text(more ? 'Enter 繼續' : 'Enter 再走一次', W / 2, H / 2 + 92, 20, 'center', 0.6 + 0.3 * Math.sin(g.time * 3));
    }
    if (g.phase === 'intro') {
      ctx.fillStyle = '#0e0b1c'; ctx.fillRect(0, 0, W, H);
      const a = Math.min(1, g.timer * 2);
      text(g.card.title, W / 2, H / 2 - 30, 60, 'center', a);
      g.card.text.split('\n').forEach((line, i) => text(line, W / 2, H / 2 + 30 + i * 36, 24, 'center', Math.min(1, Math.max(0, g.timer * 2 - 0.6)) * 0.85));
      if (g.timer > 0.5) text('K 繼續', W / 2, H - 60, 18, 'center', 0.45 + 0.25 * Math.sin(g.time * 3));
    }
    if (loaded < Object.keys(SRC).length) text('…', W - 40, 36, 24, 'right', 0.6);
    if (!document.hasFocus()) text('點一下畫面就能玩', W / 2, H / 2, 26, 'center', 0.9);
  }

  // ---------- synth sound (WebAudio): events with no recording in Sound below ----------
  // Sound is off while the levels are being tested: nothing is decoded, loaded or played. Set to true to bring it back.
  const AUDIO = false;
  const Sfx = (() => {
    let ac = null, out = null, muted = false;
    function ensure() {
      if (!AUDIO) return;
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); out = ac.createGain(); out.gain.value = 0.5; out.connect(ac.destination); } catch (e) { ac = null; } }
      if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
    }
    function tone(freq, dur, type = 'sine', vol = 0.2, to = null, delay = 0) {
      const t0 = ac.currentTime + delay, o = ac.createOscillator(), gn = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(gn); gn.connect(out); o.start(t0); o.stop(t0 + dur + 0.02);
    }
    function noise(dur, vol, freq, kind = 'lowpass') {
      const t0 = ac.currentTime, len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
      src.buffer = buf; f.type = kind; f.frequency.value = freq; gn.gain.value = vol;
      src.connect(f); f.connect(gn); gn.connect(out); src.start(t0);
    }
    const bank = {
      jump: () => tone(380, 0.1, 'square', 0.06, 640),
      land: () => noise(0.06, 0.22, 500),

      ensure,
      context: () => (ensure(), ac),

  // ---------- recorded effects and music (art/sfx, art/music) ----------
  // Effects are real CC0 recordings (Kenney, OpenGameArt; see handoff/audio-candidates/SOURCES.md), roughened a little
  // toward pixel; an event with no recording keeps its synth sound above. The music is a sneaky small-band loop from
  // Gemini (Lyria) in a sober and a drunk mix, which play together and cross-fade as the world turns drunk or sober.
  // Effects play through WebAudio from decoded buffers: one cheap node per hit, where a pool of <audio> players (about a
  // hundred media pipelines) made the game stutter, worst on phones. The asset library allows no fetch, so a
  // single-file build carries the effects in the page itself ("sfx-data": name -> base64 mp3); game.html fetches them.
  // The two music loops are long, so they stay plain <audio> from the library.
  const Sound = (() => {
    const TAKES = {
      jump: 2, land: 2, bounce: 1, warp: 1, recall: 1, tick: 1, warn: 1, ready: 1, reveal: 1, deny: 1, cap: 1, break: 2, knock: 1,
      die: 1, crash: 1, crumble: 1, lift: 1, throw: 1, stageUp: 1, stageDown: 1, gulp: 2, fart: 3, bigfart: 1, drink: 1,
    };
    const MUSIC = 0.3, FADE = 1.2;
    const buffers = {}, music = {}, level = { sober: 0, drunk: 0 }, set = {};
    let muted = false, started = false, fadedAt = 0, ac = null;
    const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
    async function load(name) {
      const inline = sfxData[name];
      const data = inline ? bytes(inline) : await (await fetch(`art/sfx/${name}.mp3`)).arrayBuffer();
      buffers[name] = await new Promise((ok, no) => ac.decodeAudioData(data, ok, no));
    }
    let sfxData = {};
    function start() {   // on the first key or tap: browsers play nothing before one
      if (started || !AUDIO) return;
      started = true;
      ac = Sfx.context();
      try { sfxData = JSON.parse(document.getElementById('sfx-data')?.textContent || '{}'); } catch (e) { /* none */ }
      if (ac) for (const ev in TAKES) for (let i = 1; i <= TAKES[ev]; i++) load(`${ev}-${i}`).catch(() => {});
      for (const k in level) music[k] = Object.assign(new Audio(assetUrl(`art/music/bgm-${k}.mp3`)), { loop: true, volume: 0, muted: true, preload: 'auto' });
      if (!document.hidden) for (const k in music) music[k].play().catch(() => {});
    }
    // false when the event has no recording, so the caller plays the synth one
    function play(ev) {
      if (!TAKES[ev]) return false;
      const buf = buffers[`${ev}-${1 + Math.floor(Math.random() * TAKES[ev])}`];
      if (!muted && buf) { const src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); src.start(); }
      return true;
    }
    function update(drunk, now) {   // by the clock, not the capped game frame, so a slow tab still fades in FADE seconds
      const dt = Math.min((now - fadedAt) / 1000, 1); fadedAt = now;
      if (!started) return;
      for (const k in music) {
        const want = !muted && (k === 'drunk') === drunk ? MUSIC : 0;
        if (level[k] === want && set[k] === want) continue;   // touch the players only while a fade is on
        level[k] += Math.sign(want - level[k]) * Math.min(Math.abs(want - level[k]), MUSIC * dt / FADE);
        set[k] = level[k];
        music[k].volume = level[k];
        music[k].muted = level[k] < 0.005;   // iOS ignores volume, so the quiet loop is muted outright
      }
    }
    addEventListener('visibilitychange', () => { for (const k in music) document.hidden ? music[k].pause() : music[k].play().catch(() => {}); });
    return { start, play, update, mute(m) { muted = m; } };
  })();

  // ---------- input & loop ----------
  const held = { left: false, right: false, jump: false, down: false };
  let pressed = {};
  const bind = { KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', KeyW: 'jump', ArrowUp: 'jump', KeyS: 'down', ArrowDown: 'down', Space: 'jump', KeyK: 'k', KeyR: 'r', KeyP: 'auto', Enter: 'confirm', Escape: 'esc' };
  const skillKeys = Object.fromEntries(Object.entries(ABILITIES).map(([id, ab]) => ['Key' + ab.key, id]));
  addEventListener('keydown', e => {
    Sfx.ensure(); Sound.start();
    if (e.code === 'KeyM' && !e.repeat) { Sound.mute(Sfx.toggle()); return; }
    if (menu.hidden && /^Digit[1-9]$/.test(e.code) && game.dialogue) { e.preventDefault(); if (!e.repeat) pressed.choice = Number(e.code.slice(5)); return; }

  const padButtons = { skill: pad.querySelector('[data-pad="skill"]'), talk: pad.querySelector('[data-pad="talk"]'), k: pad.querySelector('[data-pad="k"]') };
  function syncPad() {
    const loop = game.looped;
    padButtons.skill.hidden = loop && !game.hasShadow;
    padButtons.talk.hidden = loop;
    padButtons.k.hidden = loop && game.map.hud === false;

  }

  // P replays one room from its spawn. P hands control back; R also resets the room.

  // autoChain: keep playing room after room (cards stay up a moment, day ends are confirmed) until the last day ends
  let auto = null, autoQueued = false, autoChain = false, puzzleRoutes = null, puzzleRouteState = 'idle';
  // A single-file build (handoff/kit/build-beaverkit.mjs) embeds the puzzle rooms and routes.
  const embedded = id => document.getElementById(id)?.textContent || null;
  // ?chill=1 loads the main puzzle rooms, ?chill=single the single-skill test rooms, ?chill=loop the drink-use-sober loop
  const chillParam = new URLSearchParams(location.search).get('chill');
  const chillFiles = ['single', 'loop'].includes(chillParam)
    ? { rooms: `chill-${chillParam}.json`, routes: `chill-${chillParam}-routes.json` } : { rooms: 'chill-puzzles.json', routes: 'chill-routes.json' };
  function loadPuzzleRoutes() {
    if (puzzleRouteState !== 'idle') return;
    const inline = embedded('chill-routes-data');
    if (inline) { puzzleRoutes = JSON.parse(inline); puzzleRouteState = 'ready'; return; }
    puzzleRouteState = 'loading';
    fetch(chillFiles.routes, { cache: 'no-store' }).then(response => {
      if (!response.ok) throw new Error('Route unavailable');
      return response.json();
    }).then(data => { puzzleRoutes = data; puzzleRouteState = 'ready'; })
      .catch(() => { puzzleRouteState = 'error'; });
  }
  function stopAuto() {
    if (!auto) return;
    const previous = auto; auto = null;
    previous.game.autoplay = false;
    if (previous.tuning) Object.assign(TUNING, previous.tuning);
    held.left = held.right = held.jump = held.down = false; pressed = {};
  }
  function toggleAuto() {
    if (auto) { stopAuto(); return; }
    if (game.phase === 'transition') { autoQueued = true; return; }
    if (game.chill && game.phase === 'intro') game.phase = 'play';
    if (game.phase !== 'play' || game.dialogue) return;
    if (puzzleRouteState === 'error') puzzleRouteState = 'idle';   // a failed load is tried again
    if (game.chill) loadPuzzleRoutes();
    if (game.chill && puzzleRouteState !== 'ready') {
      game.shout('body', [puzzleRouteState === 'loading' ? '等我一下……' : '路線沒讀到，重新整理試試。']); return;
    }
    const steps = game.chill ? AUTO.puzzleRoute(game, puzzleRoutes) : AUTO.route(game);
    if (!steps) { game.shout('body', ['這間我也不知道怎麼過。']); return; }
    const tuning = { ...TUNING }; Object.assign(TUNING, DEFAULTS);
    game.enterRoom(game.room.id);
    auto = { steps, frame: 0, acc: 0, room: game.room, game, body: game.body, puzzle: game.chill, tuning };
    held.left = held.right = held.jump = held.down = false; pressed = {};

  }
  // One step of the chained run: start the next room's route once it is playable, let cards show for a moment,
  // and confirm a day's end; stop after the last day or where no route exists.
  function chainStep() {
    if (game.phase === 'mapEnd') {
      if (game.mapIndex + 1 >= game.campaign.maps.length) { autoChain = false; return; }
      if (game.timer > 1.5) pressed.confirm = true;
      return;
    }
    if (game.phase === 'intro' && game.timer < 3) return;
    if (game.phase === 'transition' || game.state === 'dead' || game.dialogue) return;
    toggleAuto();
    if (!auto && puzzleRouteState !== 'loading') autoChain = false;
  }

  // Fixed 240 Hz steps, so the replay matches the run the route was verified with.
  function runAuto(frame) {
    auto.acc += frame;
    while (auto && auto.acc >= AUTO.STEP_DT) {
      if (auto.game !== game || auto.body !== game.body || game.phase !== 'play' || game.state === 'dead' || (auto.puzzle && auto.frame >= auto.steps.at(-1).end)) { stopAuto(); break; }
      auto.acc -= AUTO.STEP_DT;
      game.step(AUTO.STEP_DT, auto.puzzle ? AUTO.puzzleInput(auto.steps, auto.frame++) : AUTO.input(auto.steps, auto.frame++));
      if (game.phase !== 'play' || game.room !== auto.room || game.state === 'dead') stopAuto();
    }
  }

  // Painted rooms: every picture the campaign uses is fetched up front, and play waits until they are in (at most
  // ART_WAIT ms, then greybox stands in), so a room never shows greybox first and then pops into its painting.
  const ART_WAIT = 8000;
  let artCampaign = null, artPaths = [], artSince = 0;
  function artPending(now) {
    if (artCampaign !== game.campaign) {
      artCampaign = game.campaign; artSince = now;
      const backgrounds = game.campaign.maps.flatMap(map => map.rooms.map(room => room.background).filter(Boolean));
      artPaths = backgrounds.length ? [...backgrounds, ...Object.values(SPRITE)] : [];
      artPaths.forEach(artOf);
    }
    return now - artSince < ART_WAIT && artPaths.some(path => !artOf(path).complete);
  }
  function drawLoading() {
    ctx.fillStyle = '#0e0b1a'; ctx.fillRect(0, 0, W, H);

  }

  let last = performance.now();

    if (artPending(now)) { last = now; drawLoading(); requestAnimationFrame(loop); return; }
    const frame = Math.min((now - last) / 1000, 1 / 20); last = now;
    if (pressed.r) autoChain = false;   // R takes the run back
    if (menu.hidden && frame > 0 && autoQueued && !auto && game.phase !== 'transition') { autoQueued = false; toggleAuto(); }
    if (menu.hidden && frame > 0 && pressed.auto && autoChain) { autoChain = false; autoQueued = false; stopAuto(); pressed.auto = false; }
    if (menu.hidden && frame > 0 && pressed.auto) toggleAuto();
    if (menu.hidden && frame > 0 && autoChain && !auto) chainStep();
    if (menu.hidden && frame > 0 && auto && pressed.r) { stopAuto(); pressed.r = true; }
    if (menu.hidden && frame > 0 && auto) { pressed = {}; runAuto(frame); }
    else if (menu.hidden && frame > 0) {

    if (!pad.hidden) syncPad();

    talk.hidden = !menu.hidden || (!conversation && !nearby?.data);
    if (conversation) {
      const node = conversation.data.nodes[conversation.node];

  // ---------- tuning panel (backquote key) ----------
  const tune = document.getElementById('tune');
  const KNOBS = [
    ['run', '跑速', 150, 600, 5], ['jump', '跳躍力', 400, 1000, 5], ['gravity', '重力', 1000, 3500, 50],
    ['apexHang', '頂點滯空（越小越飄）', 0.2, 1, 0.05], ['releaseGravity', '放開跳鍵下墜', 1, 4, 0.1], ['maxFall', '最大落速', 500, 1600, 25],
    ['accelAir', '空中轉向', 600, 4000, 50], ['cardInterval', '換卡間隔', 0.08, 0.6, 0.01],
    ['liftTime', '舉起停留', 0.1, 1.2, 0.05], ['throwVX', '投擲水平', 300, 1100, 10], ['throwVY', '投擲向上', 500, 1300, 10], ['recover', '落地硬直', 0, 0.5, 0.02],

    ['directMode', '直按模式（1 J/L 直按，0 K 抽卡）', 0, 1, 1], ['slowmo', '抽卡時世界速度', 0.05, 1, 0.05], ['airDraws', '空中可抽次數', 0, 3, 1], ['airCharge', '空中衝刺滯空', 0, 1.2, 0.05], ['holdTime', '喝完可等幾秒', 1, 10, 0.5],
    ['patrolSpeed', '巡邏速度', 40, 300, 5], ['belt', '輸送帶速度', 60, 400, 10], ['crumbleDelay', '紙箱撐多久', 0.1, 1.2, 0.05],
  ];
  const DEFAULTS = { ...TUNING };
  try { Object.assign(TUNING, JSON.parse(localStorage.getItem('drunk-tuning-v3') || '{}')); } catch (e) { /* storage blocked in some embeds */ }
  function buildTune() {
    tune.innerHTML = '<b>手感</b>' + KNOBS.map(([k, label, min, max, step]) =>
      `<label>${label}<input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${TUNING[k]}"><span>${TUNING[k]}</span></label>`).join('') +

  // ---------- menu & level loading ----------
  function toggleMenu(force) {
    menu.hidden = force !== undefined ? !force : !menu.hidden;

  }
  function load(textData, name) {
    try {
      const campaign = parseCampaign(textData); stopAuto(); game = new Game(campaign); roomKey = '';
      // ?room=<id> starts straight in that room, for testing and screenshots
      const roomId = new URLSearchParams(location.search).get('room'), mi = campaign.maps.findIndex(m => m.rooms.some(r => r.id === roomId));
      if (mi >= 0) { game.startMap(mi); game.enterRoom(roomId); game.phase = 'play'; }
      // ?grade=1 shows the room drunk: its hallucinated tiles in place
      const grade = Number(new URLSearchParams(location.search).get('grade'));
      if (mi >= 0 && grade > 0 && game.cells) { game.booze = Math.min(grade, game.cells); game.applyStage(game.targetStage(), true); }

  }
  menu.addEventListener('click', e => {
    const roomId = e.target.dataset?.room;
    const mapIndex = Number(e.target.dataset?.map ?? game.mapIndex);
    if (roomId && game.chill && game.campaign.maps[mapIndex]?.rooms.some(room => room.id === roomId)) {

    if (act === 'restart') { stopAuto(); autoChain = false; game.startMap(0); toggleMenu(false); }
    if (act === 'autoAll') { stopAuto(); game.startMap(0); autoChain = true; toggleMenu(false); }
    if (act === 'autoHere') { stopAuto(); autoChain = true; toggleMenu(false); }
    if (act === 'default') { stopAuto(); game = new Game(previewCampaign || window.DEFAULT_CAMPAIGN); roomKey = ''; updateInstructions(); toggleMenu(false); }

  });

  const originalInstructions = menu.querySelector('small').innerHTML;
  let previewCampaign = null;
  const roomPicker = document.createElement('div');
  roomPicker.style.cssText = 'display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:12px';
  menu.appendChild(roomPicker);
  // The controls a day actually has. Under loop rules nothing later is named before its day:
  // the prologue walks and jumps, the drink day adds K, the shadow's day adds J.
  function controlsText() {
    if (!game.looped) return 'A / D 移動　空白跳躍　E 喝一口升階　K 放屁降階　J 醉影<br>P 自動通過本間，再按 P 接手　R 重來<br>清醒時叫不出醉影；換階後技能立刻變，世界晚 3 秒才跟上。';
    const drinks = game.map.hud !== false, shadow = game.hasShadow;
    return 'A / D 移動　空白跳躍' + (drinks ? '　K 放屁' : '') + (shadow ? '　J 醉影' : '') + '<br>P 自動通過本間，再按 P 接手　R 重來'
      + (drinks ? '<br>碰到酒就會喝；幻覺三秒後才出現，放屁醒一點，幻覺三秒後才散。' : '')
      + (shadow ? '<br>醉影出手一次，醉意就少一階。' : '');
  }
  function updateInstructions() {
    menu.querySelector('small').innerHTML = game.chill ? controlsText() : originalInstructions;
    canvas.setAttribute('aria-label', game.chill ? '醉隱。' + controlsText().replace(/<br>/g, '。') : '醉隱遊戲');
    roomPicker.replaceChildren();
    // ?all=1 lists every room, for testing; players only see the days they have reached
    const all = new URLSearchParams(location.search).get('all') === '1';
    if (game.chill) game.campaign.maps.forEach((map, mi) => (all || mi <= (game.reached ?? 0)) && map.rooms.forEach((room, ri) => {
      const button = document.createElement('button'); button.dataset.room = room.id; button.dataset.map = mi;
      button.textContent = game.looped ? `${mi + 1}-${ri + 1}` : `${mi + 1}-${ri + 1} ${room.name}`; button.style.fontSize = '17px'; roomPicker.appendChild(button);
    }));
  }
  if (embedded('chill-puzzles-data')) {
    const source = embedded('chill-puzzles-data');
    previewCampaign = parseCampaign(source);
    load(source, '醉態解謎');
  } else if (['1', 'single', 'loop'].includes(chillParam)) {
    toggleMenu(true); menuMsg.textContent = '載入中……';
    fetch(chillFiles.rooms, { cache: 'no-store' }).then(response => {
      if (!response.ok) throw new Error('解謎關卡讀取失敗');
      return response.text();
    }).then(source => {
      previewCampaign = parseCampaign(source);
      load(source, '醉態解謎');
    }).catch(err => { toggleMenu(true); menuMsg.textContent = err.message; });
  }
  if (new URLSearchParams(location.search).get('editorTest') === '1' && parent !== window) {
    addEventListener('message', e => {
      if (e.source !== parent || e.data?.type !== 'drunk-editor-test') return;
      try {
        const campaign = parseCampaign(e.data.campaign);
        const map = campaign.maps[e.data.mapIndex];
        if (!map || !map.rooms.some(r => r.id === e.data.roomId)) throw new Error('找不到試玩房間');
        const preview = new Game(campaign);
        preview.startMap(e.data.mapIndex);
        preview.enterRoom(e.data.roomId);
        preview.phase = 'play';
        stopAuto(); game = preview;
        if (game.chill) loadPuzzleRoutes(); updateInstructions();
        roomKey = '';
        toggleMenu(false);
      } catch (err) { toggleMenu(true); menuMsg.textContent = `試玩讀不進來：\n${err.message}`; }
    });
    parent.postMessage({ type: 'drunk-test-ready' }, '*');
  }
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) f.text().then(t => load(t, f.name)); });
})();
</script>
</body>
</html>
