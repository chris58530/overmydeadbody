<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>醉隱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0e0b1c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  canvas { display: block; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); background: #2b2860; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(14, 11, 28, .82); color: #f3e9d2; }
  #menu[hidden] { display: none; }
  #menu h2 { font-weight: normal; font-size: 34px; margin: 0 0 18px; letter-spacing: 4px; }
  #menu button { font: inherit; font-size: 22px; color: inherit; background: none; border: 0; padding: 6px 14px; cursor: pointer; opacity: .78; }
  #menu button:hover, #menu button:focus-visible { opacity: 1; text-decoration: underline wavy rgba(243, 233, 210, .5); outline: none; }
  #menu small { margin-top: 22px; opacity: .55; font-size: 15px; text-align: center; line-height: 1.8; }
  #tune { position: fixed; top: 10px; right: 10px; width: 250px; max-height: calc(100vh - 20px); overflow: auto; padding: 12px 14px; background: rgba(14, 11, 28, .88); color: #f3e9d2; font-size: 14px; border-radius: 4px; }
  #tune[hidden] { display: none; }
  #tune b { display: block; font-weight: normal; font-size: 18px; margin-bottom: 6px; }
  #tune label { display: grid; grid-template-columns: 1fr 44px; gap: 0 6px; margin: 6px 0; }
  #tune input { grid-column: 1; width: 100%; accent-color: #e0a87a; }
  #tune span { grid-column: 2; grid-row: 1 / 3; align-self: end; text-align: right; opacity: .8; }
  #tune button { font: inherit; color: inherit; background: none; border: 1px solid rgba(243, 233, 210, .35); padding: 3px 10px; margin: 8px 6px 0 0; cursor: pointer; }
  #tune textarea { width: 100%; height: 70px; margin-top: 8px; font-size: 11px; background: #1b1633; color: inherit; border: 0; }
  #menuMsg { color: #f0a49c; white-space: pre-line; font-size: 15px; max-width: 80vw; text-align: center; }
  /* touch controls: shown on phones and tablets only */
  #pad { position: fixed; inset: 0; pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #pad[hidden], #pad .btn[hidden] { display: none; }
  #pad .btn { position: absolute; pointer-events: auto; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; border-radius: 50%; background: rgba(243, 233, 210, .13); border: 2px solid rgba(243, 233, 210, .32); color: rgba(243, 233, 210, .92); font-size: 3.4vmin; line-height: 1.15; }
  #pad .btn b { font-size: 6vmin; font-weight: normal; }
  #pad .btn.on { background: rgba(243, 233, 210, .36); }
  #pad .dpad { left: max(3vmin, env(safe-area-inset-left)); bottom: 4vmin; width: 46vmin; height: 22vmin; border-radius: 11vmin; flex-direction: row; justify-content: space-between; padding: 0 5vmin; font-size: 7vmin; }
  #pad .dpad span { opacity: .55; }
  #pad .dpad.left span:first-child, #pad .dpad.right span:last-child { opacity: 1; }
  #pad .jump { right: max(3vmin, env(safe-area-inset-right)); bottom: 4vmin; width: 23vmin; height: 23vmin; }
  #pad .zui { right: calc(max(3vmin, env(safe-area-inset-right)) + 26vmin); bottom: 5vmin; width: 21vmin; height: 21vmin; }
  #pad .up { right: calc(max(3vmin, env(safe-area-inset-right)) + 4vmin); bottom: 30vmin; width: 16vmin; height: 16vmin; }
  #pad .down { right: calc(max(3vmin, env(safe-area-inset-right)) + 24vmin); bottom: 30vmin; width: 16vmin; height: 16vmin; }
  #pad .sys { top: 3vmin; width: 11vmin; height: 11vmin; font-size: 3vmin; }
  #pad .sys.menu { right: max(3vmin, env(safe-area-inset-right)); }
  #pad .sys.retry { right: calc(max(3vmin, env(safe-area-inset-right)) + 13vmin); }
  #pad .sys.auto { right: calc(max(3vmin, env(safe-area-inset-right)) + 26vmin); }
  #pad .hint { position: absolute; left: 0; right: 0; text-align: center; color: rgba(243, 233, 210, .5); font-size: 3.6vmin; display: none; }
  @media (orientation: portrait) {
    body.touch { align-items: flex-start; }
    body.touch #pad .sys { top: calc(56.25vw + 3vmin); }
    body.touch #pad .hint { display: block; top: calc(56.25vw + 18vmin); }
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0"></canvas>
<div id="talk" hidden style="position:fixed;bottom:5%;left:15%;width:70%;max-height:45vh;overflow:auto;background:#151127;color:#f3e9d2;padding:18px;box-sizing:border-box;border:1px solid #e0a87a;white-space:pre-wrap"></div>
<div id="menu" hidden>
  <h2>暫停</h2>
  <button data-act="resume">繼續</button>
  <button data-act="retry">重來這間</button>
  <button data-act="restart">從第一間開始</button>
  <button data-act="autoAll">從頭一路自動通關</button>
  <button data-act="autoHere">從這間一路自動通關</button>
  <button data-act="load">載入關卡 JSON</button>
  <button data-act="default">換回內建關卡</button>
  <p id="menuMsg"></p>
  <small>A D 走　W 跳　K 放屁（按住 A/D 是加速，不按方向或按 W 往上噴，要一直點）　J 叫醉影　R 重來　P 自動通關本間　M 靜音　` 調手感<br>醉意會自己回滿。J 一次用掉全部滿格，自動連段：一格 丟、兩格 衝→丟、三格 升天→衝→丟；放屁扣小格<br>滿格越多越醉：醉影越強，地圖也越危險（先預告，落地才變；預告時放屁可以取消）<br>舊關卡（沒有 cells）沿用 J 摔角手、L 保鑣　·　也可以直接把 JSON 拖進畫面</small>
</div>
<div id="tune" hidden></div>
<div id="pad" hidden>
  <div class="btn dpad" data-pad="dpad"><span>◀</span><span>▶</span></div>
  <div class="btn jump" data-pad="jump"><b>跳</b></div>
  <div class="btn zui" data-pad="skill"><b>J</b>醉影</div>
  <div class="btn up" data-pad="talk"><b>E</b>喝一口</div>
  <div class="btn down" data-pad="k"><b>K</b>放屁</div>
  <div class="btn sys menu" data-pad="menu">選單</div>
  <div class="btn sys retry" data-pad="r">重來</div>
  <div class="btn sys auto" data-pad="auto">帶路</div>
  <p class="hint">手機橫過來玩，畫面比較大</p>
</div>
<input id="file" type="file" accept=".json,application/json" hidden>

<script>
// 醉隱 game engine: pure rules, no DOM. Units are pixels; a room is 32 x 18 tiles of 40 px.
(function (root) {
  'use strict';

  const T = 40, COLS = 32, ROWS = 18, W = COLS * T, H = ROWS * T;
  const BODY_W = 44, BODY_H = 72;

  // px and seconds. Throw speeds start from the BeaverKit skill lab (throwVX 980 shrunk to fit a 32-tile room).
  // Every value here can be changed live in the tuning panel (backquote key).
  const TUNING = {
    run: 370, accelGround: 3200, accelAir: 1900,
    jump: 660, gravity: 2000, apexHang: 0.5, releaseGravity: 2.4, fallGravity: 1.5, maxFall: 950,
    // airDrag: share of accelAir that bleeds speed with no input; overDecel: how fast extra speed (a charge jump-out) fades
    airDrag: 0.35, overDecel: 500,
    coyote: 0.1, jumpBuffer: 0.12,
    cardInterval: 0.32, drink: 0.8,
    // the wrestler's arc is picked by what is held when he lets go: W steep, nothing the regular arc, S low and fast
    liftTime: 0.22, liftRise: 0.12, liftHeight: 84, throwVX: 640, throwVY: 960, recover: 0.1,
    throwUpVX: 240, throwUpVY: 1150, throwLowVX: 900, throwLowVY: 520, throwSteer: 900,
    chargeSpeed: 700, chargeTime: 1.0, chargeTurn: 9, chargeJumpOut: 0.85,
    carryOffset: 80, releaseVY: 260,
    patrolSpeed: 110, belt: 180, crumbleDelay: 0.45, crumbleRespawn: 2.5, fallTrigger: 60, fallWarn: 0.3,
    slowmo: 0.2, airDraws: 1, airCharge: 0.5, hitStop: 0.06, holdTime: 5,
    deathDelay: 0.45, transition: 0.5,
    // rooms placed on a map ("at"): walking off an edge slides the camera over for pan seconds and Jim keeps going;
    // leaving through the top adds panBoost px/s upward so he clears the floor he comes up through
    pan: 0.35, panBoost: 660,
    // 1: each skill has its own key and fires at once; 0: the K card draw
    directMode: 1,
    // drunk mode (a map with "cells"): K farts a small share of a cell, J spends a whole cell on the drunk shadow's move
    fartCost: 1 / 6, fartCooldown: 0.14, fartUp: 300, fartDash: 560, fartDashLift: 60,
    ascendVY: 1200, ascendBreak: 0.45, stageWarn: 0.9,

    ascendWindup: 0.25, poundHang: 0.12, poundVY: 1300,
    // bottles: "carry" — how many bottles Jim can hold; E drinks one
    carry: 1,
    // bottles: "drink" — a bottle drunk on touch comes back after bottleRespawn; K lowers a grade with a small hop
    bottleRespawn: 3, fartHop: 560,
    // zui: "corpse": the body left behind is a plank corpseW wide and corpseH thick; the jump to the bottle shows for warpTime
    corpseW: 84, corpseH: 22, warpTime: 0.35,

    sofa: 900, sofaKeep: 1.2, sofaMax: 1150, cartSpeed: 120,

    regen: 0.4, regenDelay: 0.8, chainAscend: 0.45, chainCharge: 0.7,
    // spilt booze: how fast a held direction speeds Jim up on it (px/s²); holding the other way does nothing, so he slides on
    slick: 420,

    shutterOpen: 1.4, shutterShut: 0.9, shutterDrop: 0.16, shutterLift: 0.3, shutterWarn: 0.4,
  };

  const ABILITIES = {
    wrestler: { name: '摔角手', bottle: 0, tint: '#e0605a', ink: '#b8433c', key: 'J' },
    bodyguard: { name: '保鑣', bottle: 1, tint: '#5aa7d6', ink: '#2f6f9c', key: 'L' },
  };

  // . empty  # ground  ^ shards  = plank  B crate (charge breaks)  C crumbling boxes  < > conveyor
  // R patrol (office chair / night guard)  L falling light (tube / sign)  * bottle cap  P spawn  D a bottle of booze (bottles rules)
  // S sofa (bounces Jim up)  M cart (a moving platform that rolls until something solid turns it)
  // H sensor (works the room's doors while Jim, a body or a chair is in it)  G door (open while sensed)  g bridge (solid while sensed)
  //   a room may pair them off ("groups": { "x,y": n } for sensors and doors): a sensor then works only the doors of its
  //   own group; anything not listed is group 0
  // V beam fixture (a beam runs straight down from it to the first solid or body, and kills)
  // ~ spilt booze (ground Jim slides on: nothing stops him but a wall or a jump; from a stand a direction gets him going slowly)
  // Z shutter housing (a steel shutter drops from it to the floor below on the room's beat; shut it is a wall, and it

  // stage overlays: '.' keeps the tile below, '_' clears it, anything else replaces it
  const STAGE_CHARS = '.#^=BC<>S_~';
  // the drunk shadow's moves, one per cell: the last cell left is always the throw
  const ZUI = { 1: { name: '丟', tint: '#e0605a' }, 2: { name: '衝', tint: '#5aa7d6' }, 3: { name: '升天', tint: '#b5c25a' } };
  // how drunk Jim is, by grade: his glow, the gauge, and the fart that lets it out all wear this colour

  function validateDialogue(d) {

      if (node.next !== undefined && !link(node.next)) throw Error('Unknown dialogue next node');

  const DEATH_LINES = {
    glass: ['這玻璃誰要賠？', '我的腳……'],
    pit: ['這坑比我的年終還深', '我只是想回家……'],
    guard: ['我有識別證！', '我就住這附近！'],
    sign: ['招牌也太不牢了', '這是工傷嗎？'],
    crush: ['牆長在我身上了', '幻覺把我卡住了'],
    other: ['再一杯……', '嗝。', '這不算！', '加班加到眼花了'],
  };
  const GUARD_LINES = ['下班了還想去哪？', '這裡不能過。', '你是不是喝酒了？'];
  const SOLID = '#BC<>SGV~Z';
  const SIDES = ['left', 'right', 'top', 'bottom'];
  const THEMES = ['office', 'pantry', 'elevator', 'lobby', 'street'];

  function validateCampaign(data) {
    const errors = [];
    if (!data || data.format !== 'drunken-rooms') errors.push('format 必須是 "drunken-rooms"');
    if (data && data.version !== 2) errors.push('version 必須是 2');
    if (!data || !Array.isArray(data.maps) || !data.maps.length) { errors.push('maps 至少要有一張地圖'); return errors; }
    data.maps.forEach((map, mi) => {
      const at = `maps[${mi}]`;
      if (data.rules === 'chill-puzzle' && ![1, 2, 3].includes(map.cells)) errors.push(`${at}.cells 解謎模式需要 1、2 或 3 階`);
      if (map.cells !== undefined && ![1, 2, 3].includes(map.cells)) errors.push(`${at}.cells 必須是 1、2 或 3`);
      if (map.cells === undefined && (!Array.isArray(map.abilities) || !map.abilities.length)) errors.push(`${at}.abilities 不可為空`);
      else (map.abilities || []).forEach(a => { if (!ABILITIES[a]) errors.push(`${at} 未知能力 "${a}"`); });
      if (!Array.isArray(map.rooms) || !map.rooms.length) { errors.push(`${at}.rooms 不可為空`); return; }
      const ids = new Set(map.rooms.map(r => r.id));
      if (ids.size !== map.rooms.length) errors.push(`${at} 有重複的房間 id`);
      map.rooms.forEach((room, ri) => {
        const rat = `${at}.rooms[${ri}] (${room.id})`;
        if (!Array.isArray(room.tiles) || room.tiles.length !== ROWS) { errors.push(`${rat} tiles 必須是 ${ROWS} 列`); return; }
        let spawns = 0;
        room.tiles.forEach((row, y) => {
          if (typeof row !== 'string' || row.length !== COLS) errors.push(`${rat} 第 ${y} 列必須是 ${COLS} 字元`);
          else for (const ch of row) { if (!TILE_CHARS.includes(ch)) errors.push(`${rat} 第 ${y} 列有未知格子 "${ch}"`); if (ch === 'P') spawns++; }

        if (room.booze !== undefined && !(typeof room.booze === 'number' && room.booze >= 0 && room.booze <= 3)) errors.push(`${rat} booze 必須是 0～3`);
        if (room.stages !== undefined) {

          else for (const [k, rows] of Object.entries(room.stages)) {
            if (!['1', '2', '3'].includes(k)) errors.push(`${rat} stages 只能有 1、2、3`);
            else if (!Array.isArray(rows) || rows.length !== ROWS || rows.some(r => typeof r !== 'string' || r.length !== COLS || [...r].some(ch => !STAGE_CHARS.includes(ch)))) errors.push(`${rat} stages.${k} 必須是 ${ROWS} 列 ${COLS} 字元，只能用 ${STAGE_CHARS}`);
          }
        }
        if (room.theme !== undefined && !THEMES.includes(room.theme)) errors.push(`${rat} 未知場景 "${room.theme}"`);
        if (room.groups !== undefined) {
          if (!room.groups || typeof room.groups !== 'object' || Array.isArray(room.groups)) errors.push(`${rat} groups 必須是物件`);
          else for (const [key, n] of Object.entries(room.groups)) {
            const [x, y] = key.split(',').map(Number);
            if (key !== `${x},${y}` || !'HGg'.includes(room.tiles[y]?.[x] || '.') || !Number.isInteger(n) || n < 0) errors.push(`${rat} 感應組 ${key} 無效`);
          }
        }
        if (room.shutter !== undefined) {
          const sh = room.shutter, num = v => v === undefined || (typeof v === 'number' && v >= 0 && v <= 10);
          if (!sh || typeof sh !== 'object' || Array.isArray(sh) || !num(sh.open) || !num(sh.shut)) errors.push(`${rat} shutter 必須是 { open, shut, offsets }，秒數 0～10`);

            const [x, y] = key.split(',').map(Number);
            if (key !== `${x},${y}` || room.tiles[y]?.[x] !== 'Z' || !num(v)) errors.push(`${rat} 鐵捲門位置 ${key} 無效`);
          }
        }
        const exits = room.exits || {};
        if (room.npcs !== undefined) {
          if (!room.npcs || typeof room.npcs !== 'object' || Array.isArray(room.npcs)) errors.push(`${rat} npcs must be an object`);
          else for (const [key, npc] of Object.entries(room.npcs)) {
            const [x, y] = key.split(',').map(Number);

          }
        }
        if (room.portalTargets !== undefined) {
          if (!room.portalTargets || typeof room.portalTargets !== 'object' || Array.isArray(room.portalTargets)) errors.push(`${rat} portalTargets 必須是物件`);
          else for (const [key, target] of Object.entries(room.portalTargets)) {
            const [x, y] = key.split(',').map(Number);
            if (!/^\d+,\d+$/.test(key) || key !== `${x},${y}` || room.tiles[y]?.[x] !== 'O') errors.push(`${rat} 傳送門位置 ${key} 無效`);
            if (target !== null && !ids.has(target)) errors.push(`${rat} 傳送門 ${key} 指向不存在的房間 "${target}"`);
          }
        }
        if (room.portalTarget !== undefined && room.portalTarget !== null && !ids.has(room.portalTarget)) errors.push(`${rat} 傳送門指向不存在的房間 "${room.portalTarget}"`);
        const keys = Object.keys(exits);
        if (!keys.length && !room.tiles.join('').includes('O')) errors.push(`${rat} 至少要有一個出口`);
        keys.forEach(side => {
          if (!SIDES.includes(side)) errors.push(`${rat} 出口方向 "${side}" 無效`);
          else if (exits[side] !== null && !ids.has(exits[side])) errors.push(`${rat} 出口指向不存在的房間 "${exits[side]}"`);
        });
      });
    });
    return errors;
  }

  function parseCampaign(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error('不是有效的 JSON'); }
    const errors = validateCampaign(data);
    if (errors.length) throw new Error(errors.join('\n'));
    return data;
  }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  class Game {
    constructor(campaign) {
      this.campaign = campaign;
      this.deaths = 0;
      this.time = 0;
      this.mapTime = 0;
      this.particles = [];
      this.shake = 0;
      this.events = [];
      this.bubbles = [];
      this.capsGot = new Set();
      this.seen = new Set();
      this.startMap(0);
    }

    get map() { return this.campaign.maps[this.mapIndex]; }

    startMap(index) {
      this.mapIndex = index;
      this.reached = Math.max(this.reached ?? 0, index);   // the room picker lists only days already reached
      this.mapDeaths = 0;
      this.mapTime = 0;
      this.phase = this.map.intro ? 'intro' : 'play';
      this.card = this.map.intro ? { title: this.map.name, text: this.map.intro } : null;
      this.timer = 0;
      this.carryBooze = this.map.booze || 0;
      this.enterRoom(this.map.rooms[0].id);
    }

    enterRoom(id) {
      this.room = this.map.rooms.find(r => r.id === id);
      this.dialogue = null;
      this.tiles = this.room.tiles.map(row => row.split(''));
      this.tilesVersion = (this.tilesVersion || 0) + 1;
      this.exits = this.room.exits || {};
      this.entities = [];
      this.crumbles = new Map();
      this.sensors = []; this.doors = []; this.beams = []; this.shutters = []; this.shutterT = 0; this.sensed = false; this.sensedBy = {};
      const group = (x, y) => this.room.groups?.[`${x},${y}`] || 0;
      // street rooms have guards and signs, indoor ones chairs and tubes; a room may ask for guards ("patrol": "guard")
      const street = (this.room.theme || 'street') === 'street', guards = street || this.room.patrol === 'guard';
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const t = this.tiles[y][x];
        if (t === 'P') this.spawn = { x: x * T + T / 2, y: (y + 1) * T };
        if (t === 'H') this.sensors.push({ x: x * T, y: y * T, w: T, h: T, group: group(x, y) });
        if (t === 'G' || t === 'g') { this.doors.push({ x, y, bridge: t === 'g', group: group(x, y) }); this.tiles[y][x] = t === 'G' ? 'G' : '.'; }
        if (t === 'V') this.beams.push({ x, y });

        if (t === 'L') { this.entities.push({ kind: 'faller', x: x * T + T / 2, y: y * T, vy: 0, phase: 'idle', t: 0, w: 72, h: street ? 30 : 14, skin: street ? 'sign' : 'tube' }); this.tiles[y][x] = '.'; }
        if (t === 'D') { this.entities.push({ kind: 'bottle', x: x * T + T / 2, y: y * T + T / 2, got: false }); this.tiles[y][x] = '.'; }
        // a cart is two tiles wide with its deck on the top of its tile, rolling right first; a room may set its speed
        if (t === 'M') { this.entities.push({ kind: 'cart', x: x * T + T / 2, y: y * T, w: 80, h: 16, dir: 1, t: 0, speed: this.room.cartSpeed ?? TUNING.cartSpeed }); this.tiles[y][x] = '.'; }

      this.airDraws = 0;
      this.drinkT = 0;
      this.ready = null;
      this.hitStop = 0;
      this.bubbles = [];
      if (!this.seen.has(this.map.id + ':' + id)) {

        if (this.room.cutscene && id !== this.map.rooms[0].id) { this.phase = 'intro'; this.timer = 0; this.card = { title: this.room.name, text: this.room.cutscene }; }
        if (!this.chill) (this.room.lines || []).forEach((text, i) => this.bubbles.push({ who: 'body', text, delay: 0.2 + i * 0.8, t: 2.2 }));
      }

      this.jumpBuf = 0;

      this.flash = null;

    // ---------- drunk mode ----------
    get drunk() { return !!this.map.cells; }
    get chill() { return this.campaign.rules === 'chill-puzzle'; }
    // skills: "single" — each grade is one move of its own (1 丟, 2 衝, 3 升天) instead of a chain
    get single() { return this.chill && this.campaign.skills === 'single'; }
    // bottles: "carry" — E only drinks a bottle picked up in the room (D); K stays free
    get bottled() { return this.chill && this.campaign.bottles === 'carry'; }
    // bottles: "drink" — the drink-use-sober loop: touching a bottle drinks it (it comes back later), J spends a grade,

    get looped() { return this.chill && this.campaign.bottles === 'drink'; }
    get hasShadow() { return !Array.isArray(this.map.abilities) || this.map.abilities.includes('wrestler'); }

    // The static tile of a cell at a drunk stage: the room, then every overlay up to that stage.
    stageChar(x, y, k) {
      let t = this.room.tiles[y][x];
      if (!STAGE_CHARS.includes(t)) return t;
      for (let s = 1; s <= k; s++) { const o = this.room.stages?.[s]?.[y][x]; if (o && o !== '.') t = o === '_' ? '.' : o; }

    }
    stageDiff(from, to) {
      const out = [];
      if (this.room.stages) for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const c = this.stageChar(x, y, to); if (this.stageChar(x, y, from) !== c) out.push([x, y, c]); }
      return out;
    }
    // Swaps in the stage's tiles; refuses (returns false) while a new solid would land on Jim or his shadow.
    applyStage(k, force = false) {
      const diff = this.stageDiff(this.stage, k);
      if (!force) {
        const boxes = [this.box(this.body)].concat(this.stand && !this.stand.leaving ? [this.box(this.stand)] : []);
        if (diff.some(([x, y, c]) => SOLID.includes(c) && boxes.some(bx => overlap(bx, { x: x * T, y: y * T, w: T, h: T })))) return false;
      }
      for (const [x, y, c] of diff) { this.tiles[y][x] = c; this.crumbles.delete(x + ',' + y); }

      this.stage = k; this.stageWarn = null;
      this.hallu = new Set();

    }
    // The map follows the full cells: a change is announced first (fart it away in time to cancel it) and lands with Jim.
    updateStage(dt) {
      if (this.chill) { this.updateChillStage(dt); return; }
      const k = this.targetStage();
      if (k === this.stage) { this.stageWarn = null; return; }
      if (!this.stageWarn || this.stageWarn.to !== k) { this.stageWarn = { to: k, t: TUNING.stageWarn, cells: this.stageDiff(this.stage, k) }; this.events.push('warn'); }
      this.stageWarn.t -= dt;
      const settled = (this.state === 'free' || this.state === 'recover') && this.body.grounded;
      if (this.stageWarn.t <= 0 && settled) this.applyStage(k);
    }

    // Puzzle rules keep the player's grade stable (0 sober to 3). The world follows exactly three seconds later.
    changeGrade(delta) {
      if (!this.chill || this.phase !== 'play' || (!this.looped && (this.stageWarn || this.stageDeferred.length)) || this.chain.length || this.windupT > 0 || this.pound || !['free', 'thrown', 'recover'].includes(this.state)) return false;
      const from = this.targetStage(), next = clamp(from + delta, 0, this.cells);
      if (next === from) return false;
      if (delta > 0 && this.bottled) {
        if (!this.held) {
          this.bubbles = this.bubbles.filter(bub => !bub.deny);
          this.bubbles.push({ who: 'body', text: '沒酒了……', delay: 0, t: 0.8, deny: true });
          this.events.push('deny');
          return false;
        }
        this.held--;
      }
      if (this.looped) this.shiftGrade(next);
      else {
        this.booze = next;
        this.stageWarn = { to: next, t: 3, duration: 3, cells: this.stageDiff(this.stage, next) };
        this.events.push('warn');
      }
      this.events.push(delta > 0 ? 'ready' : 'fart');
      // the fart carries the grade's colour away: a cloud below Jim in the colour he is losing
      if (delta < 0) for (let i = 0; i < 12 && this.particles.length < 300; i++) this.particles.push({ x: this.body.x + (Math.random() - 0.5) * 20, y: this.body.y - 14, vx: (Math.random() - 0.5) * 200, vy: 120 + Math.random() * 180, life: 0.45 + Math.random() * 0.3, max: 0.75, size: 7 + Math.random() * 9, color: STAGE_TINT[from] });

    }

    // Loop rules: the body takes the new grade now and the world queues it, landing three seconds later in order.
    shiftGrade(next) {
      this.booze = next;
      const entry = { to: next, t: 3, duration: 3 };
      if (this.stageWarn) this.stageQueue.push(entry);
      else { entry.cells = this.stageDiff(this.stage, next); this.stageWarn = entry; }
      this.events.push('warn');
    }

    updateChillStage(dt) {
      const boxes = [this.box(this.body)].concat(this.stand && !this.stand.leaving ? [this.box(this.stand)] : [],
        this.entities.filter(e => e.kind === 'patrol' && e.alive).map(e => ({ x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h })));
      const blocked = (x, y, c) => SOLID.includes(c) && boxes.some(b => overlap(b, { x: x * T, y: y * T, w: T, h: T }));
      // loop rules: a solid that lands on Jim does not wait for him; he is stuck in the wall, and that is a death
      const jim = this.box(this.body), crushes = (x, y, c) => this.looped && this.state !== 'dead' && SOLID.includes(c) && overlap(jim, { x: x * T, y: y * T, w: T, h: T });
      const write = ([x, y, c]) => { this.tiles[y][x] = c; this.crumbles.delete(x + ',' + y); this.tilesVersion++; };
      this.stageDeferred = this.stageDeferred.filter(cell => { if (blocked(...cell)) return true; write(cell); return false; });
      if (!this.stageWarn) return;
      for (const q of this.stageQueue) q.t = Math.max(0, q.t - dt);
      this.stageWarn.t = Math.max(0, this.stageWarn.t - dt);
      if (this.stageWarn.t > 1e-9) return;
      const { to, cells } = this.stageWarn;
      // a newer change of the same cell replaces one still waiting for Jim or a guard to step out
      this.stageDeferred = this.stageDeferred.filter(([dx, dy]) => !cells.some(([x, y]) => x === dx && y === dy));
      for (const cell of cells) {
        if (crushes(...cell)) { write(cell); this.die('crush'); }
        else if (blocked(...cell)) this.stageDeferred.push(cell); else write(cell);
      }
      if (to !== this.stage) this.events.push(to > this.stage ? 'stageUp' : 'stageDown');
      this.stage = to; this.stageWarn = null; this.hallu = new Set();
      const next = this.stageQueue.shift();
      if (next) { next.cells = this.stageDiff(to, next.to); this.stageWarn = next; }
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (this.stageChar(x, y, to) !== this.stageChar(x, y, 0)) this.hallu.add(x + ',' + y);
    }

    // K in drunk mode: a short fart. Forward is a burst of speed, nothing or W lifts Jim like a flap.
    fart(input, dir) {
      if (this.chill) {
        if (this.changeGrade(-1) && this.looped) {
          const b = this.body;
          b.vy = Math.min(b.vy, -TUNING.fartHop); b.grounded = false; b.puff = true; this.coyote = 0; this.jumpBuf = 0;
          if (this.state === 'recover') this.state = 'free';
        } else if (this.looped && this.map.hud !== false && !this.targetStage() && this.fartCd <= 0 && this.phase === 'play' && this.state !== 'dead') {
          // sober: a dry little puff and nothing else, so K tells you it wants a drink
          this.fartCd = 0.3; this.events.push('deny');
          this.emit(this.body.x, this.body.y - 10, '#8a809f', 4, 80, 30);
        }
        return;
      }
      if (this.fartCd > 0 || !['free', 'thrown', 'recover'].includes(this.state)) return;
      const b = this.body;
      if (this.booze < TUNING.fartCost - 1e-9) {
        this.fartCd = 0.3; this.events.push('deny');
        this.bubbles = this.bubbles.filter(bub => !bub.deny);
        this.bubbles.push({ who: 'body', text: '……擠不出來', delay: 0, t: 0.7, deny: true });
        return;
      }
      this.booze = Math.max(0, this.booze - TUNING.fartCost);
      this.fartCd = TUNING.fartCooldown;
      if (this.state === 'recover') this.state = 'free';
      const dash = dir && !input.jump;
      if (dash) { b.vx = dir * Math.max(dir * b.vx, TUNING.fartDash); b.vy = Math.min(b.vy, -TUNING.fartDashLift); b.face = dir; }
      else b.vy = -TUNING.fartUp;
      b.grounded = false; b.puff = true; this.coyote = 0; this.jumpBuf = 0;
      this.events.push('fart');
      const back = dash ? -dir : 0;
      for (let i = 0; i < 6 && this.particles.length < 300; i++) this.particles.push({ x: b.x + back * 22, y: b.y - 18, vx: back * (120 + Math.random() * 160) + (Math.random() - 0.5) * 90, vy: back ? (Math.random() - 0.5) * 80 : 140 + Math.random() * 160, life: 0.35 + Math.random() * 0.25, max: 0.6, size: 6 + Math.random() * 8, color: i % 2 ? '#b5c25a' : '#8e9a4a' });
    }

    // J in drunk mode: every full cell goes at once and the shadow plays the whole chain by itself:
    // 3 cells 升天 → 衝 → 丟, 2 cells 衝 → 丟, 1 cell 丟. A/D and W/S still steer each part as it starts.
    pressZui() {
      // a day that lists its abilities without the wrestler has no shadow yet: J does nothing
      if (this.chill && !this.hasShadow) return;
      if (this.state === 'dead' || this.chain.length || this.state === 'lift' || this.state === 'charge') return;
      if (this.chill && this.chillAirUsed) return;
      const n = Math.min(this.cells, Math.floor(this.booze + 1e-9));
      if (n < 1 && this.corpses && this.callBack()) return;
      if (n < 1) {
        this.bubbles = this.bubbles.filter(bub => !bub.deny);
        this.bubbles.push({ who: 'body', text: '還不夠醉……', delay: 0, t: 0.8, deny: true });
        this.events.push('deny');
        return;
      }
      if (this.corpses) {
        if (n === 1 && !this.anchor) { this.events.push('deny'); return; }
      } else if (n === 2 && this.hitsSolid(this.box({ x: this.body.x, h: BODY_H + TUNING.carryOffset }, this.body.y))) { this.events.push('deny'); return; }
      if (this.chill) { this.chillAirUsed = true; this.chillFace = this.body.face; }
      else this.booze = 0;
      this.regenWait = TUNING.regenDelay;
      this.flash = { color: ZUI[n].tint, t: 0.25 };
      this.events.push('drink');
      if (this.corpses) { if (n === 1) this.leaveCorpse(); else this.startLift(); }
      else if (this.single) { if (n === 3) this.windup(); else if (n === 2) this.startCharge(); else this.startLift(); }
      else if (n === 3) { this.chain = ['charge', 'throw']; this.chainT = TUNING.chainAscend; this.ascend(); }
      else if (n === 2) { this.chain = ['throw']; this.startCharge(); this.timer = TUNING.chainCharge; }
      else this.startLift();
      // loop rules: the shadow eats a grade as the move starts (a refused charge eats nothing)
      if (this.looped && (n !== 2 || this.state === 'charge')) this.shiftGrade(n - 1);
    }

    // Jim's body stays where he is, lying in the air as a plank, and he wakes up on the spot of the last bottle he drank.
    // That bottle stays empty for as long as the body is there; walking back into it takes the body away again.
    leaveCorpse() {
      const b = this.body, to = this.anchor;
      const corpse = { kind: 'corpse', x: b.x, y: b.y - TUNING.corpseH, w: TUNING.corpseW, face: b.face, t: 0 };
      this.entities.push(corpse);
      Object.assign(to, { got: true, corpse, armed: false });
      this.anchor = null;
      this.warp = { x0: b.x, y0: b.y - BODY_H / 2, x1: to.x, y1: to.y, t: TUNING.warpTime };
      this.emit(b.x, b.y - BODY_H / 2, '#c9d3e6', 14, 260, 160);
      Object.assign(b, { x: to.x, y: to.y + T / 2, vx: 0, vy: 0, grounded: false });
      this.state = 'free'; this.chillAirUsed = false; this.coyote = 0; this.jumpBuf = 0;
      this.events.push('warp');
      this.emit(to.x, to.y, '#c9d3e6', 14, 260, 160);
    }

    // Nothing left to spend: J calls the last body back and Jim wakes at its bottle, wherever he got stuck.
    // A body in the wrong place never costs a death.
    callBack() {
      const body = this.entities.filter(e => e.kind === 'corpse').at(-1), to = body && this.entities.find(e => e.kind === 'bottle' && e.corpse === body);
      if (!to) return false;
      const b = this.body;
      this.entities = this.entities.filter(e => e !== body);
      this.emit(body.x, body.y, '#c9d3e6', 12, 220, 120);
      this.warp = { x0: b.x, y0: b.y - BODY_H / 2, x1: to.x, y1: to.y, t: TUNING.warpTime };
      Object.assign(to, { corpse: null, got: false, back: 0 });
      Object.assign(b, { x: to.x, y: to.y + T / 2, vx: 0, vy: 0, grounded: false });
      this.state = 'free'; this.coyote = 0; this.jumpBuf = 0;
      this.events.push('recall', 'warp');
      return true;
    }

    // A sensor holds while Jim, a body or a chair is in it: doors open and bridges appear. Nothing solid comes down on Jim:
    // a door waits until he is clear of it.
    updateDoors() {
      if (!this.sensors.length) return;
      const hit = (box, group) => this.sensors.some(s => s.group === group && overlap(box, s));
      const held = group => hit(this.box(this.body), group) || this.entities.some(e => e.kind === 'corpse' ? hit({ x: e.x - e.w / 2, y: e.y, w: e.w, h: TUNING.corpseH }, group)
        : e.kind === 'patrol' && e.alive && hit({ x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h }, group));
      for (const group of new Set(this.sensors.map(s => s.group))) {
        const sensed = held(group);
        if (sensed === !!this.sensedBy[group]) continue;
        const doors = this.doors.filter(d => d.group === group), solid = d => sensed === d.bridge, jim = this.box(this.body);
        if (doors.some(d => solid(d) && overlap(jim, { x: d.x * T, y: d.y * T, w: T, h: T }))) continue;
        for (const d of doors) this.tiles[d.y][d.x] = solid(d) ? 'G' : '.';
        this.tilesVersion++;
        this.sensedBy[group] = sensed;
        this.events.push(sensed ? 'stageUp' : 'stageDown');
      }
      this.sensed = Object.values(this.sensedBy).some(Boolean);
    }

    // Where a beam stops: the first solid under its fixture, or a body lying across it.
    beamEnd(v) {
      const cx = v.x * T + T / 2, top = (v.y + 1) * T;
      let cy = v.y + 1;
      while (cy < ROWS && !this.solid(v.x, cy)) cy++;
      let end = cy * T;
      for (const e of this.entities) if (e.kind === 'corpse' && Math.abs(e.x - cx) <= e.w / 2 && e.y >= top && e.y < end) end = e.y;
      return end;
    }

    updateBeams() {
      const bb = this.box(this.body), hurt = { x: bb.x + 10, y: bb.y + 6, w: bb.w - 20, h: bb.h - 6 };
      for (const v of this.beams) {
        const top = (v.y + 1) * T;
        if (overlap(hurt, { x: v.x * T + T / 2 - 2, y: top, w: 4, h: this.beamEnd(v) - top })) { this.die('beam'); return; }
      }
    }

    // A shutter's beat: where it is in its cycle (seconds) and how far down it hangs (0 up, 1 shut).
    shutterBeat(s) {
      const sh = this.room.shutter || {}, open = sh.open ?? TUNING.shutterOpen, shut = sh.shut ?? TUNING.shutterShut;
      const period = open + TUNING.shutterDrop + shut + TUNING.shutterLift, t = ((this.shutterT + s.offset) % period + period) % period;
      const down = t < open ? 0 : t < open + TUNING.shutterDrop ? (t - open) / TUNING.shutterDrop
        : t < open + TUNING.shutterDrop + shut ? 1 : 1 - (t - open - TUNING.shutterDrop - shut) / TUNING.shutterLift;
      return { down, warn: t < open && t > open - TUNING.shutterWarn, period, t };
    }
    // The steel hanging from a shutter's housing down to the first solid under it, or null while it is up.
    shutterRect(s) {
      const down = this.shutterBeat(s).down;
      if (down <= 0) return null;
      let cy = s.y + 1;
      while (cy < ROWS && !this.solid(s.x, cy)) cy++;
      const top = (s.y + 1) * T;
      return { x: s.x * T + 6, y: top, w: T - 12, h: (cy * T - top) * down };
    }
    shutterHit(box) {
      for (const s of this.shutters) { const r = this.shutterRect(s); if (r && overlap(box, r)) return r; }
      return null;
    }
    // a shutter coming down on Jim kills him (the steel keeps him out of it otherwise, so only its drop can reach him)
    updateShutters() {
      const bb = this.box(this.body), hurt = { x: bb.x + 6, y: bb.y + 6, w: bb.w - 12, h: bb.h - 6 };
      if (this.shutterHit(hurt)) this.die('crush');
    }

    // A body across a walker's way turns him back like a wall; it reaches the floor under it, arms hanging.
    bodyAhead(e, nx) {
      const box = { x: nx - e.w / 2, y: e.y - e.h, w: e.w, h: e.h };
      return this.entities.some(c => c.kind === 'corpse' && e.dir * (c.x - e.x) > 0 && overlap(box, { x: c.x - c.w / 2, y: c.y, w: c.w, h: TUNING.corpseH + 40 }));
    }

    // Single-skill 升天 squats first: Jim holds still (in the air too) and the fart goes off when the timer runs out.
    windup() {
      const b = this.body;
      this.windupT = TUNING.ascendWindup;
      b.vx = b.vy = 0;
      this.setAnim('idle');
      this.emit(b.x, b.y, '#b5c25a', 8, 160, 40);
    }

    // The third cell: Jim's own enormous fart. Straight up, high, and through crates overhead.
    ascend() {
      const b = this.body;
      if (this.stand) this.stand.leaving = true;
      this.state = 'free';
      b.vy = -TUNING.ascendVY; b.vx *= 0.4; b.grounded = false; b.puff = true;
      this.ascendT = TUNING.ascendBreak; this.coyote = 0; this.ascended = this.single;
      this.hitStop = 0.07; this.shake = 0.4;
      this.events.push('bigfart');
      this.shout('body', ['噗————！！', '對不起大家！', '升天啦——']);
      for (let i = 0; i < 34 && this.particles.length < 300; i++) this.particles.push({ x: b.x + (Math.random() - 0.5) * 50, y: b.y - 6, vx: (Math.random() - 0.5) * 520, vy: 60 + Math.random() * 260, life: 0.5 + Math.random() * 0.4, max: 0.9, size: 8 + Math.random() * 14, color: i % 3 ? '#b5c25a' : '#e8e2a0' });
    }

    tileAt(cx, cy) {
      if (cx < 0) return this.exits.left !== undefined ? '.' : '#';
      if (cx >= COLS) return this.exits.right !== undefined ? '.' : '#';
      if (cy < 0) return this.exits.top !== undefined ? '.' : '#';
      if (cy >= ROWS) return '.';
      return this.tiles[cy][cx];
    }

    solid(cx, cy) { return SOLID.includes(this.tileAt(cx, cy)); }

    box(b, y = b.y) { const h = b.h || BODY_H; return { x: b.x - BODY_W / 2, y: y - h, w: BODY_W, h }; }

    hitsSolid(box) {
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (this.solid(x, y)) return true;
      return false;
    }

    moveX(b, dx) {
      b.x += dx;
      const box = this.box(b);
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        if (!this.solid(x, y)) continue;
        // Jim is wider than a tile: a wall brushing his trailing side must not pull him through it
        if (dx > 0 ? (x + 1) * T <= b.x : dx < 0 && x * T >= b.x) continue;
        b.x = dx > 0 ? x * T - BODY_W / 2 : (x + 1) * T + BODY_W / 2;
        b.vx = 0;
        return true;
      }
      // a hanging shutter is a wall too, from whichever side he comes
      // (only walking into it: one already under him when it came down is the drop's, and kills)
      const slab = b === this.body && dx && this.shutterHit(this.box(b));
      if (slab && !overlap(this.box({ ...b, x: b.x - dx }), slab)) {
        b.x = dx > 0 ? slab.x - BODY_W / 2 : slab.x + slab.w + BODY_W / 2;
        b.vx = 0;
        return true;
      }
      return false;
    }

    moveY(b, dy) {
      const prevBottom = b.y, fall = b.vy;
      b.y += dy;
      b.grounded = false;
      if (b === this.body) b.cart = -1;
      const box = this.box(b);
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const t = this.tileAt(x, y);
        const floorOnly = (t === '=' || (t === '^' && b.glassFloor)) && dy > 0 && prevBottom <= y * T + 0.01;
        if (!(SOLID.includes(t) || floorOnly)) continue;
        if (dy > 0) { b.y = y * T; b.grounded = true; } else b.y = (y + 1) * T + (b.h || BODY_H);
        b.vy = 0;
        // any sofa under his feet throws him, whichever side the other floor is on
        if (dy > 0 && b === this.body) for (let sx = x0; sx <= x1; sx++) if (this.tileAt(sx, y) === 'S') { this.bounce(fall); break; }
        return true;
      }
      // jumping up into a hanging shutter stops his head on its bottom edge
      if (dy < 0 && b === this.body) {
        const slab = this.shutterHit(this.box(b));
        if (slab && prevBottom - (b.h || BODY_H) >= slab.y + slab.h - 0.01) { b.y = slab.y + slab.h + (b.h || BODY_H); b.vy = 0; return true; }
      }
      // Jim lands on a cart's deck, or a body he left behind, from above, like a plank; beltUnder makes a cart carry him
      if (dy > 0 && b === this.body) {
        const box = this.box(b);
        const i = this.entities.findIndex(e => (e.kind === 'cart' || e.kind === 'corpse') && box.x < e.x + e.w / 2 && box.x + box.w > e.x - e.w / 2 && prevBottom <= e.y + 0.01 && b.y >= e.y);
        if (i >= 0) { b.y = this.entities[i].y; b.grounded = true; b.vy = 0; b.cart = this.entities[i].kind === 'cart' ? i : -1; return true; }
      }
      return false;
    }

    // A sofa throws Jim back up: harder the faster he lands. It counts as touching down, so J is back.
    bounce(fall) {
      const b = this.body;
      b.vy = -clamp(Math.max(TUNING.sofa, fall * TUNING.sofaKeep), 0, TUNING.sofaMax);
      b.vx = clamp(b.vx, -TUNING.run, TUNING.run);   // a throw's sideways speed is spent on the cushion
      b.grounded = false; b.puff = true; b.carry = 0; this.coyote = 0; this.jumpBuf = 0;
      this.pound = null; this.ascendT = 0;   // a ground pound ends on the cushion
      if (this.chill) this.chillAirUsed = false;
      if (this.state === 'thrown' || this.state === 'recover') this.state = 'free';
      this.events.push('bounce');
      this.emit(b.x, b.y, '#c58ad6', 10, 260, 120);
    }

    physics(dt) {
      const b = this.body;
      b.vy = Math.min(TUNING.maxFall, b.vy + TUNING.gravity * dt);
      this.moveX(b, b.vx * dt);
      this.moveY(b, b.vy * dt);
    }

    emit(x, y, color, count, spread = 220, lift = 180) {
      for (let i = 0; i < count && this.particles.length < 300; i++) {
        this.particles.push({ x, y, vx: (Math.random() - 0.5) * spread, vy: -Math.random() * lift, life: 0.5 + Math.random() * 0.35, max: 0.85, size: 3 + Math.random() * 4, color });
      }
    }

    // K opens the slot. The skill behind the current action is left out of the pool, and once off the
    // ground only TUNING.airDraws draws are allowed until the body touches down again.
    pressK() {
      if (this.state === 'dead' || this.slot || this.drinkT > 0) return;
      // a drunk card is held for TUNING.holdTime seconds; K spends it whenever the moment is right
      if (this.ready) { const id = this.ready.id; this.ready = null; this.fire(id); return; }
      const pool = this.map.abilities.filter(a => a !== this.activeSkill);
      const airborne = !this.body.grounded || ['lift', 'thrown', 'charge'].includes(this.state);
      if (!pool.length || (airborne && this.airDraws >= TUNING.airDraws)) {
        this.bubbles = this.bubbles.filter(bub => !bub.deny);
        this.bubbles.push({ who: 'body', text: '現在抽不了', delay: 0, t: 0.8, deny: true });
        this.events.push('deny');
        return;
      }
      if (airborne) this.airDraws++;
      this.slot = { pool, mode: 'spin', index: 0, t: 0, age: 0, flip: 0, ticks: 0, braked: 0, brakeSteps: 0 };
      this.events.push('slotOpen');
    }

    // Direct mode: the skill's own key fires it at once, under the same day-pool and air rules as the draw.
    pressSkill(id) {
      if (this.drunk) { if (id === 'wrestler') this.pressZui(); return; }
      if (this.state === 'dead') return;
      const airborne = !this.body.grounded || ['lift', 'thrown', 'charge'].includes(this.state);
      const why = !this.map.abilities.includes(id) ? '今天沒有這招'
        : id === this.activeSkill ? '正在用'
        : airborne && this.airDraws >= TUNING.airDraws ? '現在用不了' : null;
      if (why) {
        this.bubbles = this.bubbles.filter(bub => !bub.deny);
        this.bubbles.push({ who: 'body', text: why, delay: 0, t: 0.8, deny: true });
        this.events.push('deny');
        return;
      }
      // a charge spends the air use even from the ground, so chaining off it takes a smash or a knock
      if (airborne || id === 'bodyguard') this.airDraws++;
      this.flash = { color: ABILITIES[id].tint, t: 0.2 };
      this.events.push('drink');
      this.fire(id);
    }

    // A helper's shout rides on the helper itself, so it follows a charge across the room.
    shout(who, lines) { this.bubbles.push({ who, text: lines[Math.floor(Math.random() * lines.length)], delay: 0, t: 0.9 }); }

    // Velocity of the wrestler's throw for the arc chosen while lifted.
    throwVel(kind = this.throwKind) {
      const [vx, vy] = kind === 'up' ? [TUNING.throwUpVX, TUNING.throwUpVY] : kind === 'low' ? [TUNING.throwLowVX, TUNING.throwLowVY] : [TUNING.throwVX, TUNING.throwVY];
      return { vx: this.aim * vx, vy: -vy };
    }

    // A crate smashed or a guard knocked mid-charge earns the air use back, so chains can continue.
    refreshAir() {
      if (this.drunk) return;
      if (this.airDraws || this.activeSkill) { this.events.push('ready'); this.flash = { color: '#f2c24f', t: 0.15 }; if (this.stand) this.shout(this.stand, ['下一位！', '再來！']); }
      this.airDraws = 0; this.activeSkill = null;
    }

    // Pick a Card: the cards cycle in real time while the world crawls at TUNING.slowmo;
    // pressing K again locks the card on show at once, then Jim takes a sip and the skill fires.
    lockSlot() {
      const sl = this.slot;
      sl.mode = 'reveal';
      sl.t = 0;
      sl.chosen = sl.index;
      this.pending = sl.pool[sl.index];
      this.flash = { color: ABILITIES[this.pending].tint, t: 0.45 };
      this.shake = 0.18;
      this.drinkT = TUNING.drink;
      this.events.push('reveal', 'drink');
    }

    updateSlot(dt, kPressed) {
      const sl = this.slot, n = sl.pool.length;
      sl.t += dt; sl.age += dt;
      sl.flip = Math.min(1, sl.flip + dt / 0.09);
      if (sl.mode === 'spin') {
        if (kPressed && sl.age > 0.12) { this.lockSlot(); return; }
        if (sl.t >= TUNING.cardInterval) {
          sl.t = 0; sl.index = (sl.index + 1) % n; sl.flip = 0; sl.ticks++;
          this.events.push('tick');
          if (sl.ticks >= 12) this.lockSlot();
        }
      } else if (sl.t >= 0.35) this.slot = null;
    }

    fire(id) {
      this.pending = null;
      if (id === 'wrestler') this.startLift();
      if (id === 'bodyguard') this.startCharge();
    }

    // Bodyguard: the stand shoulders the body and charges at a constant speed through crates; glass cannot hurt the stand.
    startCharge() {
      const b = this.body;
      if (this.chill) b.face = this.chillFace;
      const airborne = !b.grounded || this.state !== 'free';
      const s = { x: b.x, y: b.y, vx: 0, vy: 0, h: BODY_H + TUNING.carryOffset, glassFloor: true, face: b.face, ability: 'bodyguard', alpha: 1, leaving: false };
      if (this.hitsSolid(this.box(s))) { this.emit(b.x, b.y - 40, ABILITIES.bodyguard.tint, 10); this.events.push('deny'); return; }
      this.activeSkill = 'bodyguard';
      this.airCharge = airborne ? TUNING.airCharge : 0;
      this.events.push('charge');
      this.state = 'charge';
      this.timer = TUNING.chargeTime;
      this.chargeDir = b.face;
      this.speed = TUNING.chargeSpeed;
      this.turnTime = 0;
      this.stand = s;
      b.vx = b.vy = 0;
      this.carry();
      this.setAnim('fall');
      this.emit(b.x, s.y, ABILITIES.bodyguard.tint, 14);
      this.shout(s, ['讓開讓開！', '老闆借過！', '衝啊——']);
    }

    carry() {
      const s = this.stand, b = this.body;
      b.x = s.x - this.chargeDir * 8;
      b.y = s.y - TUNING.carryOffset;
      b.face = this.chargeDir;
    }

    // Moves the stand horizontally, smashing crates; returns true when a wall stops the charge.
    chargeMove(st, dx) {
      st.x += dx;
      const box = this.box(st);
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      let wall = false;
      const crates = [];
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const t = this.tileAt(x, y);
        if (t === 'B' || t === 'C') crates.push([x, y]); else if (SOLID.includes(t)) wall = true;
      }
      if (crates.length) {
        for (const [x, y] of crates) this.breakFrom(x, y);
        this.shake = 0.35;
        this.hitStop = TUNING.hitStop;
        this.events.push('break');
        this.refreshAir();
      }
      if (!wall) return false;
      const col = dx > 0 ? x1 : x0;
      st.x = dx > 0 ? col * T - BODY_W / 2 : (col + 1) * T + BODY_W / 2;
      return true;
    }

    breakFrom(x, y) {
      const kind = this.tiles[y][x], stack = [[x, y]];
      if (kind !== 'B' && kind !== 'C') return;
      let n = 0;
      while (stack.length) {
        const [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS || this.tiles[cy][cx] !== kind) continue;
        this.tiles[cy][cx] = '.';
        this.crumbles.delete(cx + ',' + cy);
        n++;
        this.emit(cx * T + T / 2, cy * T + T / 2, n % 2 ? '#c98a5a' : '#f0c08a', 3, 380, 260);
        stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
      }
      if (n) this.tilesVersion++;
    }

    // Running out of time tosses Jim forward; slamming into a wall bounces him back with a thud.
    finishCharge(hitWall) {
      const st = this.stand, b = this.body;
      this.state = 'thrown';
      this.events.push(hitWall ? 'knock' : 'throw');
      b.x = st.x;
      b.y = st.y - TUNING.carryOffset;
      if (hitWall) {
        b.vx = -this.chargeDir * 260; b.vy = -420;
        this.shake = 0.35; this.hitStop = 0.08;
        this.shout(st, ['老闆，牆比較硬', '痛痛痛……']);
        this.emit(b.x + this.chargeDir * 30, b.y - 20, '#f2c24f', 14, 420, 300);
      } else {
        b.vx = this.chargeDir * Math.max(360, this.speed * 0.55);
        b.vy = -TUNING.releaseVY;
      }
      st.leaving = true;
      this.setAnim('jump');
    }

    // Jump mid-charge: Jim leaps off the bodyguard's shoulders and keeps most of the speed.
    jumpOut() {
      const b = this.body;
      this.chain = [];
      this.state = 'free';
      this.stand.leaving = true;
      this.shout(this.stand, ['欸！你去哪？', '不用送了？']);
      b.vx = this.chargeDir * TUNING.chargeSpeed * TUNING.chargeJumpOut;
      b.vy = -TUNING.jump;
      b.grounded = false;
      this.jumpBuf = this.coyote = 0;
      this.events.push('jump');
      this.emit(b.x, b.y, ABILITIES.bodyguard.tint, 10, 260, 120);
      this.setAnim('jump');
    }

    startLift() {
      const b = this.body;
      this.activeSkill = 'wrestler';
      this.events.push('lift');
      this.state = 'lift';
      this.timer = TUNING.liftTime;
      this.aim = b.face;
      this.throwKind = 'mid';
      this.stand = { x: b.x, y: b.y, h: 150, face: b.face, ability: 'wrestler', alpha: 1, leaving: false };
      this.shout(this.stand, ['喝！', '飛吧社畜！', '下班囉——']);
      b.vx = b.vy = 0;
      let h = 0;
      while (h < TUNING.liftHeight && !this.hitsSolid(this.box(b, b.y - h - 4))) h += 4;
      this.liftFrom = b.y;
      this.liftTo = b.y - h;
      this.liftT = 0;
      this.setAnim('jump');
      this.emit(b.x, b.y, ABILITIES.wrestler.tint, 14);
    }

    setAnim(name) { if (this.body.anim !== name) { this.body.anim = name; this.body.animTime = 0; } }

    // Conveyor speed under a grounded actor's centre.
    beltUnder(a) {
      if (!a.grounded) return 0;
      // a cart's deck pushes like a belt running at the cart's speed, so a jump off it keeps that speed
      const cart = a === this.body && a.cart >= 0 && this.entities[a.cart];
      if (cart) return cart.dir * cart.speed;
      const t = this.tileAt(Math.floor(a.x / T), Math.round(a.y / T));
      return t === '>' ? TUNING.belt : t === '<' ? -TUNING.belt : 0;
    }

    // Standing on a box stack starts the whole connected stack shaking.
    touchCrumble(a) {
      if (!a.grounded) return;
      const row = Math.round(a.y / T), box = this.box(a);
      for (let x = Math.floor(box.x / T); x <= Math.floor((box.x + box.w - 1e-6) / T); x++) {
        if (this.tileAt(x, row) !== 'C' || this.crumbles.has(x + ',' + row)) continue;
        const stack = [[x, row]];
        while (stack.length) {
          const [cx, cy] = stack.pop(), key = cx + ',' + cy;
          if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS || this.tiles[cy][cx] !== 'C' || this.crumbles.has(key)) continue;
          this.crumbles.set(key, { x: cx, y: cy, phase: 'shake', t: TUNING.crumbleDelay });
          stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
        }
      }
    }

    updateCrumbles(dt) {
      const body = this.box(this.body);
      for (const [key, c] of this.crumbles) {
        c.t -= dt;
        if (c.phase === 'shake') {
          if (Math.random() < dt * 8) this.emit(c.x * T + Math.random() * T, c.y * T + T, '#d9b98a', 1, 60, 20);
          if (c.t <= 0) { this.events.push('crumble'); this.tiles[c.y][c.x] = '.'; c.phase = 'gone'; c.t = TUNING.crumbleRespawn; this.emit(c.x * T + T / 2, c.y * T + T / 2, '#c89a64', 4, 260, 160); }
        } else if (c.t <= 0 && !overlap(body, { x: c.x * T, y: c.y * T, w: T, h: T })) {
          this.tiles[c.y][c.x] = 'C';
          this.crumbles.delete(key);
        }
      }
    }

    updateEntities(dt) {
      const b = this.body, bb = this.box(b), hurt = { x: bb.x + 6, y: bb.y + 6, w: bb.w - 12, h: bb.h - 6 };
      for (const e of this.entities) {
        e.t += dt;
        if (e.kind === 'patrol') {
          if (!e.alive) { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 2000 * dt; continue; }
          // puzzle rules: a guard whose floor fades three seconds late falls; glass or the pit ends his shift
          if (this.chill && this.patrolFall(e, dt)) continue;
          const nx = e.x + e.dir * TUNING.patrolSpeed * dt, front = Math.floor((nx + e.dir * e.w / 2) / T);
          if (this.solid(front, Math.floor((e.y - 10) / T)) || !this.solid(front, Math.floor(e.y / T)) || nx < e.w / 2 || nx > W - e.w / 2 || this.bodyAhead(e, nx)) e.dir = -e.dir;
          else e.x = nx;
          const box = { x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h };
          if (this.state === 'charge' && overlap(this.box(this.stand), box)) {
            e.alive = false; e.vx = this.chargeDir * 520; e.vy = -620; this.shake = 0.3;
            this.hitStop = TUNING.hitStop * 1.5; this.events.push('knock');
            this.refreshAir();
            this.shout(e, ['我只是約聘的——', '哇啊——', '我要申訴——']);
            this.emit(e.x, e.y - e.h / 2, '#f3e9d2', 12, 380, 260);
            continue;
          }
          if (this.state !== 'dead' && overlap(hurt, box)) this.die('guard');
          if (e.skin === 'guard' && Math.abs(e.x - b.x) < 320 && (e.said || -9) < e.t - 4) {
            e.said = e.t;
            this.bubbles.push({ who: e, text: GUARD_LINES[Math.floor(Math.random() * GUARD_LINES.length)], delay: 0, t: 1.8 });
          }
        } else if (e.kind === 'bottle' && this.looped) {
          // drunk on touch below the day's top grade; it comes back once Jim has stepped off its spot
          const spot = { x: e.x - 12, y: e.y - 18, w: 24, h: 36 };
          // its own countdown: e.t is every entity's age and goes up each step
          // a bottle holding a body stays empty; stepping off its spot and back in takes the body away and the bottle returns
          if (e.corpse) {
            const inside = overlap(bb, spot);
            if (!inside) e.armed = true;
            else if (e.armed && this.state !== 'dead') {
              this.entities = this.entities.filter(c => c !== e.corpse);
              this.emit(e.corpse.x, e.corpse.y, '#c9d3e6', 12, 220, 120);
              e.corpse = null; e.got = false; e.back = 0;
              this.events.push('recall');
            }
          } else if (e.got) { if ((e.back -= dt) <= 0 && !overlap(bb, spot)) e.got = false; }
          else if (this.state !== 'dead' && this.targetStage() < this.cells && overlap(bb, spot)) {
            e.got = true; e.back = TUNING.bottleRespawn;
            if (this.corpses) this.anchor = e;
            this.shiftGrade(this.targetStage() + 1); this.events.push('ready');
            this.emit(e.x, e.y, '#8fd18a', 10, 220, 160);
          }
        } else if (e.kind === 'bottle') {
          if (!e.got && this.held < TUNING.carry && overlap(bb, { x: e.x - 12, y: e.y - 18, w: 24, h: 36 })) {
            e.got = true; this.held++; this.events.push('cap');
            this.emit(e.x, e.y, '#8fd18a', 10, 220, 160);
          }
        } else if (e.kind === 'cap' && this.looped) {
          // loop rules: a cocktail (Celeste's strawberry) follows Jim and counts only once he stands on solid ground; a death loses it
          if (!e.got && !this.berry && this.state !== 'dead' && overlap(bb, { x: e.x - 14, y: e.y - 14, w: 28, h: 28 })) {
            e.got = true; this.berry = { key: e.key, x: e.x, y: e.y };
            this.events.push('ready'); this.emit(e.x, e.y, '#e0484d', 10, 220, 160);
          }
        } else if (e.kind === 'cap') {
          if (!e.got && overlap(bb, { x: e.x - 14, y: e.y - 14, w: 28, h: 28 })) {
            e.got = true; this.roomCaps.push(e.key); this.events.push('cap');
            if (this.chill) this.capsGot.add(e.key);
            this.emit(e.x, e.y, '#f2c24f', 14, 300, 220);
          }
        } else if (e.kind === 'cart') {
          const step = e.dir * e.speed * dt, ahead = e.x + step + e.dir * e.w / 2;
          const col = Math.floor((e.dir > 0 ? ahead - 1e-6 : ahead) / T);
          if (ahead < 0 || ahead > W || this.solid(col, Math.floor(e.y / T)) || this.solid(col, Math.floor((e.y + e.h - 1) / T))) e.dir = -e.dir;
          else e.x += step;
        } else if (e.kind === 'faller') {
          if (e.phase === 'idle') {
            if (Math.abs(b.x - e.x) < TUNING.fallTrigger && b.y > e.y) { e.phase = 'warn'; e.t = 0; this.events.push('warn'); }
          } else if (e.phase === 'warn') {
            if (e.t >= TUNING.fallWarn) { e.phase = 'fall'; e.vy = 300; }
          } else if (e.phase === 'fall') {
            e.vy += 3000 * dt; e.y += e.vy * dt;
            const box = { x: e.x - e.w / 2, y: e.y, w: e.w, h: e.h };
            if (this.state !== 'dead' && overlap(hurt, box)) this.die('sign');
            const row = Math.floor((e.y + e.h) / T);
            let land = e.y > H;
            for (let c = Math.floor(box.x / T); c <= Math.floor((box.x + box.w - 1e-6) / T); c++) if (this.solid(c, row)) land = true;
            if (land) { e.phase = 'gone'; this.shake = Math.max(this.shake, 0.15); this.events.push('crash'); this.emit(e.x, e.y + e.h, e.skin === 'tube' ? '#e8f3ee' : '#ff8a7a', 16, 420, 220); }
          }
        }
      }
    }

    // Returns true while the patrol is off its feet (falling, or just knocked out by the landing).
    patrolFall(e, dt) {
      const cols = [Math.floor((e.x - e.w / 2 + 2) / T), Math.floor((e.x + e.w / 2 - 2) / T)];
      const footing = row => cols.some(c => this.solid(c, row) || this.tileAt(c, row) === '=');
      if (!e.vy && footing(Math.round(e.y / T))) return false;
      const before = e.y;
      e.vy = Math.min((e.vy || 0) + 2000 * dt, 1400); e.y += e.vy * dt;
      const row = Math.floor(e.y / T);
      if (row > Math.floor((before - 1e-6) / T) && footing(row)) { e.y = row * T; e.vy = 0; }
      const glass = cols.some(c => this.tileAt(c, Math.floor((e.y - 1) / T)) === '^' || this.tileAt(c, Math.floor(e.y / T)) === '^');
      if (glass || e.y > H + e.h) {
        e.alive = false; e.vx = 0; e.vy = -300; this.events.push('knock');
        if (e.y <= H) this.emit(e.x, e.y - e.h / 2, '#f3e9d2', 12, 380, 260);
        return true;
      }
      if (e.vy) {
        const b = this.body, bb = this.box(b), box = { x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h };
        if (this.state !== 'dead' && overlap({ x: bb.x + 6, y: bb.y + 6, w: bb.w - 12, h: bb.h - 6 }, box)) this.die('guard');
      }
      return !!e.vy;
    }

    // The cocktail Jim carries trails behind him, across rooms too, until he lands: then it is his for good.
    updateBerry(dt) {
      const bz = this.berry, b = this.body;
      if (!bz) return;
      const k = Math.min(1, dt * 8);
      bz.x += (b.x - b.face * 34 - bz.x) * k; bz.y += (b.y - 96 - bz.y) * k;
      if (b.grounded && (this.state === 'free' || this.state === 'recover')) {
        this.capsGot.add(bz.key); this.berry = null;
        this.events.push('cap'); this.emit(bz.x, bz.y, '#e0484d', 16, 300, 220);
      }
    }

    die(cause) {
      if (this.state === 'dead') return;
      this.berry = null;
      const b = this.body;
      this.state = 'dead';
      this.timer = TUNING.deathDelay;
      this.deaths++;
      this.mapDeaths++;
      this.shake = 0.45;
      this.stand = null;
      this.slot = null;
      this.drinkT = 0;
      this.ready = null;
      this.events.push('die');
      // Jim is already dead, so a death is a punchline: his ghost floats up and complains
      this.ghost = { x: b.x, y: b.y, face: b.face, t: 0 };
      this.shout('body', this.deaths % 5 === 0 ? [`第 ${this.deaths} 次下班`] : DEATH_LINES[cause] || DEATH_LINES.other);
      this.emit(b.x, b.y - BODY_H / 2, '#f3e9d2', 26, 520, 420);
      this.emit(b.x, b.y - BODY_H / 2, '#e0605a', 10, 400, 300);
    }

    leave(side, target = this.exits[side]) {
      this.carryBooze = this.booze;
      for (const k of this.roomCaps) this.capsGot.add(k);
      this.roomCaps = [];
      if (target === null) { this.phase = 'mapEnd'; this.timer = 0; return; }
      const from = this.room, to = this.map.rooms.find(r => r.id === target);
      if (side && from.at && to?.at) { this.panTo(side, to); return; }
      this.phase = 'transition';
      this.transT = TUNING.transition;
      this.nextRoom = target;
    }

    // Rooms on a map are one world: Jim goes on from the matching spot on the next room's edge with his speed,
    // and the camera slides over. A death there sends him back to that room's own spawn.
    panTo(side, to) {
      const b = this.body, keep = { x: b.x, y: b.y, vx: b.vx, vy: b.vy, face: b.face, thrown: this.state === 'thrown', airUsed: this.chillAirUsed };
      const [dx, dy] = { right: [-W, 0], left: [W, 0], top: [0, H], bottom: [0, -H] }[side];
      const from = this.room.id;
      this.enterRoom(to.id);
      if (this.phase === 'intro') return;   // a room's cutscene card plays first, from its spawn
      const nb = this.body;
      Object.assign(nb, { x: keep.x + dx, y: keep.y + dy, vx: keep.vx, vy: side === 'top' ? Math.min(keep.vy, -TUNING.panBoost) : keep.vy, face: keep.face, grounded: false });
      if (this.hitsSolid(this.box(nb))) Object.assign(nb, { x: this.spawn.x, y: this.spawn.y, vx: 0, vy: 0 });
      else { if (keep.thrown) this.state = 'thrown'; this.chillAirUsed = keep.airUsed; }
      this.pan = { side, from };
      this.phase = 'transition';
      this.transT = TUNING.pan;
      this.nextRoom = null;
    }

    // A hard landing near an NPC half-wakes them.
    wakeNpcs() {
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if (this.tiles[y][x] !== 'N' || Math.hypot(this.body.x - (x + .5) * T, this.body.y - (y + 1) * T) > 200) continue;
        this.shout({ x: (x + .5) * T, y: (y + 1) * T, h: 90 }, ['……誰？……算了，再五分鐘。', '……地震？', '……下班了？']);
      }
    }

    nearbyNpc() {
      let nearest = null, distance = T * 2;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (this.tiles[y][x] === 'N') {
        const d = Math.hypot(this.body.x - (x + .5) * T, this.body.y - (y + 1) * T);
        if (d < distance) { distance = d; nearest = { x, y, data: this.room.npcs?.[`${x},${y}`] }; }
      }
      return nearest;
    }
    // input also accepts talkPressed and choice (1-9).
    step(dt, input = {}) {
      this.time += dt;
      this.shake = Math.max(0, this.shake - dt * 2.5);
      for (const p of this.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; }
      this.particles = this.particles.filter(p => p.life > 0);
      for (const bub of this.bubbles) { if (bub.delay > 0) bub.delay -= dt; else bub.t -= dt; }
      this.bubbles = this.bubbles.filter(bub => bub.t > 0);

      if (this.phase === 'intro') {
        this.timer += dt;
        // a longer card stays up longer before it moves on by itself
        if ((this.timer > 0.5 && (input.confirmPressed || input.kPressed || input.jumpPressed)) || this.timer > Math.max(4, (this.card?.text.split('\n').length ?? 0) * 1.5)) this.phase = 'play';
        return;
      }

      if (this.phase === 'transition') {
        const before = this.transT;
        this.transT -= dt;
        if (this.nextRoom && before > TUNING.transition / 2 && this.transT <= TUNING.transition / 2) this.enterRoom(this.nextRoom);
        if (this.transT <= 0) { this.phase = 'play'; this.pan = null; }
        return;
      }
      if (this.phase === 'mapEnd') {
        this.timer += dt;
        // loop rules have no end card: the screen goes dark and the next day starts
        if ((input.confirmPressed || (this.looped && this.timer > 0.8)) && this.timer > 0.6) this.startMap(this.mapIndex + 1 < this.campaign.maps.length ? this.mapIndex + 1 : 0);
        return;
      }

      if (this.flash) { this.flash.t -= dt; if (this.flash.t <= 0) this.flash = null; }
      if (this.warp && (this.warp.t -= dt) <= 0) this.warp = null;
      this.mapTime += dt;
      this.roomTitle = Math.max(0, this.roomTitle - dt);
      const b = this.body;

      if (this.state === 'dead') {
        this.timer -= dt;
        this.ghost.t += dt;
        if (this.timer <= 0) {
          const said = this.bubbles.filter(bub => bub.who === 'body');
          this.enterRoom(this.room.id);
          this.bubbles.push(...said);
          this.body.landT = 0.15;
        }
        return;
      }
      if (this.dialogue) {
        const { data, node } = this.dialogue, current = data.nodes[node];
        let next;
        if (current.choices?.length && input.choice) next = current.choices[input.choice - 1]?.next;
        else if (!current.choices?.length && (input.talkPressed || input.confirmPressed)) next = current.next ?? null;
        if (next !== undefined) this.dialogue = next === null ? null : { data, node: next };
        return;
      }
      if (input.talkPressed && this.state === 'free') {
        const npc = this.nearbyNpc();
        if (npc?.data) { this.dialogue = { data: npc.data, node: npc.data.start }; return; }
      }
      if (this.chill) {
        this.updateChillStage(dt);
        if (!this.looped && (input.gradeUpPressed || input.talkPressed)) this.changeGrade(1);
        if (input.skill && !!input.right !== !!input.left) b.face = input.right ? 1 : -1;
      }

      // the card overlay and the sip run in real time; the world keeps moving, slowly
      let kTaken = false;
      if (this.slot) { this.updateSlot(dt, input.kPressed); kTaken = true; }
      if (this.drinkT > 0) { kTaken = true; this.drinkT -= dt; if (this.drinkT <= 0) { this.drinkT = 0; this.ready = { id: this.pending, t: TUNING.holdTime }; this.pending = null; this.events.push('ready'); } }
      if (this.ready && (this.ready.t -= dt) <= 0) { this.ready = null; this.events.push('deny'); this.bubbles.push({ who: 'body', text: '酒退了……', delay: 0, t: 1 }); }
      this.fartCd = Math.max(0, (this.fartCd || 0) - dt);
      if (this.drunk) {
        if (this.chill && input.kPressed) this.fart(input, 0);
        if (input.skill) this.pressSkill(input.skill);
