<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>醉隱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0e0b1c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "KaiTi", serif; }
  canvas { display: block; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); background: #2b2860; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(14, 11, 28, .82); color: #f3e9d2; }
  #menu[hidden] { display: none; }
  #menu h2 { font-weight: normal; font-size: 34px; margin: 0 0 18px; letter-spacing: 4px; }
  #menu button { font: inherit; font-size: 22px; color: inherit; background: none; border: 0; padding: 6px 14px; cursor: pointer; opacity: .78; }
  #menu button:hover, #menu button:focus-visible { opacity: 1; text-decoration: underline wavy rgba(243, 233, 210, .5); outline: none; }
  #menu small { margin-top: 22px; opacity: .55; font-size: 15px; text-align: center; line-height: 1.8; }
  #tune { position: fixed; top: 10px; right: 10px; width: 250px; max-height: calc(100vh - 20px); overflow: auto; padding: 12px 14px; background: rgba(14, 11, 28, .88); color: #f3e9d2; font-size: 14px; border-radius: 4px; }
  #tune[hidden] { display: none; }
  #tune b { display: block; font-weight: normal; font-size: 18px; margin-bottom: 6px; }
  #tune label { display: grid; grid-template-columns: 1fr 44px; gap: 0 6px; margin: 6px 0; }
  #tune input { grid-column: 1; width: 100%; accent-color: #e0a87a; }
  #tune span { grid-column: 2; grid-row: 1 / 3; align-self: end; text-align: right; opacity: .8; }
  #tune button { font: inherit; color: inherit; background: none; border: 1px solid rgba(243, 233, 210, .35); padding: 3px 10px; margin: 8px 6px 0 0; cursor: pointer; }
  #tune textarea { width: 100%; height: 70px; margin-top: 8px; font-size: 11px; background: #1b1633; color: inherit; border: 0; }
  #menuMsg { color: #f0a49c; white-space: pre-line; font-size: 15px; max-width: 80vw; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0"></canvas>
<div id="talk" hidden style="position:fixed;bottom:5%;left:15%;width:70%;max-height:45vh;overflow:auto;background:#151127;color:#f3e9d2;padding:18px;box-sizing:border-box;border:1px solid #e0a87a;white-space:pre-wrap"></div>
<div id="menu" hidden>
  <h2>暫停</h2>
  <button data-act="resume">繼續</button>
  <button data-act="retry">重來這間</button>
  <button data-act="restart">從第一間開始</button>
  <button data-act="load">載入關卡 JSON</button>
  <button data-act="default">換回內建關卡</button>
  <p id="menuMsg"></p>
  <small>A D 走　W 跳　K 放屁（按住 A/D 是加速，不按方向或按 W 往上噴，要一直點）　J 叫醉影　R 重來　P 自動通關本間　M 靜音　` 調手感<br>醉意會自己回滿。J 一次用掉全部滿格，自動連段：一格 丟、兩格 衝→丟、三格 升天→衝→丟；放屁扣小格<br>滿格越多越醉：醉影越強，地圖也越危險（先預告，落地才變；預告時放屁可以取消）<br>舊關卡（沒有 cells）沿用 J 摔角手、L 保鑣　·　也可以直接把 JSON 拖進畫面</small>
</div>
<div id="tune" hidden></div>
<input id="file" type="file" accept=".json,application/json" hidden>
<script>
// 醉隱 game engine: pure rules, no DOM. Units are pixels; a room is 32 x 18 tiles of 40 px.
(function (root) {
  'use strict';

  const T = 40, COLS = 32, ROWS = 18, W = COLS * T, H = ROWS * T;
  const BODY_W = 44, BODY_H = 72;

  // px and seconds. Throw speeds start from the BeaverKit skill lab (throwVX 980 shrunk to fit a 32-tile room).
  // Every value here can be changed live in the tuning panel (backquote key).
  const TUNING = {
    run: 370, accelGround: 3200, accelAir: 1900,
    jump: 660, gravity: 2000, apexHang: 0.5, releaseGravity: 2.4, fallGravity: 1.5, maxFall: 950,
    // airDrag: share of accelAir that bleeds speed with no input; overDecel: how fast extra speed (a charge jump-out) fades
    airDrag: 0.35, overDecel: 500,
    coyote: 0.1, jumpBuffer: 0.12,
    cardInterval: 0.32, drink: 0.8,
    // the wrestler's arc is picked by what is held when he lets go: W steep, nothing the regular arc, S low and fast
    liftTime: 0.22, liftRise: 0.12, liftHeight: 84, throwVX: 640, throwVY: 960, recover: 0.1,
    throwUpVX: 240, throwUpVY: 1150, throwLowVX: 900, throwLowVY: 520, throwSteer: 900,
    chargeSpeed: 700, chargeTime: 1.0, chargeTurn: 9, chargeJumpOut: 0.85,
    carryOffset: 80, releaseVY: 260,
    patrolSpeed: 110, belt: 180, crumbleDelay: 0.45, crumbleRespawn: 2.5, fallTrigger: 60, fallWarn: 0.3,
    slowmo: 0.2, airDraws: 1, airCharge: 0.5, hitStop: 0.06, holdTime: 5,
    deathDelay: 0.45, transition: 0.5,
    // 1: each skill has its own key and fires at once; 0: the K card draw
    directMode: 1,
    // drunk mode (a map with "cells"): K farts a small share of a cell, J spends a whole cell on the drunk shadow's move
    fartCost: 1 / 6, fartCooldown: 0.14, fartUp: 300, fartDash: 560, fartDashLift: 60,
    ascendVY: 1200, ascendBreak: 0.45, stageWarn: 0.9,
    // booze comes back by itself (cells per second), after a pause once J has spent it; a chain runs on its own
    regen: 0.4, regenDelay: 0.8, chainAscend: 0.45, chainCharge: 0.7,
  };

  const ABILITIES = {
    wrestler: { name: '摔角手', bottle: 0, tint: '#e0605a', ink: '#b8433c', key: 'J' },
    bodyguard: { name: '保鑣', bottle: 1, tint: '#5aa7d6', ink: '#2f6f9c', key: 'L' },
  };

  // . empty  # ground  ^ shards  = plank  B crate (charge breaks)  C crumbling boxes  < > conveyor
  // R patrol (office chair / night guard)  L falling light (tube / sign)  * bottle cap  P spawn
  const TILE_CHARS = '.#^=BCP<>RL*ON';
  // stage overlays: '.' keeps the tile below, '_' clears it, anything else replaces it
  const STAGE_CHARS = '.#^=BC<>_';
  // the drunk shadow's moves, one per cell: the last cell left is always the throw
  const ZUI = { 1: { name: '丟', tint: '#e0605a' }, 2: { name: '衝', tint: '#5aa7d6' }, 3: { name: '升天', tint: '#b5c25a' } };
  function validateDialogue(d) {
    if (!d || typeof d.name !== 'string' || !d.nodes || Array.isArray(d.nodes) || typeof d.nodes !== 'object' || typeof d.start !== 'string' || !Object.hasOwn(d.nodes, d.start)) throw Error('Dialogue needs name, start and nodes');
    const link = id => id === null || (typeof id === 'string' && Object.hasOwn(d.nodes, id));
    for (const node of Object.values(d.nodes)) {
      if (!node || typeof node.text !== 'string' || node.text.length > 500) throw Error('Dialogue text must be at most 500 characters');
      if (node.next !== undefined && !link(node.next)) throw Error('Unknown dialogue next node');
      if (node.choices !== undefined && (!Array.isArray(node.choices) || !node.choices.length || node.choices.length > 9 || node.choices.some(c => !c || typeof c.text !== 'string' || c.text.length > 100 || !link(c.next)))) throw Error('Dialogue choices need text and next (node id or null), at most 9');
    }
    return d;
  }
  // Death quips by cause; Jim is already dead, so they are complaints rather than screams.
  const DEATH_LINES = {
    glass: ['腳底不痛，因為我已經死了', '這玻璃誰要賠？'],
    pit: ['這坑比我的年終還深', '我只是想回家……'],
    guard: ['我有識別證！', '我就住這附近！'],
    sign: ['招牌也太不牢了', '這是工傷嗎？'],
    other: ['我早就死了啊', '再一杯……', '嗝。', '這不算！'],
  };
  const GUARD_LINES = ['下班了還想去哪？', '這裡不能過。', '你是不是喝酒了？'];
  const SOLID = '#BC<>';
  const SIDES = ['left', 'right', 'top', 'bottom'];
  const THEMES = ['office', 'pantry', 'elevator', 'lobby', 'street'];

  function validateCampaign(data) {
    const errors = [];
    if (!data || data.format !== 'drunken-rooms') errors.push('format 必須是 "drunken-rooms"');
    if (data && data.version !== 2) errors.push('version 必須是 2');
    if (!data || !Array.isArray(data.maps) || !data.maps.length) { errors.push('maps 至少要有一張地圖'); return errors; }
    data.maps.forEach((map, mi) => {
      const at = `maps[${mi}]`;
      if (map.cells !== undefined && ![1, 2, 3].includes(map.cells)) errors.push(`${at}.cells 必須是 1、2 或 3`);
      if (map.cells === undefined && (!Array.isArray(map.abilities) || !map.abilities.length)) errors.push(`${at}.abilities 不可為空`);
      else (map.abilities || []).forEach(a => { if (!ABILITIES[a]) errors.push(`${at} 未知能力 "${a}"`); });
      if (!Array.isArray(map.rooms) || !map.rooms.length) { errors.push(`${at}.rooms 不可為空`); return; }
      const ids = new Set(map.rooms.map(r => r.id));
      if (ids.size !== map.rooms.length) errors.push(`${at} 有重複的房間 id`);
      map.rooms.forEach((room, ri) => {
        const rat = `${at}.rooms[${ri}] (${room.id})`;
        if (!Array.isArray(room.tiles) || room.tiles.length !== ROWS) { errors.push(`${rat} tiles 必須是 ${ROWS} 列`); return; }
        let spawns = 0;
        room.tiles.forEach((row, y) => {
          if (typeof row !== 'string' || row.length !== COLS) errors.push(`${rat} 第 ${y} 列必須是 ${COLS} 字元`);
          else for (const ch of row) { if (!TILE_CHARS.includes(ch)) errors.push(`${rat} 第 ${y} 列有未知格子 "${ch}"`); if (ch === 'P') spawns++; }
        });
        if (spawns !== 1) errors.push(`${rat} 必須剛好有一個出生點 P`);
        if (room.booze !== undefined && !(typeof room.booze === 'number' && room.booze >= 0 && room.booze <= 3)) errors.push(`${rat} booze 必須是 0～3`);
        if (room.stages !== undefined) {
          if (!room.stages || typeof room.stages !== 'object' || Array.isArray(room.stages)) errors.push(`${rat} stages 必須是物件`);
          else for (const [k, rows] of Object.entries(room.stages)) {
            if (!['1', '2', '3'].includes(k)) errors.push(`${rat} stages 只能有 1、2、3`);
            else if (!Array.isArray(rows) || rows.length !== ROWS || rows.some(r => typeof r !== 'string' || r.length !== COLS || [...r].some(ch => !STAGE_CHARS.includes(ch)))) errors.push(`${rat} stages.${k} 必須是 ${ROWS} 列 ${COLS} 字元，只能用 ${STAGE_CHARS}`);
          }
        }
        if (room.theme !== undefined && !THEMES.includes(room.theme)) errors.push(`${rat} 未知場景 "${room.theme}"`);
        const exits = room.exits || {};
        if (room.npcs !== undefined) {
          if (!room.npcs || typeof room.npcs !== 'object' || Array.isArray(room.npcs)) errors.push(`${rat} npcs must be an object`);
          else for (const [key, npc] of Object.entries(room.npcs)) {
            const [x, y] = key.split(',').map(Number);
            if (key !== `${x},${y}` || room.tiles[y]?.[x] !== 'N') errors.push(`${rat} invalid NPC position ${key}`);
            try { validateDialogue(npc); } catch (e) { errors.push(`${rat} NPC ${key}: ${e.message}`); }
          }
        }
        if (room.portalTargets !== undefined) {
          if (!room.portalTargets || typeof room.portalTargets !== 'object' || Array.isArray(room.portalTargets)) errors.push(`${rat} portalTargets 必須是物件`);
          else for (const [key, target] of Object.entries(room.portalTargets)) {
            const [x, y] = key.split(',').map(Number);
            if (!/^\d+,\d+$/.test(key) || key !== `${x},${y}` || room.tiles[y]?.[x] !== 'O') errors.push(`${rat} 傳送門位置 ${key} 無效`);
            if (target !== null && !ids.has(target)) errors.push(`${rat} 傳送門 ${key} 指向不存在的房間 "${target}"`);
          }
        }
        if (room.portalTarget !== undefined && room.portalTarget !== null && !ids.has(room.portalTarget)) errors.push(`${rat} 傳送門指向不存在的房間 "${room.portalTarget}"`);
        const keys = Object.keys(exits);
        if (!keys.length && !room.tiles.join('').includes('O')) errors.push(`${rat} 至少要有一個出口`);
        keys.forEach(side => {
          if (!SIDES.includes(side)) errors.push(`${rat} 出口方向 "${side}" 無效`);
          else if (exits[side] !== null && !ids.has(exits[side])) errors.push(`${rat} 出口指向不存在的房間 "${exits[side]}"`);
        });
      });
    });
    return errors;
  }

  function parseCampaign(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error('不是有效的 JSON'); }
    const errors = validateCampaign(data);
    if (errors.length) throw new Error(errors.join('\n'));
    return data;
  }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  class Game {
    constructor(campaign) {
      this.campaign = campaign;
      this.deaths = 0;
      this.time = 0;
      this.mapTime = 0;
      this.particles = [];
      this.shake = 0;
      this.events = [];
      this.bubbles = [];
      this.capsGot = new Set();
      this.seen = new Set();
      this.startMap(0);
    }

    get map() { return this.campaign.maps[this.mapIndex]; }

    startMap(index) {
      this.mapIndex = index;
      this.mapDeaths = 0;
      this.mapTime = 0;
      this.phase = this.map.intro ? 'intro' : 'play';
      this.timer = 0;
      this.carryBooze = this.map.booze || 0;
      this.enterRoom(this.map.rooms[0].id);
    }

    enterRoom(id) {
      this.room = this.map.rooms.find(r => r.id === id);
      this.dialogue = null;
      this.tiles = this.room.tiles.map(row => row.split(''));
      this.tilesVersion = (this.tilesVersion || 0) + 1;
      this.exits = this.room.exits || {};
      this.entities = [];
      this.crumbles = new Map();
      const street = (this.room.theme || 'street') === 'street';
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const t = this.tiles[y][x];
        if (t === 'P') this.spawn = { x: x * T + T / 2, y: (y + 1) * T };
        if (t === 'R') { this.entities.push({ kind: 'patrol', x: x * T + T / 2, y: (y + 1) * T, dir: -1, alive: true, w: street ? 44 : 40, h: street ? 110 : 34, skin: street ? 'guard' : 'chair', t: 0 }); this.tiles[y][x] = '.'; }
        if (t === 'L') { this.entities.push({ kind: 'faller', x: x * T + T / 2, y: y * T, vy: 0, phase: 'idle', t: 0, w: 72, h: street ? 30 : 14, skin: street ? 'sign' : 'tube' }); this.tiles[y][x] = '.'; }
        if (t === '*') {
          const key = `${this.map.id}:${this.room.id}:${x},${y}`;
          if (!this.capsGot.has(key)) this.entities.push({ kind: 'cap', key, x: x * T + T / 2, y: y * T + T / 2, got: false, t: 0 });
          this.tiles[y][x] = '.';
        }
      }
      this.roomCaps = [];
      this.activeSkill = null;
      this.airDraws = 0;
      this.drinkT = 0;
      this.ready = null;
      this.hitStop = 0;
      this.bubbles = [];
      if (!this.seen.has(this.map.id + ':' + id)) {
        this.seen.add(this.map.id + ':' + id);
        (this.room.lines || []).forEach((text, i) => this.bubbles.push({ who: 'body', text, delay: 0.2 + i * 0.8, t: 2.2 }));
      }
      this.body = { x: this.spawn.x, y: this.spawn.y, vx: 0, vy: 0, face: 1, grounded: true, anim: 'idle', animTime: 0 };
      this.state = 'free';
      this.timer = 0;
      this.coyote = 0;
      this.jumpBuf = 0;
      this.slot = null;
      this.flash = null;
      this.pending = null;
      this.stand = null;
      this.aim = 1;
      this.roomTitle = 2.4;
      // drunk mode: a room starts from its own booze, or what was carried in; a death returns to that amount
      this.cells = this.map.cells || 0;
      this.booze = Math.min(this.cells, this.room.booze ?? this.carryBooze ?? 0);
      this.stage = 0; this.stageWarn = null; this.hallu = new Set();
      this.fartCd = 0; this.ascendT = 0; this.chain = []; this.chainT = 0; this.regenWait = 0;
      if (this.cells) this.applyStage(this.targetStage(), true);
    }

    // ---------- drunk mode ----------
    get drunk() { return !!this.map.cells; }
    targetStage() { return Math.min(this.cells, Math.floor(this.booze + 1e-9)); }
    // The static tile of a cell at a drunk stage: the room, then every overlay up to that stage.
    stageChar(x, y, k) {
      let t = this.room.tiles[y][x];
      if (!STAGE_CHARS.includes(t)) return t;
      for (let s = 1; s <= k; s++) { const o = this.room.stages?.[s]?.[y][x]; if (o && o !== '.') t = o === '_' ? '.' : o; }
      return t;
    }
    stageDiff(from, to) {
      const out = [];
      if (this.room.stages) for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const c = this.stageChar(x, y, to); if (this.stageChar(x, y, from) !== c) out.push([x, y, c]); }
      return out;
    }
    // Swaps in the stage's tiles; refuses (returns false) while a new solid would land on Jim or his shadow.
    applyStage(k, force = false) {
      const diff = this.stageDiff(this.stage, k);
      if (!force) {
        const boxes = [this.box(this.body)].concat(this.stand && !this.stand.leaving ? [this.box(this.stand)] : []);
        if (diff.some(([x, y, c]) => SOLID.includes(c) && boxes.some(bx => overlap(bx, { x: x * T, y: y * T, w: T, h: T })))) return false;
      }
      for (const [x, y, c] of diff) { this.tiles[y][x] = c; this.crumbles.delete(x + ',' + y); }
      if (diff.length) this.tilesVersion++;
      if (!force && k !== this.stage) { this.events.push(k > this.stage ? 'stageUp' : 'stageDown'); this.shake = Math.max(this.shake, 0.25); }
      this.stage = k; this.stageWarn = null;
      this.hallu = new Set();
      if (this.room.stages) for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (this.stageChar(x, y, k) !== this.stageChar(x, y, 0)) this.hallu.add(x + ',' + y);
      return true;
    }
    // The map follows the full cells: a change is announced first (fart it away in time to cancel it) and lands with Jim.
    updateStage(dt) {
      const k = this.targetStage();
      if (k === this.stage) { this.stageWarn = null; return; }
      if (!this.stageWarn || this.stageWarn.to !== k) { this.stageWarn = { to: k, t: TUNING.stageWarn, cells: this.stageDiff(this.stage, k) }; this.events.push('warn'); }
      this.stageWarn.t -= dt;
      const settled = (this.state === 'free' || this.state === 'recover') && this.body.grounded;
      if (this.stageWarn.t <= 0 && settled) this.applyStage(k);
    }

    // K in drunk mode: a short fart. Forward is a burst of speed, nothing or W lifts Jim like a flap.
    fart(input, dir) {
      if (this.fartCd > 0 || !['free', 'thrown', 'recover'].includes(this.state)) return;
      const b = this.body;
      if (this.booze < TUNING.fartCost - 1e-9) {
        this.fartCd = 0.3; this.events.push('deny');
        this.bubbles = this.bubbles.filter(bub => !bub.deny);
        this.bubbles.push({ who: 'body', text: '……擠不出來', delay: 0, t: 0.7, deny: true });
        return;
      }
      this.booze = Math.max(0, this.booze - TUNING.fartCost);
      this.fartCd = TUNING.fartCooldown;
      if (this.state === 'recover') this.state = 'free';
      const dash = dir && !input.jump;
      if (dash) { b.vx = dir * Math.max(dir * b.vx, TUNING.fartDash); b.vy = Math.min(b.vy, -TUNING.fartDashLift); b.face = dir; }
      else b.vy = -TUNING.fartUp;
      b.grounded = false; b.puff = true; this.coyote = 0; this.jumpBuf = 0;
      this.events.push('fart');
      const back = dash ? -dir : 0;
      for (let i = 0; i < 6 && this.particles.length < 300; i++) this.particles.push({ x: b.x + back * 22, y: b.y - 18, vx: back * (120 + Math.random() * 160) + (Math.random() - 0.5) * 90, vy: back ? (Math.random() - 0.5) * 80 : 140 + Math.random() * 160, life: 0.35 + Math.random() * 0.25, max: 0.6, size: 6 + Math.random() * 8, color: i % 2 ? '#b5c25a' : '#8e9a4a' });
    }

    // J in drunk mode: every full cell goes at once and the shadow plays the whole chain by itself:
    // 3 cells 升天 → 衝 → 丟, 2 cells 衝 → 丟, 1 cell 丟. A/D and W/S still steer each part as it starts.
    pressZui() {
      if (this.state === 'dead' || this.chain.length || this.state === 'lift' || this.state === 'charge') return;
      const n = Math.min(this.cells, Math.floor(this.booze + 1e-9));
      if (n < 1) {
        this.bubbles = this.bubbles.filter(bub => !bub.deny);
        this.bubbles.push({ who: 'body', text: '還不夠醉……', delay: 0, t: 0.8, deny: true });
        this.events.push('deny');
        return;
      }
      if (n === 2 && this.hitsSolid(this.box({ x: this.body.x, h: BODY_H + TUNING.carryOffset }, this.body.y))) { this.events.push('deny'); return; }
      this.booze = 0;
      this.regenWait = TUNING.regenDelay;
      this.flash = { color: ZUI[n].tint, t: 0.25 };
      this.events.push('drink');
      if (n === 3) { this.chain = ['charge', 'throw']; this.chainT = TUNING.chainAscend; this.ascend(); }
      else if (n === 2) { this.chain = ['throw']; this.startCharge(); this.timer = TUNING.chainCharge; }
      else this.startLift();
    }

    // The third cell: Jim's own enormous fart. Straight up, high, and through crates overhead.
    ascend() {
      const b = this.body;
      if (this.stand) this.stand.leaving = true;
      this.state = 'free';
      b.vy = -TUNING.ascendVY; b.vx *= 0.4; b.grounded = false; b.puff = true;
      this.ascendT = TUNING.ascendBreak; this.coyote = 0;
      this.hitStop = 0.07; this.shake = 0.4;
      this.events.push('bigfart');
      this.shout('body', ['噗————！！', '對不起大家！', '升天啦——']);
      for (let i = 0; i < 34 && this.particles.length < 300; i++) this.particles.push({ x: b.x + (Math.random() - 0.5) * 50, y: b.y - 6, vx: (Math.random() - 0.5) * 520, vy: 60 + Math.random() * 260, life: 0.5 + Math.random() * 0.4, max: 0.9, size: 8 + Math.random() * 14, color: i % 3 ? '#b5c25a' : '#e8e2a0' });
    }

    tileAt(cx, cy) {
      if (cx < 0) return this.exits.left !== undefined ? '.' : '#';
      if (cx >= COLS) return this.exits.right !== undefined ? '.' : '#';
      if (cy < 0) return this.exits.top !== undefined ? '.' : '#';
      if (cy >= ROWS) return '.';
      return this.tiles[cy][cx];
    }

    solid(cx, cy) { return SOLID.includes(this.tileAt(cx, cy)); }

    box(b, y = b.y) { const h = b.h || BODY_H; return { x: b.x - BODY_W / 2, y: y - h, w: BODY_W, h }; }

    hitsSolid(box) {
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (this.solid(x, y)) return true;
      return false;
    }

    moveX(b, dx) {
      b.x += dx;
      const box = this.box(b);
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        if (!this.solid(x, y)) continue;
        b.x = dx > 0 ? x * T - BODY_W / 2 : (x + 1) * T + BODY_W / 2;
        b.vx = 0;
        return true;
      }
      return false;
    }

    moveY(b, dy) {
      const prevBottom = b.y;
      b.y += dy;
      b.grounded = false;
      const box = this.box(b);
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const t = this.tileAt(x, y);
        const floorOnly = (t === '=' || (t === '^' && b.glassFloor)) && dy > 0 && prevBottom <= y * T + 0.01;
        if (!(SOLID.includes(t) || floorOnly)) continue;
        if (dy > 0) { b.y = y * T; b.grounded = true; } else b.y = (y + 1) * T + (b.h || BODY_H);
        b.vy = 0;
        return true;
      }
      return false;
    }

    physics(dt) {
      const b = this.body;
      b.vy = Math.min(TUNING.maxFall, b.vy + TUNING.gravity * dt);
      this.moveX(b, b.vx * dt);
      this.moveY(b, b.vy * dt);
    }

    emit(x, y, color, count, spread = 220, lift = 180) {
      for (let i = 0; i < count && this.particles.length < 300; i++) {
        this.particles.push({ x, y, vx: (Math.random() - 0.5) * spread, vy: -Math.random() * lift, life: 0.5 + Math.random() * 0.35, max: 0.85, size: 3 + Math.random() * 4, color });
      }
    }

    // K opens the slot. The skill behind the current action is left out of the pool, and once off the
    // ground only TUNING.airDraws draws are allowed until the body touches down again.
    pressK() {
      if (this.state === 'dead' || this.slot || this.drinkT > 0) return;
      // a drunk card is held for TUNING.holdTime seconds; K spends it whenever the moment is right
      if (this.ready) { const id = this.ready.id; this.ready = null; this.fire(id); return; }
      const pool = this.map.abilities.filter(a => a !== this.activeSkill);
      const airborne = !this.body.grounded || ['lift', 'thrown', 'charge'].includes(this.state);
      if (!pool.length || (airborne && this.airDraws >= TUNING.airDraws)) {
        this.bubbles = this.bubbles.filter(bub => !bub.deny);
        this.bubbles.push({ who: 'body', text: '現在抽不了', delay: 0, t: 0.8, deny: true });
        this.events.push('deny');
        return;
      }
      if (airborne) this.airDraws++;
      this.slot = { pool, mode: 'spin', index: 0, t: 0, age: 0, flip: 0, ticks: 0, braked: 0, brakeSteps: 0 };
      this.events.push('slotOpen');
    }

    // Direct mode: the skill's own key fires it at once, under the same day-pool and air rules as the draw.
    pressSkill(id) {
      if (this.drunk) { if (id === 'wrestler') this.pressZui(); return; }
      if (this.state === 'dead') return;
      const airborne = !this.body.grounded || ['lift', 'thrown', 'charge'].includes(this.state);
      const why = !this.map.abilities.includes(id) ? '今天沒有這招'
        : id === this.activeSkill ? '正在用'
        : airborne && this.airDraws >= TUNING.airDraws ? '現在用不了' : null;
      if (why) {
        this.bubbles = this.bubbles.filter(bub => !bub.deny);
        this.bubbles.push({ who: 'body', text: why, delay: 0, t: 0.8, deny: true });
        this.events.push('deny');
        return;
      }
      // a charge spends the air use even from the ground, so chaining off it takes a smash or a knock
      if (airborne || id === 'bodyguard') this.airDraws++;
      this.flash = { color: ABILITIES[id].tint, t: 0.2 };
      this.events.push('drink');
      this.fire(id);
    }

    // A helper's shout rides on the helper itself, so it follows a charge across the room.
    shout(who, lines) { this.bubbles.push({ who, text: lines[Math.floor(Math.random() * lines.length)], delay: 0, t: 0.9 }); }

    // Velocity of the wrestler's throw for the arc chosen while lifted.
    throwVel(kind = this.throwKind) {
      const [vx, vy] = kind === 'up' ? [TUNING.throwUpVX, TUNING.throwUpVY] : kind === 'low' ? [TUNING.throwLowVX, TUNING.throwLowVY] : [TUNING.throwVX, TUNING.throwVY];
      return { vx: this.aim * vx, vy: -vy };
    }

    // A crate smashed or a guard knocked mid-charge earns the air use back, so chains can continue.
    refreshAir() {
      if (this.drunk) return;
      if (this.airDraws || this.activeSkill) { this.events.push('ready'); this.flash = { color: '#f2c24f', t: 0.15 }; if (this.stand) this.shout(this.stand, ['下一位！', '再來！']); }
      this.airDraws = 0; this.activeSkill = null;
    }

    // Pick a Card: the cards cycle in real time while the world crawls at TUNING.slowmo;
    // pressing K again locks the card on show at once, then Jim takes a sip and the skill fires.
    lockSlot() {
      const sl = this.slot;
      sl.mode = 'reveal';
      sl.t = 0;
      sl.chosen = sl.index;
      this.pending = sl.pool[sl.index];
      this.flash = { color: ABILITIES[this.pending].tint, t: 0.45 };
      this.shake = 0.18;
      this.drinkT = TUNING.drink;
      this.events.push('reveal', 'drink');
    }

    updateSlot(dt, kPressed) {
      const sl = this.slot, n = sl.pool.length;
      sl.t += dt; sl.age += dt;
      sl.flip = Math.min(1, sl.flip + dt / 0.09);
      if (sl.mode === 'spin') {
        if (kPressed && sl.age > 0.12) { this.lockSlot(); return; }
        if (sl.t >= TUNING.cardInterval) {
          sl.t = 0; sl.index = (sl.index + 1) % n; sl.flip = 0; sl.ticks++;
          this.events.push('tick');
          if (sl.ticks >= 12) this.lockSlot();
        }
      } else if (sl.t >= 0.35) this.slot = null;
    }

    fire(id) {
      this.pending = null;
      if (id === 'wrestler') this.startLift();
      if (id === 'bodyguard') this.startCharge();
    }

    // Bodyguard: the stand shoulders the body and charges at a constant speed through crates; glass cannot hurt the stand.
    startCharge() {
      const b = this.body;
      const airborne = !b.grounded || this.state !== 'free';
      const s = { x: b.x, y: b.y, vx: 0, vy: 0, h: BODY_H + TUNING.carryOffset, glassFloor: true, face: b.face, ability: 'bodyguard', alpha: 1, leaving: false };
      if (this.hitsSolid(this.box(s))) { this.emit(b.x, b.y - 40, ABILITIES.bodyguard.tint, 10); this.events.push('deny'); return; }
      this.activeSkill = 'bodyguard';
      this.airCharge = airborne ? TUNING.airCharge : 0;
      this.events.push('charge');
      this.state = 'charge';
      this.timer = TUNING.chargeTime;
      this.chargeDir = b.face;
      this.speed = TUNING.chargeSpeed;
      this.turnTime = 0;
      this.stand = s;
      b.vx = b.vy = 0;
      this.carry();
      this.setAnim('fall');
      this.emit(b.x, s.y, ABILITIES.bodyguard.tint, 14);
      this.shout(s, ['讓開讓開！', '老闆借過！', '衝啊——']);
    }

    carry() {
      const s = this.stand, b = this.body;
      b.x = s.x - this.chargeDir * 8;
      b.y = s.y - TUNING.carryOffset;
      b.face = this.chargeDir;
    }

    // Moves the stand horizontally, smashing crates; returns true when a wall stops the charge.
    chargeMove(st, dx) {
      st.x += dx;
      const box = this.box(st);
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      let wall = false;
      const crates = [];
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const t = this.tileAt(x, y);
        if (t === 'B' || t === 'C') crates.push([x, y]); else if (SOLID.includes(t)) wall = true;
      }
      if (crates.length) {
        for (const [x, y] of crates) this.breakFrom(x, y);
        this.shake = 0.35;
        this.hitStop = TUNING.hitStop;
        this.events.push('break');
        this.refreshAir();
      }
      if (!wall) return false;
      const col = dx > 0 ? x1 : x0;
      st.x = dx > 0 ? col * T - BODY_W / 2 : (col + 1) * T + BODY_W / 2;
      return true;
    }

    breakFrom(x, y) {
      const kind = this.tiles[y][x], stack = [[x, y]];
      if (kind !== 'B' && kind !== 'C') return;
      let n = 0;
      while (stack.length) {
        const [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS || this.tiles[cy][cx] !== kind) continue;
        this.tiles[cy][cx] = '.';
        this.crumbles.delete(cx + ',' + cy);
        n++;
        this.emit(cx * T + T / 2, cy * T + T / 2, n % 2 ? '#c98a5a' : '#f0c08a', 3, 380, 260);
        stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
      }
      if (n) this.tilesVersion++;
    }

    // Running out of time tosses Jim forward; slamming into a wall bounces him back with a thud.
    finishCharge(hitWall) {
      const st = this.stand, b = this.body;
      this.state = 'thrown';
      this.events.push(hitWall ? 'knock' : 'throw');
      b.x = st.x;
      b.y = st.y - TUNING.carryOffset;
      if (hitWall) {
        b.vx = -this.chargeDir * 260; b.vy = -420;
        this.shake = 0.35; this.hitStop = 0.08;
        this.shout(st, ['老闆，牆比較硬', '痛痛痛……']);
        this.emit(b.x + this.chargeDir * 30, b.y - 20, '#f2c24f', 14, 420, 300);
      } else {
        b.vx = this.chargeDir * Math.max(360, this.speed * 0.55);
        b.vy = -TUNING.releaseVY;
      }
      st.leaving = true;
      this.setAnim('jump');
    }

    // Jump mid-charge: Jim leaps off the bodyguard's shoulders and keeps most of the speed.
    jumpOut() {
      const b = this.body;
      this.chain = [];
      this.state = 'free';
      this.stand.leaving = true;
      this.shout(this.stand, ['欸！你去哪？', '不用送了？']);
      b.vx = this.chargeDir * TUNING.chargeSpeed * TUNING.chargeJumpOut;
      b.vy = -TUNING.jump;
      b.grounded = false;
      this.jumpBuf = this.coyote = 0;
      this.events.push('jump');
      this.emit(b.x, b.y, ABILITIES.bodyguard.tint, 10, 260, 120);
      this.setAnim('jump');
    }

    startLift() {
      const b = this.body;
      this.activeSkill = 'wrestler';
      this.events.push('lift');
      this.state = 'lift';
      this.timer = TUNING.liftTime;
      this.aim = b.face;
      this.throwKind = 'mid';
      this.stand = { x: b.x, y: b.y, h: 150, face: b.face, ability: 'wrestler', alpha: 1, leaving: false };
      this.shout(this.stand, ['喝！', '飛吧社畜！', '下班囉——']);
      b.vx = b.vy = 0;
      let h = 0;
      while (h < TUNING.liftHeight && !this.hitsSolid(this.box(b, b.y - h - 4))) h += 4;
      this.liftFrom = b.y;
      this.liftTo = b.y - h;
      this.liftT = 0;
      this.setAnim('jump');
      this.emit(b.x, b.y, ABILITIES.wrestler.tint, 14);
    }

    setAnim(name) { if (this.body.anim !== name) { this.body.anim = name; this.body.animTime = 0; } }

    // Conveyor speed under a grounded actor's centre.
    beltUnder(a) {
      if (!a.grounded) return 0;
      const t = this.tileAt(Math.floor(a.x / T), Math.round(a.y / T));
      return t === '>' ? TUNING.belt : t === '<' ? -TUNING.belt : 0;
    }

    // Standing on a box stack starts the whole connected stack shaking.
    touchCrumble(a) {
      if (!a.grounded) return;
      const row = Math.round(a.y / T), box = this.box(a);
      for (let x = Math.floor(box.x / T); x <= Math.floor((box.x + box.w - 1e-6) / T); x++) {
        if (this.tileAt(x, row) !== 'C' || this.crumbles.has(x + ',' + row)) continue;
        const stack = [[x, row]];
        while (stack.length) {
          const [cx, cy] = stack.pop(), key = cx + ',' + cy;
          if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS || this.tiles[cy][cx] !== 'C' || this.crumbles.has(key)) continue;
          this.crumbles.set(key, { x: cx, y: cy, phase: 'shake', t: TUNING.crumbleDelay });
          stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
        }
      }
    }

    updateCrumbles(dt) {
      const body = this.box(this.body);
      for (const [key, c] of this.crumbles) {
        c.t -= dt;
        if (c.phase === 'shake') {
          if (Math.random() < dt * 8) this.emit(c.x * T + Math.random() * T, c.y * T + T, '#d9b98a', 1, 60, 20);
          if (c.t <= 0) { this.events.push('crumble'); this.tiles[c.y][c.x] = '.'; c.phase = 'gone'; c.t = TUNING.crumbleRespawn; this.emit(c.x * T + T / 2, c.y * T + T / 2, '#c89a64', 4, 260, 160); }
        } else if (c.t <= 0 && !overlap(body, { x: c.x * T, y: c.y * T, w: T, h: T })) {
          this.tiles[c.y][c.x] = 'C';
          this.crumbles.delete(key);
        }
      }
    }

    updateEntities(dt) {
      const b = this.body, bb = this.box(b), hurt = { x: bb.x + 6, y: bb.y + 6, w: bb.w - 12, h: bb.h - 6 };
      for (const e of this.entities) {
        e.t += dt;
        if (e.kind === 'patrol') {
          if (!e.alive) { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 2000 * dt; continue; }
          const nx = e.x + e.dir * TUNING.patrolSpeed * dt, front = Math.floor((nx + e.dir * e.w / 2) / T);
          if (this.solid(front, Math.floor((e.y - 10) / T)) || !this.solid(front, Math.floor(e.y / T)) || nx < e.w / 2 || nx > W - e.w / 2) e.dir = -e.dir;
          else e.x = nx;
          const box = { x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h };
          if (this.state === 'charge' && overlap(this.box(this.stand), box)) {
            e.alive = false; e.vx = this.chargeDir * 520; e.vy = -620; this.shake = 0.3;
            this.hitStop = TUNING.hitStop * 1.5; this.events.push('knock');
            this.refreshAir();
            this.shout(e, ['我只是約聘的——', '哇啊——', '我要申訴——']);
            this.emit(e.x, e.y - e.h / 2, '#f3e9d2', 12, 380, 260);
            continue;
          }
          if (this.state !== 'dead' && overlap(hurt, box)) this.die('guard');
          if (e.skin === 'guard' && Math.abs(e.x - b.x) < 320 && (e.said || -9) < e.t - 4) {
            e.said = e.t;
            this.bubbles.push({ who: e, text: GUARD_LINES[Math.floor(Math.random() * GUARD_LINES.length)], delay: 0, t: 1.8 });
          }
        } else if (e.kind === 'cap') {
          if (!e.got && overlap(bb, { x: e.x - 14, y: e.y - 14, w: 28, h: 28 })) {
            e.got = true; this.roomCaps.push(e.key); this.events.push('cap');
            this.emit(e.x, e.y, '#f2c24f', 14, 300, 220);
          }
        } else if (e.kind === 'faller') {
          if (e.phase === 'idle') {
            if (Math.abs(b.x - e.x) < TUNING.fallTrigger && b.y > e.y) { e.phase = 'warn'; e.t = 0; this.events.push('warn'); }
          } else if (e.phase === 'warn') {
            if (e.t >= TUNING.fallWarn) { e.phase = 'fall'; e.vy = 300; }
          } else if (e.phase === 'fall') {
            e.vy += 3000 * dt; e.y += e.vy * dt;
            const box = { x: e.x - e.w / 2, y: e.y, w: e.w, h: e.h };
            if (this.state !== 'dead' && overlap(hurt, box)) this.die('sign');
            const row = Math.floor((e.y + e.h) / T);
            let land = e.y > H;
            for (let c = Math.floor(box.x / T); c <= Math.floor((box.x + box.w - 1e-6) / T); c++) if (this.solid(c, row)) land = true;
            if (land) { e.phase = 'gone'; this.shake = Math.max(this.shake, 0.15); this.events.push('crash'); this.emit(e.x, e.y + e.h, e.skin === 'tube' ? '#e8f3ee' : '#ff8a7a', 16, 420, 220); }
          }
        }
      }
    }

    die(cause) {
      if (this.state === 'dead') return;
      const b = this.body;
      this.state = 'dead';
      this.timer = TUNING.deathDelay;
      this.deaths++;
      this.mapDeaths++;
      this.shake = 0.45;
      this.stand = null;
      this.slot = null;
      this.drinkT = 0;
      this.ready = null;
      this.events.push('die');
      // Jim is already dead, so a death is a punchline: his ghost floats up and complains
      this.ghost = { x: b.x, y: b.y, face: b.face, t: 0 };
      this.shout('body', this.deaths % 5 === 0 ? [`第 ${this.deaths} 次下班`] : DEATH_LINES[cause] || DEATH_LINES.other);
      this.emit(b.x, b.y - BODY_H / 2, '#f3e9d2', 26, 520, 420);
      this.emit(b.x, b.y - BODY_H / 2, '#e0605a', 10, 400, 300);
    }

    leave(side, target = this.exits[side]) {
      this.carryBooze = this.booze;
      for (const k of this.roomCaps) this.capsGot.add(k);
      this.roomCaps = [];
      if (target === null) { this.phase = 'mapEnd'; this.timer = 0; return; }
      this.phase = 'transition';
      this.transT = TUNING.transition;
      this.nextRoom = target;
    }

    // A hard landing near an NPC half-wakes them.
    wakeNpcs() {
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        if (this.tiles[y][x] !== 'N' || Math.hypot(this.body.x - (x + .5) * T, this.body.y - (y + 1) * T) > 200) continue;
        this.shout({ x: (x + .5) * T, y: (y + 1) * T, h: 90 }, ['……誰？……算了，再五分鐘。', '……地震？', '……下班了？']);
      }
    }

    nearbyNpc() {
      let nearest = null, distance = T * 2;
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (this.tiles[y][x] === 'N') {
        const d = Math.hypot(this.body.x - (x + .5) * T, this.body.y - (y + 1) * T);
        if (d < distance) { distance = d; nearest = { x, y, data: this.room.npcs?.[`${x},${y}`] }; }
      }
      return nearest;
    }
    // input also accepts talkPressed and choice (1-9).
    step(dt, input = {}) {
      this.time += dt;
      this.shake = Math.max(0, this.shake - dt * 2.5);
      for (const p of this.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; }
      this.particles = this.particles.filter(p => p.life > 0);
      for (const bub of this.bubbles) { if (bub.delay > 0) bub.delay -= dt; else bub.t -= dt; }
      this.bubbles = this.bubbles.filter(bub => bub.t > 0);

      if (this.phase === 'intro') {
        this.timer += dt;
        if ((this.timer > 0.5 && (input.confirmPressed || input.kPressed || input.jumpPressed)) || this.timer > 4) this.phase = 'play';
        return;
      }

      if (this.phase === 'transition') {
        const before = this.transT;

  // ---------- sprites ----------
  const tint = document.createElement('canvas'); tint.width = tint.height = 512; const tctx = tint.getContext('2d');
  function frameOf(anim, t) {
    if (anim === 'idle') return Math.floor(t / 0.14) % 3;
    if (anim === 'drink') return Math.min(6, Math.floor(t / 0.11));
    if (anim === 'run') return Math.floor(t / 0.067) % 8;
    return Math.min(7, Math.floor(t / 0.055));

  function sprite(anim, f) {
    if (anim === 'idle') return [img['idle' + f], 0];
    if (anim === 'drink') return [img['drink' + f], 0];

  function drawActor(anim, t, x, y, face, size, color, alpha) { drawFrame(anim, frameOf(anim, t), x, y, face, size, color, alpha); }

  // Jim's pose from what he is doing right now. The jump strip is a whole hop (crouch, rise, apex, land) and the
  // fall strip is trip-and-pass-out, so frames are chosen by state and velocity rather than played by time.
  function bodyPose(g) {
    const b = g.body;
    if (g.drinkT > 0) return ['drink', Math.min(6, Math.floor((TUNING.drink - g.drinkT) / 0.11))];
    if (g.state === 'lift') return ['fall', 3];
    if (g.state === 'charge') return ['fall', 4];
    if (g.state === 'thrown') return ['fall', 0];
    if (g.state === 'recover' || (b.grounded && b.landT > 0)) return ['jump', 7];
    if (!b.grounded) return ['jump', b.vy < -260 ? 1 + (Math.floor(b.animTime / 0.09) % 2) : b.vy < 220 ? 3 : 5];
    if (Math.abs(b.vx) > 25) return ['run', Math.floor(b.animTime / 0.067) % 8];
    return ['idle', Math.floor(b.animTime / 0.14) % 3];
  }

  // The slot card rides above Jim's head, like Twisted Fate's Pick a Card; a light vignette marks the slow motion.
  function drawSlot() {
    const g = game, sl = g.slot;
    if (!sl) return;
    const id = sl.pool[sl.index], ab = ABILITIES[id], b = g.body;
    const v = ctx.createRadialGradient(W / 2, H / 2, 240, W / 2, H / 2, 760);
    v.addColorStop(0, 'rgba(14,11,28,0)'); v.addColorStop(1, 'rgba(8,6,18,.45)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

  function drawDynamicTiles() {
    const g = game;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const t = g.tiles[y][x], tx = x * T, ty = y * T;
      if (t === 'N') {
        drawActor('idle', g.time, tx + T / 2, ty + T, 1, 100, '#e0a87a', 1);
        text(g.room.npcs?.[`${x},${y}`]?.name || 'NPC', tx + T / 2, ty - T, 16, 'center');
      } else if (t === 'O') {

        const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, T * .95);
        halo.addColorStop(0, 'rgba(143,255,226,.45)');
        halo.addColorStop(.45, `rgba(143,255,226,${.12 + pulse * .12})`);

        ctx.fillStyle = '#e5fff7';

          const sy = ty + T - phase * T * 1.4;
          ctx.globalAlpha = Math.sin(phase * Math.PI);
          ctx.beginPath(); ctx.arc(sx, sy, 1.5 + pulse, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
      } else if (t === 'C') {
        const c = g.crumbles.get(x + ',' + y), jx = c ? (Math.random() - 0.5) * 4 : 0, jy = c ? (Math.random() - 0.5) * 2 : 0;
        ctx.save(); ctx.translate(tx + jx, ty + jy);
        ctx.fillStyle = (x + y) % 2 ? '#c89a64' : '#bd8f5a'; ctx.fillRect(1, 1, T - 2, T - 2);
        ctx.fillStyle = '#e8d6a8'; ctx.fillRect(T / 2 - 4, 1, 8, T - 2);
        ctx.strokeStyle = '#3a2618'; ctx.lineWidth = 2.5; ctx.strokeRect(1, 1, T - 2, T - 2);
        ctx.strokeStyle = 'rgba(58,38,24,.5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(4, T - 9); ctx.lineTo(14, T - 9); ctx.stroke();
        ctx.restore();
      } else if (t === '<' || t === '>') {
        const d = t === '>' ? 1 : -1, off = ((g.time * TUNING.belt * d) % 20 + 20) % 20;
        ctx.fillStyle = '#2a2d3d'; ctx.fillRect(tx, ty, T, T);
        ctx.fillStyle = '#3c4157'; ctx.fillRect(tx, ty, T, 10);
        ctx.save(); ctx.beginPath(); ctx.rect(tx, ty, T, 10); ctx.clip();
        ctx.strokeStyle = '#ffd38a'; ctx.lineWidth = 2.5;
        for (let k = -20; k < T + 20; k += 20) { const cx = tx + k + off; ctx.beginPath(); ctx.moveTo(cx - 4 * d, ty + 1); ctx.lineTo(cx + 3 * d, ty + 5); ctx.lineTo(cx - 4 * d, ty + 9); ctx.stroke(); }
        ctx.restore();
        ctx.strokeStyle = '#120c1c'; ctx.lineWidth = 2.5; ctx.strokeRect(tx, ty, T, T);
      }
    }
  }

  function drawEntities() {
    const g = game;
    for (const e of g.entities) {
      if (e.kind === 'patrol') {
        ctx.save(); ctx.translate(e.x, e.y);
        if (!e.alive) ctx.rotate(e.t * 9 * Math.sign(e.vx || 1));
        if (e.skin === 'chair') {
          ctx.strokeStyle = '#120c1c'; ctx.lineWidth = 2.5; ctx.fillStyle = '#2d2a3d';
          for (const wx of [-15, 0, 15]) { ctx.beginPath(); ctx.arc(wx + Math.sin(e.t * 12 + wx) * 1.5, -4, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
          ctx.fillRect(-2, -22, 4, 16);
          ctx.fillStyle = '#c0504d'; ctx.beginPath(); ctx.rect(-20, -28, 40, 8); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.rect(-e.dir * 20 - (e.dir > 0 ? 0 : 0) - 4, -50, 8, 26); ctx.fill(); ctx.stroke();
        } else {
          const lit = ctx.createLinearGradient(0, 0, e.dir * 200, 0);
          lit.addColorStop(0, 'rgba(255,240,180,.35)'); lit.addColorStop(1, 'rgba(255,240,180,0)');
          if (e.alive) { ctx.fillStyle = lit; ctx.beginPath(); ctx.moveTo(e.dir * 16, -62); ctx.lineTo(e.dir * 200, -110); ctx.lineTo(e.dir * 200, -10); ctx.closePath(); ctx.fill(); }
          ctx.restore();
          drawActor(e.alive ? 'run' : 'fall', e.t, e.x, e.y, e.dir, 150, '#232a4a', 0.95);
          ctx.save(); ctx.translate(e.x, e.y);
          ctx.fillStyle = '#232a4a'; ctx.strokeStyle = '#0e1024'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.ellipse(e.dir * 4, -122, 24, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
      } else if (e.kind === 'cap' && !e.got) {
        drawCap(e, g.time);
      } else if (e.kind === 'faller' && e.phase !== 'gone') {
        const wob = e.phase === 'warn' ? Math.sin(e.t * 60) * 0.12 : 0;
        if (e.phase !== 'fall') { ctx.strokeStyle = '#120c1c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(e.x - 26, 0); ctx.lineTo(e.x - 26, e.y); ctx.moveTo(e.x + 26, 0); ctx.lineTo(e.x + 26, e.y); ctx.stroke(); }
        ctx.save(); ctx.translate(e.x, e.y + e.h / 2); ctx.rotate(wob);
        if (e.skin === 'tube') {
          const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, 90); gl.addColorStop(0, 'rgba(200,250,230,.25)'); gl.addColorStop(1, 'rgba(200,250,230,0)');
          ctx.fillStyle = gl; ctx.fillRect(-90, -20, 180, 110);
          ctx.fillStyle = '#d9f3e6'; ctx.strokeStyle = '#122326'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.rect(-36, -7, 72, 14); ctx.fill(); ctx.stroke();
        } else {
          ctx.fillStyle = '#d8343f'; ctx.strokeStyle = '#1a0b10'; ctx.lineWidth = 3; ctx.beginPath(); ctx.rect(-36, -15, 72, 30); ctx.fill(); ctx.stroke();
          ctx.font = `24px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff1c8'; ctx.fillText('酒', 0, 9);
        }
        ctx.restore();
      }
    }
  }

  function drawBubbles() {
    const g = game;
    const placed = [];
    for (const bub of g.bubbles) {
      if (bub.delay > 0) continue;
      const tx = bub.who === 'body' ? g.body.x : bub.who.x;
      let ty = bub.who === 'body' ? g.body.y - 128 : bub.who.y - bub.who.h - 34;
      ctx.save();
      ctx.globalAlpha = Math.min(1, bub.t / 0.25);
      ctx.font = `20px ${FONT}`;
      const w = ctx.measureText(bub.text).width + 28, x = Math.max(8, Math.min(W - w - 8, tx - w / 2));
      // bubbles from different speakers stack upward instead of covering each other
      const base = ty;
      while (placed.some(p => x < p.x + p.w && x + w > p.x && Math.abs(ty - p.ty) < 46)) ty -= 46;
      if (ty !== base && ty - 44 < 8) continue;   // a stacked bubble with no room above is dropped rather than piled at the top edge
      placed.push({ x, w, ty });
      const y = Math.max(8, ty - 44);
      ctx.fillStyle = '#f6efdd'; ctx.strokeStyle = '#1c1636'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x + 3, y); ctx.lineTo(x + w, y + 2); ctx.lineTo(x + w - 2, y + 38); ctx.lineTo(tx + 8, y + 37); ctx.lineTo(tx - 2, y + 50); ctx.lineTo(tx - 6, y + 38); ctx.lineTo(x, y + 37); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2a2244'; ctx.textAlign = 'left'; ctx.fillText(bub.text, x + 14, y + 26);
      ctx.restore();
    }
  }

  // Hallucinated tiles glow; tiles about to change blink before the stage swaps.
  function drawHallucination() {
    const g = game;
    if (!g.drunk) return;
    const pulse = 0.5 + 0.5 * Math.sin(g.time * 5);
    ctx.save();
    for (const key of g.hallu) {
      const [x, y] = key.split(',').map(Number), t = g.tiles[y][x], tx = x * T, ty = y * T;
      if (t === '.') { ctx.setLineDash([5, 6]); ctx.strokeStyle = 'rgba(190,150,255,.28)'; ctx.lineWidth = 2; ctx.strokeRect(tx + 3, ty + 3, T - 6, T - 6); ctx.setLineDash([]); continue; }
      ctx.fillStyle = `rgba(170,120,255,${0.16 + pulse * 0.1})`; ctx.fillRect(tx, ty, T, T);
      ctx.strokeStyle = `rgba(220,190,255,${0.5 + pulse * 0.3})`; ctx.lineWidth = 2; ctx.strokeRect(tx + 1, ty + 1, T - 2, T - 2);
    }
    if (g.stageWarn) {
      const on = Math.sin(g.time * 22) > 0;
      for (const [x, y, c] of g.stageWarn.cells) {
        const tx = x * T, ty = y * T;
        if (c === '.') { if (on) { ctx.fillStyle = 'rgba(20,10,40,.55)'; ctx.fillRect(tx, ty, T, T); } }
        else { ctx.setLineDash([6, 5]); ctx.strokeStyle = on ? 'rgba(255,220,120,.95)' : 'rgba(190,150,255,.7)'; ctx.lineWidth = 3; ctx.strokeRect(tx + 2, ty + 2, T - 4, T - 4); ctx.setLineDash([]);
          if (c === '^') { ctx.fillStyle = 'rgba(255,110,110,.35)'; ctx.fillRect(tx + 4, ty + 20, T - 8, T - 22); } }
      }
    }
    ctx.restore();
  }

  // Drunk stage tint: the more cells full, the more the world swims.
  function drawDrunkGrade() {
    const g = game;
    if (!g.drunk || (!g.stage && !g.stageWarn)) return;
    const s = g.stage, warn = g.stageWarn ? 0.5 + 0.5 * Math.sin(g.time * 14) : 0;
    const v = ctx.createRadialGradient(W / 2, H / 2, 260 - s * 40, W / 2, H / 2, 780);
    v.addColorStop(0, 'rgba(120,60,200,0)'); v.addColorStop(1, `rgba(120,60,200,${0.12 * s + 0.18 * warn})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    if (s >= 2) { ctx.fillStyle = `rgba(255,120,200,${0.03 * (s - 1) * (0.5 + 0.5 * Math.sin(g.time * 2))})`; ctx.fillRect(0, 0, W, H); }
  }

  // The booze gauge: one cell per move, drained from the right. The cell J will spend is ringed.
  function drawGauge() {
    const g = game, cw = 78, ch = 20, x0 = 22, y0 = H - 66, n = Math.floor(g.booze + 1e-9);
    for (let i = 0; i < 3; i++) {
      const x = x0 + i * (cw + 10), fill = Math.max(0, Math.min(1, g.booze - i)), z = ZUI[i + 1];
      ctx.save();
      if (i >= g.cells) {
        ctx.globalAlpha = 0.35; ctx.fillStyle = '#1a1430'; ctx.fillRect(x, y0, cw, ch);
        ctx.strokeStyle = '#5a5070'; ctx.lineWidth = 2; ctx.strokeRect(x, y0, cw, ch);
        ctx.restore(); text('？', x + cw / 2, y0 + ch + 22, 16, 'center', 0.3); continue;
      }
      ctx.fillStyle = 'rgba(16,12,36,.7)'; ctx.fillRect(x, y0, cw, ch);
      ctx.fillStyle = fill >= 1 ? z.tint : 'rgba(181,194,90,.55)'; ctx.fillRect(x, y0, cw * fill, ch);
      const next = i < n;
      ctx.strokeStyle = next ? '#f2c24f' : '#f3e9d2'; ctx.lineWidth = next ? 3 : 1.5; ctx.strokeRect(x, y0, cw, ch);
      if (g.stageWarn && i === Math.max(g.stageWarn.to, g.stage) - 1 && Math.sin(g.time * 22) > 0) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, y0, cw, ch); }
      ctx.restore();
      text(z.name, x + cw / 2, y0 + ch + 22, 17, 'center', fill >= 1 ? 0.95 : 0.4, next ? '#f2c24f' : '#f3e9d2');
    }
    if (n) text('J ' + Array.from({ length: n }, (_, i) => ZUI[n - i].name).join('→'), x0, y0 - 36, 17, 'left', 0.95, '#f2c24f');
    text('K 放屁', x0 + 3 * (cw + 10) + 6, y0 + 16, 17, 'left', g.booze >= TUNING.fartCost - 1e-9 ? 0.8 : 0.3, '#b5c25a');
    text(['清醒', '微醺', '大醉', '爛醉'][g.stage] + (g.stageWarn ? (g.stageWarn.to > g.stage ? '　醉意上湧…' : '　酒醒中…') : ''), x0, y0 - 12, 17, 'left', 0.85, g.stageWarn ? '#f2c24f' : '#cdb8ff');
  }

  function drawCap(e, t) {
    const y = e.y + Math.sin(t * 3 + e.x) * 3;
    ctx.save(); ctx.translate(e.x, y); ctx.rotate(Math.sin(t * 2) * 0.2);
    const gl = ctx.createRadialGradient(0, 0, 2, 0, 0, 34); gl.addColorStop(0, 'rgba(255,214,110,.45)'); gl.addColorStop(1, 'rgba(255,214,110,0)');
    ctx.fillStyle = gl; ctx.fillRect(-34, -34, 68, 68);
    ctx.beginPath();
    for (let i = 0; i < 21; i++) { const a = i / 21 * Math.PI * 2, r = i % 2 ? 11 : 14; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fillStyle = '#e8b84a'; ctx.fill(); ctx.strokeStyle = '#3a2618'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fillStyle = '#c9411f'; ctx.fill();
    ctx.restore();
  }

  function drawAim() {
    const g = game, b = g.body;
    let x = b.x, y = b.y, { vx, vy } = g.throwVel();
    ctx.fillStyle = '#f3e9d2';
    for (let i = 0; i < 26; i++) {
      for (let k = 0; k < 4; k++) { vy += TUNING.gravity / 120; x += vx / 120; y += vy / 120; }
      if (y > H || g.hitsSolid(g.box({ x }, y))) break;
      ctx.globalAlpha = 0.75 * (1 - i / 26);
      ctx.beginPath(); ctx.arc(x, y - 36, 3.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function text(str, x, y, size, align = 'left', alpha = 1, color = '#f3e9d2') {
    ctx.save(); ctx.globalAlpha = alpha; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
    ctx.fillStyle = 'rgba(16,12,36,.55)'; ctx.fillText(str, x + 2, y + 2);
    ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
  }

  function draw() {
    const g = game, b = g.body;
    const key = g.room.id + ':' + g.tilesVersion + ':' + g.mapIndex;
    if (key !== roomKey) { roomKey = key; buildLayer(); }
    ctx.save();
    if (g.shake) ctx.translate((Math.random() - 0.5) * g.shake * 18, (Math.random() - 0.5) * g.shake * 18);
    const theme = g.room.theme || 'street';
    if (theme !== 'street') ctx.drawImage(backdrop(theme), -8, -8, W + 16, H + 16);
    else if (ok(img.background)) ctx.drawImage(img.background, -8, -8, W + 16, H + 16); else { ctx.fillStyle = '#2b2860'; ctx.fillRect(-8, -8, W + 16, H + 16); }
    if (theme === 'street') { drawStreetGrade(); ctx.fillStyle = 'rgba(22,12,40,.28)'; ctx.fillRect(-8, -8, W + 16, H + 16); }
    else { ctx.fillStyle = 'rgba(18,14,44,.08)'; ctx.fillRect(-8, -8, W + 16, H + 16); }
    const pit = ctx.createLinearGradient(0, 560, 0, H); pit.addColorStop(0, 'rgba(6,4,14,0)'); pit.addColorStop(1, 'rgba(6,4,14,.7)');
    ctx.fillStyle = pit; ctx.fillRect(-8, 560, W + 16, H - 552);
    ctx.drawImage(layer, 0, 0);
    drawDynamicTiles();
    drawHallucination();
    drawEntities();
    if (g.stand) {
      const st = g.stand, charging = g.state === 'charge';
      if (charging) {
        ctx.strokeStyle = 'rgba(243,233,210,.55)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        for (let i = 0; i < 4; i++) {
          const yy = st.y - 30 - i * 34 + Math.sin(g.time * 30 + i) * 4, len = 40 + i * 8;
          ctx.beginPath(); ctx.moveTo(st.x - g.chargeDir * (40 + i * 6), yy); ctx.lineTo(st.x - g.chargeDir * (40 + i * 6 + len), yy); ctx.stroke();
        }
      }
      drawActor(charging ? 'run' : 'idle', g.time, st.x, st.y, st.face, st.ability === 'wrestler' ? 170 : 152, g.drunk ? '#9b7be0' : ABILITIES[st.ability].tint, (g.drunk ? 0.75 : 0.85) * st.alpha);
    }
    if (g.state === 'lift') drawAim();
    if (g.state !== 'dead') {
      const [anim, f] = bodyPose(g);
      const squash = b.landT > 0 ? 0.85 : b.grounded ? 1 : 1 + Math.max(-0.2, Math.min(0.25, -b.vy / 3000));
      drawFrame(anim, f, b.x, b.y, b.face, 118, null, 1, squash);
    } else if (g.ghost) {
      const gh = g.ghost;
      drawFrame('fall', 0, gh.x + Math.sin(gh.t * 9) * 6, gh.y - gh.t * 120, gh.face, 118, '#cfe6f2', 0.5);
    }
    drawBubbles();
    for (const p of g.particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (g.drinkT > 0 && !g.slot) {
      const v = ctx.createRadialGradient(W / 2, H / 2, 240, W / 2, H / 2, 760);
      v.addColorStop(0, 'rgba(14,11,28,0)'); v.addColorStop(1, 'rgba(14,11,28,.45)');
      ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    }
    drawDrunkGrade();
    drawSlot();
    drawReady();
    if (g.flash) { ctx.globalAlpha = (g.flash.t / 0.45) * 0.4; ctx.fillStyle = g.flash.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    text(`${g.map.name}　${g.room.id}`, 22, 36, 20, 'left', 0.7);
    if (g.drunk) {
      drawGauge();
      const hint = (g.room.lines || []).filter(l => /[A-Z]/.test(l)).at(-1);
      if (hint) text(hint, W / 2, H - 22, 18, 'center', 0.55);
      const n = Math.floor(g.booze + 1e-9);
      if (g.state === 'lift') text('W 高拋　S 低飛', W / 2, H - 52, 20, 'center', 0.95, '#f2c24f');
      if (g.state === 'charge' && g.stand && g.stand.grounded) text('W 跳離', W / 2, H - 52, 20, 'center', 0.95, '#f2c24f');
      if (g.autoplay) text('自動通關中　P 取消', W / 2, H - 82, 20, 'center', 0.95, '#f2c24f');
    } else if (TUNING.directMode) {
      const air = !b.grounded || ['lift', 'thrown', 'charge'].includes(g.state);
      g.map.abilities.forEach((id, i) => {
        const usable = id !== g.activeSkill && !(air && g.airDraws >= TUNING.airDraws);
        text(`${ABILITIES[id].key} ${ABILITIES[id].name}`, 22 + i * 130, H - 22, 18, 'left', usable ? 0.9 : 0.25, usable ? ABILITIES[id].tint : '#f3e9d2');
      });
      // 2: room lines that name a key stay on screen as the room's hint
      const hint = (g.room.lines || []).filter(l => /[A-Z]/.test(l)).at(-1);
      if (hint) text(hint, W / 2, H - 22, 18, 'center', 0.55);
      // 3/4: the moves that only exist mid-action are named while they are possible
      if (g.state === 'lift') text('W 高拋　S 低飛', W / 2, H - 52, 20, 'center', 0.95, '#f2c24f');
      if (g.state === 'charge' && g.stand && g.stand.grounded) text('W 跳離', W / 2, H - 52, 20, 'center', 0.95, '#f2c24f');
      if (g.autoplay) text('自動通關中　P 取消', W / 2, H - 82, 20, 'center', 0.95, '#f2c24f');
    }
    if (g.roomTitle > 0) {
      const a = Math.min(1, g.roomTitle / 0.6);
      if (g.room === g.map.rooms[0]) text(g.map.name, W / 2, 52, 24, 'center', a * 0.8);
      text(g.room.name, W / 2, 96, 40, 'center', a);
    }
    if (g.phase === 'transition') {
      const half = TUNING.transition / 2;
      ctx.fillStyle = `rgba(14,11,28,${1 - Math.abs(g.transT - half) / half})`; ctx.fillRect(0, 0, W, H);
    }
    if (g.phase === 'mapEnd') {
      ctx.fillStyle = `rgba(14,11,28,${Math.min(0.75, g.timer * 1.5)})`; ctx.fillRect(0, 0, W, H);
      const a = Math.min(1, g.timer * 1.5);
      const total = g.map.rooms.reduce((n, r) => n + r.tiles.join('').split('*').length - 1, 0);
      const got = [...g.capsGot].filter(k => k.startsWith(g.map.id + ':')).length;
      text(`${g.map.name}　完`, W / 2, H / 2 - 60, 64, 'center', a);
      if (g.map.outro) text(g.map.outro, W / 2, H / 2 - 4, 24, 'center', a * 0.85);
      text(`倒下 ${g.mapDeaths} 次（無加班費）　·　${fmt(g.mapTime)}${total ? `　·　瓶蓋 ${got} / ${total}（可兌換：無）` : ''}`, W / 2, H / 2 + 40, 20, 'center', a * 0.7);
      const more = g.mapIndex + 1 < g.campaign.maps.length;
      if (g.timer > 0.6) text(more ? 'Enter 繼續' : 'Enter 再走一次', W / 2, H / 2 + 92, 20, 'center', 0.6 + 0.3 * Math.sin(g.time * 3));
    }
    if (g.phase === 'intro') {
      ctx.fillStyle = '#0e0b1c'; ctx.fillRect(0, 0, W, H);
      const a = Math.min(1, g.timer * 2);
      text(g.map.name, W / 2, H / 2 - 30, 60, 'center', a);
      text(g.map.intro, W / 2, H / 2 + 30, 24, 'center', Math.min(1, Math.max(0, g.timer * 2 - 0.6)) * 0.85);
      if (g.timer > 0.5) text('K 繼續', W / 2, H - 60, 18, 'center', 0.45 + 0.25 * Math.sin(g.time * 3));
    }
    if (loaded < Object.keys(SRC).length) text('…', W - 40, 36, 24, 'right', 0.6);
    if (!document.hasFocus()) text('點一下畫面就能玩', W / 2, H / 2, 26, 'center', 0.9);
  }

  // ---------- sound (WebAudio synth, nothing to download) ----------
  const Sfx = (() => {
    let ac = null, out = null, muted = false;
    function ensure() {
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); out = ac.createGain(); out.gain.value = 0.5; out.connect(ac.destination); } catch (e) { ac = null; } }
      if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
    }
    function tone(freq, dur, type = 'sine', vol = 0.2, to = null, delay = 0) {
      const t0 = ac.currentTime + delay, o = ac.createOscillator(), gn = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(gn); gn.connect(out); o.start(t0); o.stop(t0 + dur + 0.02);
    }
    function noise(dur, vol, freq, kind = 'lowpass') {
      const t0 = ac.currentTime, len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
      src.buffer = buf; f.type = kind; f.frequency.value = freq; gn.gain.value = vol;
      src.connect(f); f.connect(gn); gn.connect(out); src.start(t0);
    }
    const bank = {
      jump: () => tone(380, 0.1, 'square', 0.06, 640),
      land: () => noise(0.06, 0.22, 500),
      slotOpen: () => tone(300, 0.16, 'triangle', 0.12, 620),
      tick: () => tone(1250, 0.025, 'square', 0.05),
      stop: () => tone(620, 0.07, 'triangle', 0.14),
      reveal: () => { tone(523, 0.3, 'triangle', 0.14); tone(659, 0.3, 'triangle', 0.11, null, 0.05); tone(784, 0.4, 'triangle', 0.1, null, 0.1); },
      drink: () => { tone(200, 0.12, 'sine', 0.22, 120); tone(180, 0.12, 'sine', 0.18, 110, 0.16); tone(170, 0.14, 'sine', 0.16, 100, 0.34); },
      lift: () => tone(180, 0.3, 'sawtooth', 0.05, 420),
      throw: () => noise(0.28, 0.3, 1600, 'bandpass'),
      charge: () => { noise(0.4, 0.25, 280); tone(80, 0.4, 'sawtooth', 0.08, 150); },
      break: () => { noise(0.2, 0.5, 900); tone(110, 0.14, 'square', 0.12, 55); },
      knock: () => { tone(320, 0.09, 'square', 0.16, 120); noise(0.12, 0.3, 1400); },
      die: () => { tone(440, 0.45, 'triangle', 0.16, 90); noise(0.15, 0.2, 2200, 'highpass'); },
      cap: () => { tone(880, 0.08, 'square', 0.08); tone(1320, 0.14, 'square', 0.08, null, 0.07); },
      crumble: () => noise(0.32, 0.18, 450),
      warn: () => tone(1500, 0.05, 'square', 0.04),
      crash: () => noise(0.4, 0.38, 3200, 'highpass'),
      deny: () => tone(150, 0.14, 'square', 0.08),
      ready: () => tone(988, 0.12, 'triangle', 0.1),
      fart: () => { noise(0.13, 0.32, 260); tone(95 + Math.random() * 30, 0.12, 'sawtooth', 0.07, 55); },
      bigfart: () => { noise(0.7, 0.55, 220); tone(70, 0.7, 'sawtooth', 0.12, 38); tone(140, 0.35, 'square', 0.05, 60, 0.05); },
      gulp: () => { tone(260, 0.08, 'sine', 0.2, 160); tone(240, 0.08, 'sine', 0.18, 150, 0.1); tone(300, 0.14, 'triangle', 0.08, 500, 0.22); },
      stageUp: () => { tone(330, 0.5, 'triangle', 0.1, 520); tone(415, 0.5, 'triangle', 0.08, 660, 0.06); noise(0.3, 0.1, 800, 'bandpass'); },
      stageDown: () => { tone(520, 0.45, 'triangle', 0.1, 300); },
    };
    return {
      ensure,
      play(name) { if (!muted && ac && bank[name]) try { bank[name](); } catch (e) { /* ignore */ } },
      toggle() { muted = !muted; return muted; },
    };
  })();

  // ---------- input & loop ----------
  const held = { left: false, right: false, jump: false, down: false };
  let pressed = {};
  const bind = { KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', KeyW: 'jump', ArrowUp: 'jump', KeyS: 'down', ArrowDown: 'down', Space: 'jump', KeyK: 'k', KeyR: 'r', KeyP: 'auto', Enter: 'confirm', Escape: 'esc' };
  const skillKeys = Object.fromEntries(Object.entries(ABILITIES).map(([id, ab]) => ['Key' + ab.key, id]));
  addEventListener('keydown', e => {
    Sfx.ensure();
    if (e.code === 'KeyM' && !e.repeat) { Sfx.toggle(); return; }
    if (menu.hidden && /^Digit[1-9]$/.test(e.code) && game.dialogue) { e.preventDefault(); if (!e.repeat) pressed.choice = Number(e.code.slice(5)); return; }
    if (menu.hidden && skillKeys[e.code]) { e.preventDefault(); if (!e.repeat) pressed.skill = skillKeys[e.code]; return; }
    const a = e.code === 'KeyE' ? 'talk' : bind[e.code]; if (!a) return;
    e.preventDefault();
    if (a === 'esc') { if (!e.repeat) toggleMenu(); return; }
    if (!menu.hidden) return;
    if (a in held) held[a] = true;
    if (!e.repeat) pressed[a] = true;
  });
  addEventListener('keyup', e => { const a = bind[e.code]; if (a in held) held[a] = false; });
  addEventListener('blur', () => { held.left = held.right = held.jump = held.down = false; });
  canvas.addEventListener('pointerdown', () => window.focus());

  // P: replay the shipped route for this room from the spawn (it takes the cap too); P again or R hands control back.
  let auto = null;
  function toggleAuto() {
    if (auto) { auto = null; game.autoplay = false; return; }
    if (game.phase !== 'play' || game.dialogue) return;
    const steps = AUTO.route(game);
    if (!steps) { game.shout('body', ['這間我也不知道怎麼過。']); return; }
    game.enterRoom(game.room.id);
    auto = { steps, frame: 0, acc: 0, room: game.room };
    game.autoplay = true;
  }
  // Fixed 240 Hz steps, so the replay matches the run the route was verified with.
  function runAuto(frame) {
    auto.acc += frame;
    while (auto && auto.acc >= AUTO.STEP_DT) {
      auto.acc -= AUTO.STEP_DT;
      game.step(AUTO.STEP_DT, AUTO.input(auto.steps, auto.frame++));
      if (game.phase !== 'play' || game.room !== auto.room || game.state === 'dead') { auto = null; game.autoplay = false; }
    }
  }

  // Simulate exactly the elapsed frame time, split into small sub-steps, so motion matches the display refresh.
  let last = performance.now();
  function loop(now) {
    const frame = Math.min((now - last) / 1000, 1 / 20); last = now;
    if (menu.hidden && frame > 0 && pressed.auto) toggleAuto();
    if (menu.hidden && frame > 0 && auto && pressed.r) { auto = null; game.autoplay = false; }
    if (menu.hidden && frame > 0 && auto) { pressed = {}; runAuto(frame); }
    else if (menu.hidden && frame > 0) {
      const n = Math.ceil(frame / (1 / 240)), dt = frame / n;
      if (pressed.r && game.phase === 'play') game.die();
      for (let i = 0; i < n; i++) {
        game.step(dt, { ...held, jumpPressed: pressed.jump, kPressed: pressed.k, skill: pressed.skill, confirmPressed: pressed.confirm, talkPressed: pressed.talk, choice: pressed.choice });
        pressed = {};
      }
    }
    for (const ev of new Set(game.events)) Sfx.play(ev);
    game.events.length = 0;
    draw();
    const talk = document.getElementById('talk'), conversation = game.dialogue;
    const nearby = game.phase === 'play' && game.nearbyNpc();
    talk.hidden = !menu.hidden || (!conversation && !nearby?.data);
    if (conversation) {
      const node = conversation.data.nodes[conversation.node];
      talk.textContent = `${conversation.data.name}\n${node.text}\n\n` + (node.choices?.length ? node.choices.map((c, i) => `${i + 1}. ${c.text}`).join('\n') : 'E / Enter：繼續');
    } else talk.textContent = nearby?.data ? `E：與 ${nearby.data.name} 交談` : '';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.drunkDebug = { get game() { return game; }, draw };

  // ---------- tuning panel (backquote key) ----------
  const tune = document.getElementById('tune');
  const KNOBS = [
    ['run', '跑速', 150, 600, 5], ['jump', '跳躍力', 400, 1000, 5], ['gravity', '重力', 1000, 3500, 50],
    ['apexHang', '頂點滯空（越小越飄）', 0.2, 1, 0.05], ['releaseGravity', '放開跳鍵下墜', 1, 4, 0.1], ['maxFall', '最大落速', 500, 1600, 25],
    ['accelAir', '空中轉向', 600, 4000, 50], ['cardInterval', '換卡間隔', 0.08, 0.6, 0.01],
    ['liftTime', '舉起停留', 0.1, 1.2, 0.05], ['throwVX', '投擲水平', 300, 1100, 10], ['throwVY', '投擲向上', 500, 1300, 10], ['recover', '落地硬直', 0, 0.5, 0.02],
    ['chargeSpeed', '衝刺速度', 300, 1400, 10], ['chargeTurn', '掉頭所需時間', 0, 1, 0.02],
    ['directMode', '直按模式（1 J/L 直按，0 K 抽卡）', 0, 1, 1], ['slowmo', '抽卡時世界速度', 0.05, 1, 0.05], ['airDraws', '空中可抽次數', 0, 3, 1], ['airCharge', '空中衝刺滯空', 0, 1.2, 0.05], ['holdTime', '喝完可等幾秒', 1, 10, 0.5],
    ['patrolSpeed', '巡邏速度', 40, 300, 5], ['belt', '輸送帶速度', 60, 400, 10], ['crumbleDelay', '紙箱撐多久', 0.1, 1.2, 0.05],
  ];
  const DEFAULTS = { ...TUNING };
  try { Object.assign(TUNING, JSON.parse(localStorage.getItem('drunk-tuning-v3') || '{}')); } catch (e) { /* storage blocked in some embeds */ }
  function buildTune() {
    tune.innerHTML = '<b>手感</b>' + KNOBS.map(([k, label, min, max, step]) =>
      `<label>${label}<input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${TUNING[k]}"><span>${TUNING[k]}</span></label>`).join('') +
      '<div><button data-t="reset">還原</button><button data-t="copy">複製數值</button></div><textarea readonly hidden></textarea>';
  }
  tune.addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return;
    TUNING[k] = +e.target.value; e.target.nextElementSibling.textContent = e.target.value;
    try { localStorage.setItem('drunk-tuning-v3', JSON.stringify(TUNING)); } catch (err) { /* ignore */ }
  });
  tune.addEventListener('click', e => {
    const t = e.target.dataset.t; if (!t) return;
    if (t === 'reset') { Object.assign(TUNING, DEFAULTS); try { localStorage.removeItem('drunk-tuning-v3'); } catch (err) { /* ignore */ } buildTune(); }
    if (t === 'copy') {
      const json = JSON.stringify(Object.fromEntries(KNOBS.map(([k]) => [k, TUNING[k]])));
      const area = tune.querySelector('textarea'); area.hidden = false; area.value = json; area.select();
      if (navigator.clipboard) navigator.clipboard.writeText(json).catch(() => {});
    }
    e.target.blur();
  });
  addEventListener('keydown', e => { if (e.code === 'Backquote' && !e.repeat) { tune.hidden = !tune.hidden; if (!tune.hidden) buildTune(); } });

  // ---------- menu & level loading ----------
  function toggleMenu(force) {
    menu.hidden = force !== undefined ? !force : !menu.hidden;
    held.left = held.right = held.jump = held.down = false; pressed = {};
    menuMsg.textContent = '';
  }
  function load(textData, name) {
    try { game = new Game(parseCampaign(textData)); roomKey = ''; toggleMenu(false); }
    catch (err) { toggleMenu(true); menuMsg.textContent = `${name} 讀不進來：\n${err.message}`; }
  }
  menu.addEventListener('click', e => {
    const act = e.target.dataset && e.target.dataset.act; if (!act) return;
    if (act === 'resume') toggleMenu(false);
    if (act === 'retry') { toggleMenu(false); game.die(); }
    if (act === 'restart') { game.startMap(0); toggleMenu(false); }
    if (act === 'default') { game = new Game(window.DEFAULT_CAMPAIGN); roomKey = ''; toggleMenu(false); }
    if (act === 'load') fileInput.click();
  });
  fileInput.addEventListener('change', () => { const f = fileInput.files[0]; if (f) f.text().then(t => load(t, f.name)); fileInput.value = ''; });
  if (new URLSearchParams(location.search).get('editorTest') === '1' && parent !== window) {
    addEventListener('message', e => {
      if (e.source !== parent || e.data?.type !== 'drunk-editor-test') return;
      try {
        const campaign = parseCampaign(e.data.campaign);
        const map = campaign.maps[e.data.mapIndex];
        if (!map || !map.rooms.some(r => r.id === e.data.roomId)) throw new Error('找不到試玩房間');
        const preview = new Game(campaign);
        preview.startMap(e.data.mapIndex);
        preview.enterRoom(e.data.roomId);
        preview.phase = 'play';
        game = preview;
        roomKey = '';
        toggleMenu(false);
      } catch (err) { toggleMenu(true); menuMsg.textContent = `試玩讀不進來：\n${err.message}`; }
    });
    parent.postMessage({ type: 'drunk-test-ready' }, '*');
  }
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) f.text().then(t => load(t, f.name)); });
})();
</script>
</body>
