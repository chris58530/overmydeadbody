<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>醉隱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #0e0b1c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "KaiTi", serif; }
  canvas { display: block; width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); background: #2b2860; }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: rgba(14, 11, 28, .82); color: #f3e9d2; }
  #menu[hidden] { display: none; }
  #menu h2 { font-weight: normal; font-size: 34px; margin: 0 0 18px; letter-spacing: 4px; }
  #menu button { font: inherit; font-size: 22px; color: inherit; background: none; border: 0; padding: 6px 14px; cursor: pointer; opacity: .78; }
  #menu button:hover, #menu button:focus-visible { opacity: 1; text-decoration: underline wavy rgba(243, 233, 210, .5); outline: none; }
  #menu small { margin-top: 22px; opacity: .55; font-size: 15px; text-align: center; line-height: 1.8; }
  #tune { position: fixed; top: 10px; right: 10px; width: 250px; max-height: calc(100vh - 20px); overflow: auto; padding: 12px 14px; background: rgba(14, 11, 28, .88); color: #f3e9d2; font-size: 14px; border-radius: 4px; }
  #tune[hidden] { display: none; }
  #tune b { display: block; font-weight: normal; font-size: 18px; margin-bottom: 6px; }
  #tune label { display: grid; grid-template-columns: 1fr 44px; gap: 0 6px; margin: 6px 0; }
  #tune input { grid-column: 1; width: 100%; accent-color: #e0a87a; }
  #tune span { grid-column: 2; grid-row: 1 / 3; align-self: end; text-align: right; opacity: .8; }
  #tune button { font: inherit; color: inherit; background: none; border: 1px solid rgba(243, 233, 210, .35); padding: 3px 10px; margin: 8px 6px 0 0; cursor: pointer; }
  #tune textarea { width: 100%; height: 70px; margin-top: 8px; font-size: 11px; background: #1b1633; color: inherit; border: 0; }
  #menuMsg { color: #f0a49c; white-space: pre-line; font-size: 15px; max-width: 80vw; text-align: center; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0"></canvas>
<div id="menu" hidden>
  <h2>暫停</h2>
  <button data-act="resume">繼續</button>
  <button data-act="retry">重來這間</button>
  <button data-act="restart">從第一間開始</button>
  <button data-act="load">載入關卡 JSON</button>
  <button data-act="default">換回內建關卡</button>
  <p id="menuMsg"></p>
  <small>A D 走　W 跳　K 抽卡 → K 鎖定 → 喝完 5 秒內按 K 發動　R 重來　M 靜音　` 調手感<br>也可以直接把 JSON 拖進畫面</small>
</div>
<div id="tune" hidden></div>
<input id="file" type="file" accept=".json,application/json" hidden>
<script>
// 醉隱 game engine: pure rules, no DOM. Units are pixels; a room is 32 x 18 tiles of 40 px.
(function (root) {
  'use strict';

  const T = 40, COLS = 32, ROWS = 18, W = COLS * T, H = ROWS * T;
  const BODY_W = 44, BODY_H = 72;

  // px and seconds. Throw speeds start from the BeaverKit skill lab (throwVX 980 shrunk to fit a 32-tile room).
  // Every value here can be changed live in the tuning panel (backquote key).
  const TUNING = {
    run: 330, accelGround: 3200, accelAir: 1900,
    jump: 660, gravity: 2000, apexHang: 0.5, releaseGravity: 2.4, maxFall: 950,
    coyote: 0.1, jumpBuffer: 0.12,
    cardInterval: 0.32, drink: 0.8,
    liftTime: 0.45, liftRise: 0.12, liftHeight: 84, throwVX: 640, throwVY: 960, recover: 0.1,
    chargeSpeed: 700, chargeTime: 4.2, chargeTurn: 0.42,
    carryOffset: 80, releaseVY: 260,
    patrolSpeed: 110, belt: 180, crumbleDelay: 0.45, crumbleRespawn: 2.5, fallTrigger: 60, fallWarn: 0.18,
    slowmo: 0.2, airDraws: 1, airCharge: 0.5, hitStop: 0.06, holdTime: 5,
    deathDelay: 0.55, transition: 0.5,
  };

  const ABILITIES = {
    wrestler: { name: '摔角手', bottle: 0, tint: '#e0605a', ink: '#b8433c' },
    bodyguard: { name: '保鑣', bottle: 1, tint: '#5aa7d6', ink: '#2f6f9c' },
  };

  // . empty  # ground  ^ shards  = plank  B crate (charge breaks)  C crumbling boxes  < > conveyor
  // R patrol (office chair / night guard)  L falling light (tube / sign)  * bottle cap  P spawn
  const TILE_CHARS = '.#^=BCP<>RL*';
  const GUARD_LINES = ['下班了還想去哪？', '這裡不能過。', '你是不是喝酒了？'];
  const SOLID = '#BC<>';
  const SIDES = ['left', 'right', 'top', 'bottom'];
  const THEMES = ['office', 'pantry', 'elevator', 'lobby', 'street'];

  function validateCampaign(data) {
    const errors = [];
    if (!data || data.format !== 'drunken-rooms') errors.push('format 必須是 "drunken-rooms"');
    if (data && data.version !== 2) errors.push('version 必須是 2');
    if (!data || !Array.isArray(data.maps) || !data.maps.length) { errors.push('maps 至少要有一張地圖'); return errors; }
    data.maps.forEach((map, mi) => {
      const at = `maps[${mi}]`;
      if (!Array.isArray(map.abilities) || !map.abilities.length) errors.push(`${at}.abilities 不可為空`);
      else map.abilities.forEach(a => { if (!ABILITIES[a]) errors.push(`${at} 未知能力 "${a}"`); });
      if (!Array.isArray(map.rooms) || !map.rooms.length) { errors.push(`${at}.rooms 不可為空`); return; }
      const ids = new Set(map.rooms.map(r => r.id));
      if (ids.size !== map.rooms.length) errors.push(`${at} 有重複的房間 id`);
      map.rooms.forEach((room, ri) => {
        const rat = `${at}.rooms[${ri}] (${room.id})`;
        if (!Array.isArray(room.tiles) || room.tiles.length !== ROWS) { errors.push(`${rat} tiles 必須是 ${ROWS} 列`); return; }
        let spawns = 0;
        room.tiles.forEach((row, y) => {
          if (typeof row !== 'string' || row.length !== COLS) errors.push(`${rat} 第 ${y} 列必須是 ${COLS} 字元`);
          else for (const ch of row) { if (!TILE_CHARS.includes(ch)) errors.push(`${rat} 第 ${y} 列有未知格子 "${ch}"`); if (ch === 'P') spawns++; }
        });
        if (spawns !== 1) errors.push(`${rat} 必須剛好有一個出生點 P`);
        if (room.theme !== undefined && !THEMES.includes(room.theme)) errors.push(`${rat} 未知場景 "${room.theme}"`);
        const exits = room.exits || {};
        const keys = Object.keys(exits);
        if (!keys.length) errors.push(`${rat} 至少要有一個出口`);
        keys.forEach(side => {
          if (!SIDES.includes(side)) errors.push(`${rat} 出口方向 "${side}" 無效`);
          else if (exits[side] !== null && !ids.has(exits[side])) errors.push(`${rat} 出口指向不存在的房間 "${exits[side]}"`);
        });
      });
    });
    return errors;
  }

  function parseCampaign(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error('不是有效的 JSON'); }
    const errors = validateCampaign(data);
    if (errors.length) throw new Error(errors.join('\n'));
    return data;
  }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  class Game {
    constructor(campaign) {
      this.campaign = campaign;
      this.deaths = 0;
      this.time = 0;
      this.mapTime = 0;
      this.particles = [];
      this.shake = 0;
      this.events = [];
      this.bubbles = [];
      this.capsGot = new Set();
      this.seen = new Set();
      this.startMap(0);
    }

    get map() { return this.campaign.maps[this.mapIndex]; }

    startMap(index) {
      this.mapIndex = index;
      this.mapDeaths = 0;
      this.mapTime = 0;
      this.phase = this.map.intro ? 'intro' : 'play';
      this.timer = 0;
      this.enterRoom(this.map.rooms[0].id);
    }

    enterRoom(id) {
      this.room = this.map.rooms.find(r => r.id === id);
      this.tiles = this.room.tiles.map(row => row.split(''));
      this.tilesVersion = (this.tilesVersion || 0) + 1;
      this.exits = this.room.exits || {};
      this.entities = [];
      this.crumbles = new Map();
      const street = (this.room.theme || 'street') === 'street';
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const t = this.tiles[y][x];
        if (t === 'P') this.spawn = { x: x * T + T / 2, y: (y + 1) * T };
        if (t === 'R') { this.entities.push({ kind: 'patrol', x: x * T + T / 2, y: (y + 1) * T, dir: -1, alive: true, w: street ? 44 : 40, h: street ? 110 : 34, skin: street ? 'guard' : 'chair', t: 0 }); this.tiles[y][x] = '.'; }
        if (t === 'L') { this.entities.push({ kind: 'faller', x: x * T + T / 2, y: y * T, vy: 0, phase: 'idle', t: 0, w: 72, h: street ? 30 : 14, skin: street ? 'sign' : 'tube' }); this.tiles[y][x] = '.'; }
        if (t === '*') {
          const key = `${this.map.id}:${this.room.id}:${x},${y}`;
          if (!this.capsGot.has(key)) this.entities.push({ kind: 'cap', key, x: x * T + T / 2, y: y * T + T / 2, got: false, t: 0 });
          this.tiles[y][x] = '.';
        }
      }
      this.roomCaps = [];
      this.activeSkill = null;
      this.airDraws = 0;
      this.drinkT = 0;
      this.ready = null;
      this.hitStop = 0;
      this.bubbles = [];
      if (!this.seen.has(this.map.id + ':' + id)) {
        this.seen.add(this.map.id + ':' + id);
        (this.room.lines || []).forEach((text, i) => this.bubbles.push({ who: 'body', text, delay: 0.6 + i * 2.4, t: 2.2 }));
      }
      this.body = { x: this.spawn.x, y: this.spawn.y, vx: 0, vy: 0, face: 1, grounded: true, anim: 'idle', animTime: 0 };
      this.state = 'free';
      this.timer = 0;
      this.coyote = 0;
      this.jumpBuf = 0;
      this.slot = null;
      this.flash = null;
      this.pending = null;
      this.stand = null;
      this.aim = 1;
      this.roomTitle = 2.4;
    }

    tileAt(cx, cy) {
      if (cx < 0) return this.exits.left !== undefined ? '.' : '#';
      if (cx >= COLS) return this.exits.right !== undefined ? '.' : '#';
      if (cy < 0) return this.exits.top !== undefined ? '.' : '#';
      if (cy >= ROWS) return '.';
      return this.tiles[cy][cx];
    }

    solid(cx, cy) { return SOLID.includes(this.tileAt(cx, cy)); }

    box(b, y = b.y) { const h = b.h || BODY_H; return { x: b.x - BODY_W / 2, y: y - h, w: BODY_W, h }; }

    hitsSolid(box) {
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (this.solid(x, y)) return true;
      return false;
    }

    moveX(b, dx) {
      b.x += dx;
      const box = this.box(b);
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        if (!this.solid(x, y)) continue;
        b.x = dx > 0 ? x * T - BODY_W / 2 : (x + 1) * T + BODY_W / 2;
        b.vx = 0;
        return true;
      }
      return false;
    }

    moveY(b, dy) {
      const prevBottom = b.y;
      b.y += dy;
      b.grounded = false;
      const box = this.box(b);
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const t = this.tileAt(x, y);
        const floorOnly = (t === '=' || (t === '^' && b.glassFloor)) && dy > 0 && prevBottom <= y * T + 0.01;
        if (!(SOLID.includes(t) || floorOnly)) continue;
        if (dy > 0) { b.y = y * T; b.grounded = true; } else b.y = (y + 1) * T + (b.h || BODY_H);
        b.vy = 0;
        return true;
      }
      return false;
    }

    physics(dt) {
      const b = this.body;
      b.vy = Math.min(TUNING.maxFall, b.vy + TUNING.gravity * dt);
      this.moveX(b, b.vx * dt);
      this.moveY(b, b.vy * dt);
    }

    emit(x, y, color, count, spread = 220, lift = 180) {
      for (let i = 0; i < count && this.particles.length < 300; i++) {
        this.particles.push({ x, y, vx: (Math.random() - 0.5) * spread, vy: -Math.random() * lift, life: 0.5 + Math.random() * 0.35, max: 0.85, size: 3 + Math.random() * 4, color });
      }
    }

    // K opens the slot. The skill behind the current action is left out of the pool, and once off the
    // ground only TUNING.airDraws draws are allowed until the body touches down again.
    pressK() {
      if (this.state === 'dead' || this.slot || this.drinkT > 0) return;
      // a drunk card is held for TUNING.holdTime seconds; K spends it whenever the moment is right
      if (this.ready) { const id = this.ready.id; this.ready = null; this.fire(id); return; }
      const pool = this.map.abilities.filter(a => a !== this.activeSkill);
      const airborne = !this.body.grounded || ['lift', 'thrown', 'charge'].includes(this.state);
      if (!pool.length || (airborne && this.airDraws >= TUNING.airDraws)) {
        this.bubbles.push({ who: 'body', text: '現在抽不了', delay: 0, t: 0.8 });
        this.events.push('deny');
        return;
      }
      if (airborne) this.airDraws++;
      this.slot = { pool, mode: 'spin', index: 0, t: 0, age: 0, flip: 0, ticks: 0, braked: 0, brakeSteps: 0 };
      this.events.push('slotOpen');
    }

    // Pick a Card: the cards cycle in real time while the world crawls at TUNING.slowmo;
    // pressing K again locks the card on show at once, then Jim takes a sip and the skill fires.
    lockSlot() {
      const sl = this.slot;
      sl.mode = 'reveal';
      sl.t = 0;
      sl.chosen = sl.index;
      this.pending = sl.pool[sl.index];
      this.flash = { color: ABILITIES[this.pending].tint, t: 0.45 };
      this.shake = 0.18;
      this.drinkT = TUNING.drink;
      this.events.push('reveal', 'drink');
    }

    updateSlot(dt, kPressed) {
      const sl = this.slot, n = sl.pool.length;
      sl.t += dt; sl.age += dt;
      sl.flip = Math.min(1, sl.flip + dt / 0.09);
      if (sl.mode === 'spin') {
        if (kPressed && sl.age > 0.12) { this.lockSlot(); return; }
        if (sl.t >= TUNING.cardInterval) {
          sl.t = 0; sl.index = (sl.index + 1) % n; sl.flip = 0; sl.ticks++;
          this.events.push('tick');
          if (sl.ticks >= 12) this.lockSlot();
        }
      } else if (sl.t >= 0.35) this.slot = null;
    }

    fire(id) {
      this.pending = null;
      if (id === 'wrestler') this.startLift();
      if (id === 'bodyguard') this.startCharge();
    }

    // Bodyguard: the stand shoulders the body and charges at a constant speed through crates; glass cannot hurt the stand.
    startCharge() {
      const b = this.body;
      const airborne = !b.grounded || this.state !== 'free';
      const s = { x: b.x, y: b.y, vx: 0, vy: 0, h: BODY_H + TUNING.carryOffset, glassFloor: true, face: b.face, ability: 'bodyguard', alpha: 1, leaving: false };
      if (this.hitsSolid(this.box(s))) { this.emit(b.x, b.y - 40, ABILITIES.bodyguard.tint, 10); this.events.push('deny'); return; }
      this.activeSkill = 'bodyguard';
      this.airCharge = airborne ? TUNING.airCharge : 0;
      this.events.push('charge');
      this.state = 'charge';
      this.timer = TUNING.chargeTime;
      this.chargeDir = b.face;
      this.speed = TUNING.chargeSpeed;
      this.turnTime = 0;
      this.stand = s;
      b.vx = b.vy = 0;
      this.carry();
      this.setAnim('fall');
      this.emit(b.x, s.y, ABILITIES.bodyguard.tint, 14);
    }

    carry() {
      const s = this.stand, b = this.body;
      b.x = s.x - this.chargeDir * 8;
      b.y = s.y - TUNING.carryOffset;
      b.face = this.chargeDir;
    }

    // Moves the stand horizontally, smashing crates; returns true when a wall stops the charge.
    chargeMove(st, dx) {
      st.x += dx;
      const box = this.box(st);
      const x0 = Math.floor(box.x / T), x1 = Math.floor((box.x + box.w - 1e-6) / T);
      const y0 = Math.floor(box.y / T), y1 = Math.floor((box.y + box.h - 1e-6) / T);
      let wall = false;
      const crates = [];
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const t = this.tileAt(x, y);
        if (t === 'B' || t === 'C') crates.push([x, y]); else if (SOLID.includes(t)) wall = true;
      }
      if (crates.length) {
        for (const [x, y] of crates) this.breakFrom(x, y);
        this.shake = 0.35;
        this.hitStop = TUNING.hitStop;
        this.events.push('break');
      }
      if (!wall) return false;
      const col = dx > 0 ? x1 : x0;
      st.x = dx > 0 ? col * T - BODY_W / 2 : (col + 1) * T + BODY_W / 2;
      return true;
    }

    breakFrom(x, y) {
      const kind = this.tiles[y][x], stack = [[x, y]];
      if (kind !== 'B' && kind !== 'C') return;
      let n = 0;
      while (stack.length) {
        const [cx, cy] = stack.pop();
        if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS || this.tiles[cy][cx] !== kind) continue;
        this.tiles[cy][cx] = '.';
        this.crumbles.delete(cx + ',' + cy);
        n++;
        this.emit(cx * T + T / 2, cy * T + T / 2, n % 2 ? '#c98a5a' : '#f0c08a', 3, 380, 260);
        stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
      }
      if (n) this.tilesVersion++;
    }

    finishCharge() {
      const st = this.stand, b = this.body;
      this.state = 'thrown';
      this.events.push('throw');
      b.x = st.x;
      b.y = st.y - TUNING.carryOffset;
      b.vx = this.chargeDir * Math.max(360, this.speed * 0.55);
      b.vy = -TUNING.releaseVY;
      st.leaving = true;
      this.setAnim('jump');
    }

    startLift() {
      const b = this.body;
      this.activeSkill = 'wrestler';
      this.events.push('lift');
      this.state = 'lift';
      this.timer = TUNING.liftTime;
      this.aim = b.face;
      this.stand = { x: b.x, y: b.y, face: b.face, ability: 'wrestler', alpha: 1, leaving: false };
      b.vx = b.vy = 0;
      let h = 0;
      while (h < TUNING.liftHeight && !this.hitsSolid(this.box(b, b.y - h - 4))) h += 4;
      this.liftFrom = b.y;
      this.liftTo = b.y - h;
      this.liftT = 0;
      this.setAnim('jump');
      this.emit(b.x, b.y, ABILITIES.wrestler.tint, 14);
    }

    setAnim(name) { if (this.body.anim !== name) { this.body.anim = name; this.body.animTime = 0; } }

    // Conveyor speed under a grounded actor's centre.
    beltUnder(a) {
      if (!a.grounded) return 0;
      const t = this.tileAt(Math.floor(a.x / T), Math.round(a.y / T));
      return t === '>' ? TUNING.belt : t === '<' ? -TUNING.belt : 0;
    }

    // Standing on a box stack starts the whole connected stack shaking.
    touchCrumble(a) {
      if (!a.grounded) return;
      const row = Math.round(a.y / T), box = this.box(a);
      for (let x = Math.floor(box.x / T); x <= Math.floor((box.x + box.w - 1e-6) / T); x++) {
        if (this.tileAt(x, row) !== 'C' || this.crumbles.has(x + ',' + row)) continue;
        const stack = [[x, row]];
        while (stack.length) {
          const [cx, cy] = stack.pop(), key = cx + ',' + cy;
          if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS || this.tiles[cy][cx] !== 'C' || this.crumbles.has(key)) continue;
          this.crumbles.set(key, { x: cx, y: cy, phase: 'shake', t: TUNING.crumbleDelay });
          stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
        }
      }
    }

    updateCrumbles(dt) {
      const body = this.box(this.body);
      for (const [key, c] of this.crumbles) {
        c.t -= dt;
        if (c.phase === 'shake') {
          if (Math.random() < dt * 8) this.emit(c.x * T + Math.random() * T, c.y * T + T, '#d9b98a', 1, 60, 20);
          if (c.t <= 0) { this.events.push('crumble'); this.tiles[c.y][c.x] = '.'; c.phase = 'gone'; c.t = TUNING.crumbleRespawn; this.emit(c.x * T + T / 2, c.y * T + T / 2, '#c89a64', 4, 260, 160); }
        } else if (c.t <= 0 && !overlap(body, { x: c.x * T, y: c.y * T, w: T, h: T })) {
          this.tiles[c.y][c.x] = 'C';
          this.crumbles.delete(key);
        }
      }
    }

    updateEntities(dt) {

    if (!ok(im)) { ctx.globalAlpha = alpha; ctx.fillStyle = color || '#f3e9d2'; ctx.fillRect(-16, -64, 32, 64); ctx.restore(); return; }
    if (color) {
      tctx.globalCompositeOperation = 'source-over'; tctx.globalAlpha = 1; tctx.clearRect(0, 0, 512, 512);
      tctx.drawImage(im, sx, 0, 512, 512, 0, 0, 512, 512);
      tctx.globalCompositeOperation = 'source-atop'; tctx.globalAlpha = 0.8; tctx.fillStyle = color; tctx.fillRect(0, 0, 512, 512);
      ctx.globalAlpha = alpha; ctx.drawImage(tint, -size / 2, -size * 0.91, size, size);
    } else ctx.drawImage(im, sx, 0, 512, 512, -size / 2, -size * 0.91, size, size);
    ctx.restore();
  }

  // The slot card rides above Jim's head, like Twisted Fate's Pick a Card; a light vignette marks the slow motion.
  function drawSlot() {
    const g = game, sl = g.slot;
    if (!sl) return;
    const id = sl.pool[sl.index], ab = ABILITIES[id], b = g.body;
    const v = ctx.createRadialGradient(W / 2, H / 2, 240, W / 2, H / 2, 760);
    v.addColorStop(0, 'rgba(14,11,28,0)'); v.addColorStop(1, 'rgba(8,6,18,.45)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    const reveal = sl.mode === 'reveal', pop = reveal ? 1 + 0.25 * Math.max(0, 1 - sl.t / 0.2) : 1;
    const cw = 66, ch = 88;
    const x = Math.max(cw, Math.min(W - cw, b.x)), y = Math.max(ch / 2 + 14, b.y - 182);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(g.time * 3) * 0.04);
    ctx.scale(pop * (reveal ? 1 : 0.15 + 0.85 * sl.flip), pop);
    if (reveal) {
      // hand-drawn burst around the chosen card
      ctx.strokeStyle = ab.tint; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let i = 0; i < 12; i++) {
        const a = i / 12 * Math.PI * 2 + 0.2, r0 = 56 + rnd(i, 1, 4) * 6, r1 = r0 + 12 + rnd(i, 2, 4) * 12;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0 * 0.8, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * r1 * 0.8, Math.sin(a) * r1); ctx.stroke();
      }
    }
    ctx.fillStyle = '#f1e6cf'; ctx.strokeStyle = reveal ? ab.tint : '#2a2244'; ctx.lineWidth = reveal ? 4 : 2.5;
    ctx.beginPath(); ctx.moveTo(-cw / 2 + 3, -ch / 2); ctx.lineTo(cw / 2, -ch / 2 + 2); ctx.lineTo(cw / 2 - 2, ch / 2); ctx.lineTo(-cw / 2, ch / 2 - 1); ctx.closePath(); ctx.fill(); ctx.stroke();
    const bob = reveal ? 0 : Math.sin(g.time * (sl.mode === 'spin' ? 22 : 9)) * 2;
    const bt = bottles[ab.bottle]; if (bt) ctx.drawImage(bt, -28, -40 + bob, 56, 56);
    ctx.textAlign = 'center'; ctx.font = `16px ${FONT}`; ctx.fillStyle = ab.ink; ctx.fillText(ab.name, 0, 34);
    ctx.restore();
    if (sl.mode === 'spin') text('K', x, y + ch / 2 + 22, 16, 'center', 0.5 + 0.3 * Math.sin(g.time * 8));
  }

  // The drunk card waits above Jim's head with a draining bar; it blinks in the last 1.5 s.
  function drawReady() {
    const g = game, r = g.ready;
    if (!r || g.slot) return;
    const ab = ABILITIES[r.id], b = g.body, cw = 66, ch = 88;
    const x = Math.max(cw, Math.min(W - cw, b.x)), y = Math.max(ch / 2 + 14, b.y - 182);
    const blink = r.t < 1.5 ? 0.35 + 0.65 * Math.abs(Math.sin(g.time * 10)) : 1;
    ctx.save(); ctx.globalAlpha = blink; ctx.translate(x, y); ctx.rotate(Math.sin(g.time * 3) * 0.04);
    ctx.fillStyle = '#f1e6cf'; ctx.strokeStyle = ab.tint; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-cw / 2 + 3, -ch / 2); ctx.lineTo(cw / 2, -ch / 2 + 2); ctx.lineTo(cw / 2 - 2, ch / 2); ctx.lineTo(-cw / 2, ch / 2 - 1); ctx.closePath(); ctx.fill(); ctx.stroke();
    const bt = bottles[ab.bottle]; if (bt) ctx.drawImage(bt, -28, -40, 56, 56);
    ctx.textAlign = 'center'; ctx.font = `16px ${FONT}`; ctx.fillStyle = ab.ink; ctx.fillText(ab.name, 0, 34);
    ctx.fillStyle = 'rgba(28,22,54,.5)'; ctx.fillRect(-cw / 2, ch / 2 + 6, cw, 6);
    ctx.fillStyle = ab.tint; ctx.fillRect(-cw / 2, ch / 2 + 6, cw * (r.t / TUNING.holdTime), 6);
    ctx.restore();
    text('K 發動', x, y - ch / 2 - 10, 15, 'center', 0.55 + 0.3 * Math.sin(g.time * 6));
  }

  // Day two leaves the office: sodium street lamps over a magenta night.
  function drawStreetGrade() {
    ctx.save();
    ctx.globalCompositeOperation = 'soft-light';
    const gr = ctx.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, 'rgba(120,40,170,.75)'); gr.addColorStop(0.55, 'rgba(230,70,130,.55)'); gr.addColorStop(1, 'rgba(255,150,60,.85)');
    ctx.fillStyle = gr; ctx.fillRect(-8, -8, W + 16, H + 16);
    ctx.restore();
    for (const x of [170, 640, 1110]) {
      const gl = ctx.createRadialGradient(x, 300, 6, x, 300, 300);
      gl.addColorStop(0, 'rgba(255,190,90,.38)'); gl.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = gl; ctx.fillRect(x - 300, 0, 600, H);
      ctx.fillStyle = '#1a1028'; ctx.fillRect(x - 4, 300, 8, H - 300);
      ctx.beginPath(); ctx.moveTo(x - 4, 302); ctx.quadraticCurveTo(x, 270, x + 30, 280); ctx.lineWidth = 6; ctx.strokeStyle = '#1a1028'; ctx.stroke();
      ctx.fillStyle = '#ffd38a'; ctx.beginPath(); ctx.ellipse(x + 32, 286, 14, 6, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawDynamicTiles() {
    const g = game;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const t = g.tiles[y][x], tx = x * T, ty = y * T;
      if (t === 'C') {
        const c = g.crumbles.get(x + ',' + y), jx = c ? (Math.random() - 0.5) * 4 : 0, jy = c ? (Math.random() - 0.5) * 2 : 0;
        ctx.save(); ctx.translate(tx + jx, ty + jy);
        ctx.fillStyle = (x + y) % 2 ? '#c89a64' : '#bd8f5a'; ctx.fillRect(1, 1, T - 2, T - 2);
        ctx.fillStyle = '#e8d6a8'; ctx.fillRect(T / 2 - 4, 1, 8, T - 2);
        ctx.strokeStyle = '#3a2618'; ctx.lineWidth = 2.5; ctx.strokeRect(1, 1, T - 2, T - 2);
        ctx.strokeStyle = 'rgba(58,38,24,.5)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(4, T - 9); ctx.lineTo(14, T - 9); ctx.stroke();
        ctx.restore();
      } else if (t === '<' || t === '>') {
        const d = t === '>' ? 1 : -1, off = ((g.time * TUNING.belt * d) % 20 + 20) % 20;
        ctx.fillStyle = '#2a2d3d'; ctx.fillRect(tx, ty, T, T);
        ctx.fillStyle = '#3c4157'; ctx.fillRect(tx, ty, T, 10);
        ctx.save(); ctx.beginPath(); ctx.rect(tx, ty, T, 10); ctx.clip();
        ctx.strokeStyle = '#ffd38a'; ctx.lineWidth = 2.5;
        for (let k = -20; k < T + 20; k += 20) { const cx = tx + k + off; ctx.beginPath(); ctx.moveTo(cx - 4 * d, ty + 1); ctx.lineTo(cx + 3 * d, ty + 5); ctx.lineTo(cx - 4 * d, ty + 9); ctx.stroke(); }
        ctx.restore();
        ctx.strokeStyle = '#120c1c'; ctx.lineWidth = 2.5; ctx.strokeRect(tx, ty, T, T);
      }
    }
  }

  function drawEntities() {
    const g = game;
    for (const e of g.entities) {
      if (e.kind === 'patrol') {
        ctx.save(); ctx.translate(e.x, e.y);
        if (!e.alive) ctx.rotate(e.t * 9 * Math.sign(e.vx || 1));
        if (e.skin === 'chair') {
          ctx.strokeStyle = '#120c1c'; ctx.lineWidth = 2.5; ctx.fillStyle = '#2d2a3d';
          for (const wx of [-15, 0, 15]) { ctx.beginPath(); ctx.arc(wx + Math.sin(e.t * 12 + wx) * 1.5, -4, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
          ctx.fillRect(-2, -22, 4, 16);
          ctx.fillStyle = '#c0504d'; ctx.beginPath(); ctx.rect(-20, -28, 40, 8); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.rect(-e.dir * 20 - (e.dir > 0 ? 0 : 0) - 4, -50, 8, 26); ctx.fill(); ctx.stroke();
        } else {
          const lit = ctx.createLinearGradient(0, 0, e.dir * 200, 0);
          lit.addColorStop(0, 'rgba(255,240,180,.35)'); lit.addColorStop(1, 'rgba(255,240,180,0)');
          if (e.alive) { ctx.fillStyle = lit; ctx.beginPath(); ctx.moveTo(e.dir * 16, -62); ctx.lineTo(e.dir * 200, -110); ctx.lineTo(e.dir * 200, -10); ctx.closePath(); ctx.fill(); }
          ctx.restore();
          drawActor(e.alive ? 'run' : 'fall', e.t, e.x, e.y, e.dir, 150, '#232a4a', 0.95);
          ctx.save(); ctx.translate(e.x, e.y);
          ctx.fillStyle = '#232a4a'; ctx.strokeStyle = '#0e1024'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.ellipse(e.dir * 4, -122, 24, 8, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
      } else if (e.kind === 'cap' && !e.got) {
        drawCap(e, g.time);
      } else if (e.kind === 'faller' && e.phase !== 'gone') {
        const wob = e.phase === 'warn' ? Math.sin(e.t * 60) * 0.12 : 0;
        if (e.phase !== 'fall') { ctx.strokeStyle = '#120c1c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(e.x - 26, 0); ctx.lineTo(e.x - 26, e.y); ctx.moveTo(e.x + 26, 0); ctx.lineTo(e.x + 26, e.y); ctx.stroke(); }
        ctx.save(); ctx.translate(e.x, e.y + e.h / 2); ctx.rotate(wob);
        if (e.skin === 'tube') {
          const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, 90); gl.addColorStop(0, 'rgba(200,250,230,.25)'); gl.addColorStop(1, 'rgba(200,250,230,0)');
          ctx.fillStyle = gl; ctx.fillRect(-90, -20, 180, 110);
          ctx.fillStyle = '#d9f3e6'; ctx.strokeStyle = '#122326'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.rect(-36, -7, 72, 14); ctx.fill(); ctx.stroke();
        } else {
          ctx.fillStyle = '#d8343f'; ctx.strokeStyle = '#1a0b10'; ctx.lineWidth = 3; ctx.beginPath(); ctx.rect(-36, -15, 72, 30); ctx.fill(); ctx.stroke();
          ctx.font = `24px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff1c8'; ctx.fillText('酒', 0, 9);
        }
        ctx.restore();
      }
    }
  }

  function drawBubbles() {
    const g = game;
    for (const bub of g.bubbles) {
      if (bub.delay > 0) continue;
      const tx = bub.who === 'body' ? g.body.x : bub.who.x, ty = bub.who === 'body' ? g.body.y - 128 : bub.who.y - bub.who.h - 34;
      ctx.save();
      ctx.globalAlpha = Math.min(1, bub.t / 0.25);
      ctx.font = `20px ${FONT}`;
      const w = ctx.measureText(bub.text).width + 28, x = Math.max(8, Math.min(W - w - 8, tx - w / 2)), y = Math.max(8, ty - 44);
      ctx.fillStyle = '#f6efdd'; ctx.strokeStyle = '#1c1636'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x + 3, y); ctx.lineTo(x + w, y + 2); ctx.lineTo(x + w - 2, y + 38); ctx.lineTo(tx + 8, y + 37); ctx.lineTo(tx - 2, y + 50); ctx.lineTo(tx - 6, y + 38); ctx.lineTo(x, y + 37); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2a2244'; ctx.textAlign = 'left'; ctx.fillText(bub.text, x + 14, y + 26);
      ctx.restore();
    }
  }

  function drawCap(e, t) {
    const y = e.y + Math.sin(t * 3 + e.x) * 3;
    ctx.save(); ctx.translate(e.x, y); ctx.rotate(Math.sin(t * 2) * 0.2);
    const gl = ctx.createRadialGradient(0, 0, 2, 0, 0, 34); gl.addColorStop(0, 'rgba(255,214,110,.45)'); gl.addColorStop(1, 'rgba(255,214,110,0)');
    ctx.fillStyle = gl; ctx.fillRect(-34, -34, 68, 68);
    ctx.beginPath();
    for (let i = 0; i < 21; i++) { const a = i / 21 * Math.PI * 2, r = i % 2 ? 11 : 14; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fillStyle = '#e8b84a'; ctx.fill(); ctx.strokeStyle = '#3a2618'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fillStyle = '#c9411f'; ctx.fill();
    ctx.restore();
  }

  function drawAim() {
    const g = game, b = g.body;
    let x = b.x, y = b.y, vx = g.aim * TUNING.throwVX, vy = -TUNING.throwVY;
    ctx.fillStyle = '#f3e9d2';
    for (let i = 0; i < 26; i++) {
      for (let k = 0; k < 4; k++) { vy += TUNING.gravity / 120; x += vx / 120; y += vy / 120; }
      if (y > H || g.hitsSolid(g.box({ x }, y))) break;
      ctx.globalAlpha = 0.75 * (1 - i / 26);
      ctx.beginPath(); ctx.arc(x, y - 36, 3.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  function text(str, x, y, size, align = 'left', alpha = 1, color = '#f3e9d2') {
    ctx.save(); ctx.globalAlpha = alpha; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
    ctx.fillStyle = 'rgba(16,12,36,.55)'; ctx.fillText(str, x + 2, y + 2);
    ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
  }

  function draw() {
    const g = game, b = g.body;
    const key = g.room.id + ':' + g.tilesVersion + ':' + g.mapIndex;
    if (key !== roomKey) { roomKey = key; buildLayer(); }
    ctx.save();
    if (g.shake) ctx.translate((Math.random() - 0.5) * g.shake * 18, (Math.random() - 0.5) * g.shake * 18);
    const theme = g.room.theme || 'street';
    if (theme !== 'street') ctx.drawImage(backdrop(theme), -8, -8, W + 16, H + 16);
    else if (ok(img.background)) ctx.drawImage(img.background, -8, -8, W + 16, H + 16); else { ctx.fillStyle = '#2b2860'; ctx.fillRect(-8, -8, W + 16, H + 16); }
    if (theme === 'street') { drawStreetGrade(); ctx.fillStyle = 'rgba(22,12,40,.28)'; ctx.fillRect(-8, -8, W + 16, H + 16); }
    else { ctx.fillStyle = 'rgba(18,14,44,.08)'; ctx.fillRect(-8, -8, W + 16, H + 16); }
    const pit = ctx.createLinearGradient(0, 560, 0, H); pit.addColorStop(0, 'rgba(6,4,14,0)'); pit.addColorStop(1, 'rgba(6,4,14,.7)');
    ctx.fillStyle = pit; ctx.fillRect(-8, 560, W + 16, H - 552);
    ctx.drawImage(layer, 0, 0);
    drawDynamicTiles();
    drawEntities();
    if (g.stand) {
      const st = g.stand, charging = g.state === 'charge';
      if (charging) {
        ctx.strokeStyle = 'rgba(243,233,210,.55)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        for (let i = 0; i < 4; i++) {
          const yy = st.y - 30 - i * 34 + Math.sin(g.time * 30 + i) * 4, len = 40 + i * 8;
          ctx.beginPath(); ctx.moveTo(st.x - g.chargeDir * (40 + i * 6), yy); ctx.lineTo(st.x - g.chargeDir * (40 + i * 6 + len), yy); ctx.stroke();
        }
      }
      drawActor(charging ? 'run' : 'idle', g.time, st.x, st.y, st.face, 132, ABILITIES[st.ability].tint, 0.62 * st.alpha);
    }
    if (g.state === 'lift') drawAim();
    if (g.state !== 'dead') {
      const [anim, f] = bodyPose(g);
      drawFrame(anim, f, b.x, b.y, b.face, 118, null, 1);
    }
    drawBubbles();
    for (const p of g.particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (g.drinkT > 0 && !g.slot) {
      const v = ctx.createRadialGradient(W / 2, H / 2, 240, W / 2, H / 2, 760);
      v.addColorStop(0, 'rgba(14,11,28,0)'); v.addColorStop(1, 'rgba(14,11,28,.45)');
      ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    }
    drawSlot();
    drawReady();
    if (g.flash) { ctx.globalAlpha = (g.flash.t / 0.45) * 0.4; ctx.fillStyle = g.flash.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    text(`${g.map.name}　${g.room.id}`, 22, 36, 20, 'left', 0.7);
    if (g.roomTitle > 0) {
      const a = Math.min(1, g.roomTitle / 0.6);
      if (g.room === g.map.rooms[0]) text(g.map.name, W / 2, 52, 24, 'center', a * 0.8);
      text(g.room.name, W / 2, 96, 40, 'center', a);
    }
    if (g.phase === 'transition') {
      const half = TUNING.transition / 2;
      ctx.fillStyle = `rgba(14,11,28,${1 - Math.abs(g.transT - half) / half})`; ctx.fillRect(0, 0, W, H);
    }
    if (g.phase === 'mapEnd') {
      ctx.fillStyle = `rgba(14,11,28,${Math.min(0.75, g.timer * 1.5)})`; ctx.fillRect(0, 0, W, H);
      const a = Math.min(1, g.timer * 1.5);
      const total = g.map.rooms.reduce((n, r) => n + r.tiles.join('').split('*').length - 1, 0);
      const got = [...g.capsGot].filter(k => k.startsWith(g.map.id + ':')).length;
      text(`${g.map.name}　完`, W / 2, H / 2 - 60, 64, 'center', a);
      if (g.map.outro) text(g.map.outro, W / 2, H / 2 - 4, 24, 'center', a * 0.85);
      text(`跌倒 ${g.mapDeaths} 次　·　${fmt(g.mapTime)}${total ? `　·　瓶蓋 ${got} / ${total}` : ''}`, W / 2, H / 2 + 40, 20, 'center', a * 0.7);
      const more = g.mapIndex + 1 < g.campaign.maps.length;
      if (g.timer > 0.6) text(more ? 'Enter 繼續' : 'Enter 再走一次', W / 2, H / 2 + 92, 20, 'center', 0.6 + 0.3 * Math.sin(g.time * 3));
    }
    if (g.phase === 'intro') {
      ctx.fillStyle = '#0e0b1c'; ctx.fillRect(0, 0, W, H);
      const a = Math.min(1, g.timer * 2);
      text(g.map.name, W / 2, H / 2 - 30, 60, 'center', a);
      text(g.map.intro, W / 2, H / 2 + 30, 24, 'center', Math.min(1, Math.max(0, g.timer * 2 - 0.6)) * 0.85);
      if (g.timer > 0.5) text('K 繼續', W / 2, H - 60, 18, 'center', 0.45 + 0.25 * Math.sin(g.time * 3));
    }
    if (loaded < Object.keys(SRC).length) text('…', W - 40, 36, 24, 'right', 0.6);
    if (!document.hasFocus()) text('點一下畫面就能玩', W / 2, H - 22, 22, 'center', 0.85);
  }

  // ---------- sound (WebAudio synth, nothing to download) ----------
  const Sfx = (() => {
    let ac = null, out = null, muted = false;
    function ensure() {
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); out = ac.createGain(); out.gain.value = 0.5; out.connect(ac.destination); } catch (e) { ac = null; } }
      if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
    }
    function tone(freq, dur, type = 'sine', vol = 0.2, to = null, delay = 0) {
      const t0 = ac.currentTime + delay, o = ac.createOscillator(), gn = ac.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
      gn.gain.setValueAtTime(vol, t0); gn.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(gn); gn.connect(out); o.start(t0); o.stop(t0 + dur + 0.02);
    }
    function noise(dur, vol, freq, kind = 'lowpass') {
      const t0 = ac.currentTime, len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
      src.buffer = buf; f.type = kind; f.frequency.value = freq; gn.gain.value = vol;
      src.connect(f); f.connect(gn); gn.connect(out); src.start(t0);
    }
    const bank = {
      jump: () => tone(380, 0.1, 'square', 0.06, 640),
      land: () => noise(0.06, 0.22, 500),
      slotOpen: () => tone(300, 0.16, 'triangle', 0.12, 620),
      tick: () => tone(1250, 0.025, 'square', 0.05),
      stop: () => tone(620, 0.07, 'triangle', 0.14),
      reveal: () => { tone(523, 0.3, 'triangle', 0.14); tone(659, 0.3, 'triangle', 0.11, null, 0.05); tone(784, 0.4, 'triangle', 0.1, null, 0.1); },
      drink: () => { tone(200, 0.12, 'sine', 0.22, 120); tone(180, 0.12, 'sine', 0.18, 110, 0.16); tone(170, 0.14, 'sine', 0.16, 100, 0.34); },
      lift: () => tone(180, 0.3, 'sawtooth', 0.05, 420),
      throw: () => noise(0.28, 0.3, 1600, 'bandpass'),
      charge: () => { noise(0.4, 0.25, 280); tone(80, 0.4, 'sawtooth', 0.08, 150); },
      break: () => { noise(0.2, 0.5, 900); tone(110, 0.14, 'square', 0.12, 55); },
      knock: () => { tone(320, 0.09, 'square', 0.16, 120); noise(0.12, 0.3, 1400); },
      die: () => { tone(440, 0.45, 'triangle', 0.16, 90); noise(0.15, 0.2, 2200, 'highpass'); },
      cap: () => { tone(880, 0.08, 'square', 0.08); tone(1320, 0.14, 'square', 0.08, null, 0.07); },
      crumble: () => noise(0.32, 0.18, 450),
      warn: () => tone(1500, 0.05, 'square', 0.04),
      crash: () => noise(0.4, 0.38, 3200, 'highpass'),
      deny: () => tone(150, 0.14, 'square', 0.08),
      ready: () => tone(988, 0.12, 'triangle', 0.1),
    };
    return {
      ensure,
      play(name) { if (!muted && ac && bank[name]) try { bank[name](); } catch (e) { /* ignore */ } },
      toggle() { muted = !muted; return muted; },
    };
  })();

  // ---------- input & loop ----------
  const held = { left: false, right: false, jump: false };
  let pressed = {};
  const bind = { KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', KeyW: 'jump', ArrowUp: 'jump', Space: 'jump', KeyK: 'k', KeyR: 'r', Enter: 'confirm', Escape: 'esc' };
  addEventListener('keydown', e => {
    Sfx.ensure();
    if (e.code === 'KeyM' && !e.repeat) { Sfx.toggle(); return; }
    const a = bind[e.code]; if (!a) return;
    e.preventDefault();
    if (a === 'esc') { if (!e.repeat) toggleMenu(); return; }
    if (!menu.hidden) return;
    if (a in held) held[a] = true;
    if (!e.repeat) pressed[a] = true;
  });
  addEventListener('keyup', e => { const a = bind[e.code]; if (a in held) held[a] = false; });
  addEventListener('blur', () => { held.left = held.right = held.jump = false; });
  canvas.addEventListener('pointerdown', () => window.focus());

  // Simulate exactly the elapsed frame time, split into small sub-steps, so motion matches the display refresh.
  let last = performance.now();
  function loop(now) {
    const frame = Math.min((now - last) / 1000, 1 / 20); last = now;
    if (menu.hidden && frame > 0) {
      const n = Math.ceil(frame / (1 / 240)), dt = frame / n;
      if (pressed.r && game.phase === 'play') game.die();
      for (let i = 0; i < n; i++) {
        game.step(dt, { ...held, jumpPressed: pressed.jump, kPressed: pressed.k, confirmPressed: pressed.confirm });
        pressed = {};
      }
    }
    for (const ev of new Set(game.events)) Sfx.play(ev);
    game.events.length = 0;
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.drunkDebug = { get game() { return game; }, draw };

  // ---------- tuning panel (backquote key) ----------
  const tune = document.getElementById('tune');
  const KNOBS = [
    ['run', '跑速', 150, 600, 5], ['jump', '跳躍力', 400, 1000, 5], ['gravity', '重力', 1000, 3500, 50],
    ['apexHang', '頂點滯空（越小越飄）', 0.2, 1, 0.05], ['releaseGravity', '放開跳鍵下墜', 1, 4, 0.1], ['maxFall', '最大落速', 500, 1600, 25],
    ['accelAir', '空中轉向', 600, 4000, 50], ['cardInterval', '換卡間隔', 0.08, 0.6, 0.01],
    ['liftTime', '舉起停留', 0.1, 1.2, 0.05], ['throwVX', '投擲水平', 300, 1100, 10], ['throwVY', '投擲向上', 500, 1300, 10], ['recover', '落地硬直', 0, 0.5, 0.02],
    ['chargeSpeed', '衝刺速度', 300, 1400, 10], ['chargeTurn', '掉頭所需時間', 0, 1, 0.02],
    ['slowmo', '抽卡時世界速度', 0.05, 1, 0.05], ['airDraws', '空中可抽次數', 0, 3, 1], ['airCharge', '空中衝刺滯空', 0, 1.2, 0.05], ['holdTime', '喝完可等幾秒', 1, 10, 0.5],
    ['patrolSpeed', '巡邏速度', 40, 300, 5], ['belt', '輸送帶速度', 60, 400, 10], ['crumbleDelay', '紙箱撐多久', 0.1, 1.2, 0.05],
  ];
  const DEFAULTS = { ...TUNING };
  try { Object.assign(TUNING, JSON.parse(localStorage.getItem('drunk-tuning') || '{}')); } catch (e) { /* storage blocked in some embeds */ }
  function buildTune() {
    tune.innerHTML = '<b>手感</b>' + KNOBS.map(([k, label, min, max, step]) =>
      `<label>${label}<input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${TUNING[k]}"><span>${TUNING[k]}</span></label>`).join('') +
      '<div><button data-t="reset">還原</button><button data-t="copy">複製數值</button></div><textarea readonly hidden></textarea>';
  }
  tune.addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return;
    TUNING[k] = +e.target.value; e.target.nextElementSibling.textContent = e.target.value;
    try { localStorage.setItem('drunk-tuning', JSON.stringify(TUNING)); } catch (err) { /* ignore */ }
  });
  tune.addEventListener('click', e => {
    const t = e.target.dataset.t; if (!t) return;
    if (t === 'reset') { Object.assign(TUNING, DEFAULTS); try { localStorage.removeItem('drunk-tuning'); } catch (err) { /* ignore */ } buildTune(); }
    if (t === 'copy') {
      const json = JSON.stringify(Object.fromEntries(KNOBS.map(([k]) => [k, TUNING[k]])));
      const area = tune.querySelector('textarea'); area.hidden = false; area.value = json; area.select();
      if (navigator.clipboard) navigator.clipboard.writeText(json).catch(() => {});
    }
    e.target.blur();
  });
  addEventListener('keydown', e => { if (e.code === 'Backquote' && !e.repeat) { tune.hidden = !tune.hidden; if (!tune.hidden) buildTune(); } });

  // ---------- menu & level loading ----------
  function toggleMenu(force) {
    menu.hidden = force !== undefined ? !force : !menu.hidden;
    held.left = held.right = held.jump = false; pressed = {};
    menuMsg.textContent = '';
  }
  function load(textData, name) {
    try { game = new Game(parseCampaign(textData)); roomKey = ''; toggleMenu(false); }
    catch (err) { toggleMenu(true); menuMsg.textContent = `${name} 讀不進來：\n${err.message}`; }
  }
  menu.addEventListener('click', e => {
    const act = e.target.dataset && e.target.dataset.act; if (!act) return;
    if (act === 'resume') toggleMenu(false);
    if (act === 'retry') { toggleMenu(false); game.die(); }
    if (act === 'restart') { game.startMap(0); toggleMenu(false); }
    if (act === 'default') { game = new Game(window.DEFAULT_CAMPAIGN); roomKey = ''; toggleMenu(false); }
    if (act === 'load') fileInput.click();
  });
  fileInput.addEventListener('change', () => { const f = fileInput.files[0]; if (f) f.text().then(t => load(t, f.name)); fileInput.value = ''; });
  addEventListener('dragover', e => e.preventDefault());
  addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) f.text().then(t => load(t, f.name)); });
})();
</script>
</body>
</html>
