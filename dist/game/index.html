<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>醉隱 · 深夜旅程</title><link rel="stylesheet" href="style.css"></head><body class="game-body"><header class="topbar"><a class="brand" href="index.html"><span class="brandmark">酔</span><span>醉隱 <small>ROOM STUDIO</small></span></a><nav><a class="active" href="index.html">遊戲本體</a><span class="muted">GAME</span></nav><div class="top-actions"><button id="game-import">載入關卡 JSON</button><button id="restart">重新開始</button></div></header><main class="game-main"><div class="game-heading"><div><div class="eyebrow">ONE ROOM. ONE MORE TRY.</div><h1 id="campaign-title">醉隱 · 深夜旅程</h1><p id="game-location">載入中</p></div><div class="game-stats"><div><small>重試</small><strong id="deaths">00</strong></div><div><small>時間</small><strong id="elapsed">00:00</strong></div><button id="pause">暫停</button></div></div><div class="game-frame"><canvas id="game-canvas" width="1280" height="720" tabindex="0" aria-label="遊戲畫面，A D 移動，空白跳躍，E 選卡，K 發動"></canvas><div id="game-notice" class="game-notice" role="status"></div><div id="overlay" class="game-overlay"><div class="overlay-content"><div class="eyebrow">DRUNKEN SOUL / CHAPTER 01</div><h2>借一點酒意，<br>越過這個夜晚。</h2><p>每個房間都是新的挑戰。<br>抽一種能力，讓醉隱帶你過去。</p><button id="start-game" class="primary">開始旅程 →</button><div class="overlay-controls">A / D 移動　 SPACE 跳躍　 E 選卡　 K 發動</div></div></div></div><div class="game-bottom"><div class="ability-card"><div id="ability-icon" class="ability-icon">↗</div><div><small id="card-state">能力待抽選</small><h3 id="ability-name">摔角烈酒</h3><p id="ability-description"></p></div><button id="cycle-button">E 開始輪播</button><button id="use-button">K 發動</button></div><div class="objective-card"><small>ROOM OBJECTIVE</small><strong id="objective">抵達出口</strong><span id="objective-progress"></span></div></div><footer class="game-footer"><span>固定鏡頭 · 死亡原房間重試 · <kbd>R</kbd> 重試 <kbd>ESC</kbd> 暫停</span><span>JSON 關卡 · 獨立遊戲
